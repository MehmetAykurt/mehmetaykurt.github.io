<section class="share-links" aria-label="Paylaşım bağlantıları">
  <h2>Paylaş</h2>

  {% assign page_url = page.url | absolute_url %}
  {% assign page_title = page.title | default: site.title %}

  <p>
    <a href="https://api.whatsapp.com/send?text={{ page_title | uri_escape }}%20{{ page_url | uri_escape }}" target="_blank" rel="noopener">WhatsApp</a>
    |
    <a href="https://twitter.com/intent/tweet?text={{ page_title | uri_escape }}&url={{ page_url | uri_escape }}" target="_blank" rel="noopener">X</a>
    |
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ page_url | uri_escape }}" target="_blank" rel="noopener">Facebook</a>
    |
    <a href="https://t.me/share/url?url={{ page_url | uri_escape }}&text={{ page_title | uri_escape }}" target="_blank" rel="noopener">Telegram</a>
  </p>
</section>
