---
layout: page
title: Site İçi Arama
subtitle: Şiirler, yazılar ve çalışmalar içinde arama
permalink: /arama/
---

<section aria-labelledby="arama-sayfasi-basligi">
  <h2 id="arama-sayfasi-basligi">Site İçi Arama</h2>

  <form action="{{ '/arama/' | relative_url }}" method="get" role="search">
    <label for="arama-kutusu">Aranacak kelimeyi yazınız.</label>

    <input
      type="search"
      id="arama-kutusu"
      name="q"
      placeholder="Şiir, yazı veya eklenti ara"
      autocomplete="off"
    >

    <button type="submit">Ara</button>
  </form>

  <p id="arama-bilgi" aria-live="polite">
    Arama yapmak için kutuya bir kelime yazıp Ara düğmesine basın.
  </p>

  <ul id="arama-sonuclari"></ul>
</section>

<script>
(function () {
  var yazilar = [
    {% for post in site.posts %}
      {
        "baslik": {{ post.title | jsonify }},
        "adres": {{ post.url | relative_url | jsonify }},
        "tarih": {{ post.date | date: "%d.%m.%Y" | jsonify }},
        "ozet": {{ post.excerpt | strip_html | strip_newlines | jsonify }},
        "icerik": {{ post.content | strip_html | strip_newlines | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function parametreAl(ad) {
    var adresParametreleri = new URLSearchParams(window.location.search);
    return adresParametreleri.get(ad) || "";
  }

  function metniKucult(metin) {
    return (metin || "").toLocaleLowerCase("tr-TR");
  }

  function sonucOlustur(yazi) {
    var li = document.createElement("li");

    var baglanti = document.createElement("a");
    baglanti.href = yazi.adres;
    baglanti.textContent = yazi.baslik;

    var tarih = document.createElement("span");
    tarih.textContent = " - " + yazi.tarih;

    var ozet = document.createElement("p");
    ozet.textContent = yazi.ozet;

    li.appendChild(baglanti);
    li.appendChild(tarih);
    li.appendChild(ozet);

    return li;
  }

  var aramaKutusu = document.getElementById("arama-kutusu");
  var sonucListesi = document.getElementById("arama-sonuclari");
  var bilgiAlani = document.getElementById("arama-bilgi");

  var aranan = parametreAl("q").trim();
  aramaKutusu.value = aranan;

  if (!aranan) {
    return;
  }

  var arananKucuk = metniKucult(aranan);

  var sonuclar = yazilar.filter(function (yazi) {
    var aranacakMetin = [
      yazi.baslik,
      yazi.ozet,
      yazi.icerik
    ].join(" ");

    return metniKucult(aranacakMetin).indexOf(arananKucuk) !== -1;
  });

  sonucListesi.innerHTML = "";

  if (sonuclar.length === 0) {
    bilgiAlani.textContent = "Aramanızla eşleşen içerik bulunamadı.";
    return;
  }

  bilgiAlani.textContent = sonuclar.length + " sonuç bulundu.";

  sonuclar.forEach(function (yazi) {
    sonucListesi.appendChild(sonucOlustur(yazi));
  });
})();
</script>
