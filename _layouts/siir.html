---
layout: default
---

<article class="poem-entry">
  <header class="post-header">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="page-date">{{ page.date | date: "%d %B %Y" }}</p>
  </header>

  <div class="poem-content">
    {{ content }}
  </div>

  {% if page.tags and page.tags.size > 0 %}
  <hr>
  <section class="post-tags" aria-label="Etiketler">
    <h2>Etiketler</h2>
    <p>
      {% for tag in page.tags %}
        <span>{{ tag }}</span>{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    </p>
  </section>
  {% endif %}

  <hr>

  {% include share-links.html %}
</article>
