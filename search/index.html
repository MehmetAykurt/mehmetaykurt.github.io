layout: page
title: "Site İçi Arama"
permalink: /search/
---

<form class="search-form" id="search-form" role="search">
  <label for="search-input">Aranacak kelime veya başlık</label>
  <input id="search-input" name="q" type="search" autocomplete="off" placeholder="Aranacak ifadeyi yazınız">
  <br>
  <button type="submit">Ara</button>
</form>

<div id="search-status" aria-live="polite"></div>
<div id="search-results"></div>

<script>
(function () {
  var form = document.getElementById('search-form');
  var input = document.getElementById('search-input');
  var status = document.getElementById('search-status');
  var results = document.getElementById('search-results');
  var data = [];

  function getQuery() {
    var params = new URLSearchParams(window.location.search);
    return (params.get('q') || '').trim();
  }

  function normalize(value) {
    return (value || '').toLocaleLowerCase('tr-TR');
  }

  function render(query) {
    results.innerHTML = '';
    if (!query) {
      status.textContent = 'Arama yapmak için bir kelime veya başlık yazınız.';
      return;
    }

    var q = normalize(query);
    var found = data.filter(function (item) {
      return normalize(item.title).indexOf(q) !== -1 || normalize(item.content).indexOf(q) !== -1;
    });

    status.textContent = found.length + ' sonuç bulundu.';

    if (found.length === 0) {
      results.innerHTML = '<p>Aramanızla eşleşen içerik bulunamadı.</p>';
      return;
    }

    found.forEach(function (item) {
      var article = document.createElement('article');
      article.className = 'search-result-item';
      var title = document.createElement('h2');
      var link = document.createElement('a');
      link.href = item.url;
      link.textContent = item.title;
      title.appendChild(link);
      var excerpt = document.createElement('p');
      excerpt.textContent = item.excerpt || '';
      article.appendChild(title);
      article.appendChild(excerpt);
      results.appendChild(article);
    });
  }

  fetch('{{ "/arama-verisi.json" | relative_url }}')
    .then(function (response) { return response.json(); })
    .then(function (json) {
      data = json;
      var query = getQuery();
      input.value = query;
      render(query);
    })
    .catch(function () {
      status.textContent = 'Arama verisi yüklenemedi.';
    });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var query = input.value.trim();
    var url = new URL(window.location.href);
    if (query) {
      url.searchParams.set('q', query);
    } else {
      url.searchParams.delete('q');
    }
    window.history.pushState({}, '', url);
    render(query);
  });
})();
</script>
