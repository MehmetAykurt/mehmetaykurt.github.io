baslik: Dağına göre kar
aciklama: Mehmet Aykurt’un Dağına göre kar adlı şiiri; insanın kendi derdini başkalarının ağır çileleriyle karşılaştırmasını ve umut etmesini öğütler.
tarih: "2027-02-03"
icerikTuru: Şiir
anaTema: Dertlerin göreliliği ve umut
konu: Kişinin çektiği acıyı büyütmeden daha ağır dertleri düşünmesi, Eyüp sabrını hatırlaması ve zamanla acıların dineceğine inanması
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sen bu çektiğini dert mi sayarsın
  Bilsen ki elde neler neler var
  Boynunu büküp de boşa ağlarsın
  Gözyaşı sellere karışanlar var

  Herkesin dertleri kendine tabii
  Eyüp gibi çile çekmedin yani
  Dikeni kılıca benzetme emi
  Hançeri böğrüne yiyenler var

  Zannetme ki böyle devam edecek
  Ağlayanlar elbet bir gün gülecek
  Acılar dinecek dertler bitecek
  Zamanla her şeyi unutanlar var
degerlendirme:
  genelBakis: “Dağına göre kar”, kişinin kendi derdini tek ve en ağır acı sanmaması gerektiğini öğütleyen teselli şiiridir. Gözyaşı sele karışanlar, hançeri böğründe taşıyanlar ve Eyüp gibi çile çekenler hatırlatılarak acının dereceleri gösterilir. Son dörtlük karamsarlığı kırar; bugünkü durumun sonsuza dek sürmeyeceği, ağlayanların güleceği ve zamanın yaraları hafifleteceği söylenir.
  temaVeKonu: Ana tema dertlerin göreliliği ve umuttur. Şiirin konusu, boynunu büküp ağlayan kişiye dünyada daha ağır sınavlardan geçen insanların bulunduğunu göstermektir. Diken ile kılıç, sıradan sıkıntıyla derin yara arasındaki ölçüyü kurar. Eyüp kıssası sabrın en yüksek örneği olarak anılır. Son bölümde acının geçiciliği ve unutmanın iyileştirici gücü, öğüdü geleceğe açık bir teselliye dönüştürür.
  dilVeSoylevis: Dil doğrudan, samimi ve öğütleyicidir. “Sen bu çektiğini dert mi sayarsın” sorusu muhatabı sarsarak düşünmeye çağırır. “Neler neler” tekrarı bilinmeyen acıların çokluğunu, “emi” sözü konuşmanın yakınlığını gösterir. Sel, diken, kılıç ve hançer imgeleri acı derecelerini somutlaştırır. “Ağlayanlar elbet bir gün gülecek” karşıtlığı umut mesajını yalın ve kesin biçimde verir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır. Her dörtlüğün sonunda tekrarlanan “var” sözü, söyleyicinin örneklerini kesin tanıklıklar gibi sunar. İlk bölüm başkalarının gözyaşını, ikinci bölüm ağır çileyi, üçüncü bölüm iyileşme ihtimalini işler. “Edecek/gülecek/bitecek” gelecek zaman uyakları son bölümün umutlu hareketini güçlendirir.
  gelenekVeSonuc: Eyüp peygamberin sabrına gönderme, halk söyleyişindeki karşılaştırmalar ve doğrudan öğüt eseri âşık edebiyatının didaktik çizgisine yerleştirir. Başlık, her dağın taşıdığı kara göre her insanın da kendine uygun bir yükü bulunduğu düşüncesini çağrıştırır. Eserin sonucu, acıyı küçümsemek değil onu daha geniş bir insanlık deneyimi içinde görmek ve hiçbir sıkıntının sonsuza dek sürmeyeceğine inanmaktır.
sira: 74
