baslik: Sorulur Bir Gün
aciklama: Mehmet Aykurt’un Sorulur bir gün adlı şiiri; mazlumların acısı karşısında haz süren ve zulmeden kişilerin mutlaka hesap vereceğini anlatır.
tarih: "2027-04-10"
icerikTuru: Şiir
anaTema: Zulmün hesabı ve ilahi adalet
konu: Çocukların ve mazlumların ölümü sürerken duyarsız kalanların, zalimce el uzatanların Firavun gibi sonunda karşılık bulması
siirTuru: Toplumsal ve dinî şiir
gelenek: Halk şiiri ve taşlama geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir yanda akarken gözlerden yaşlar
  Diğer yanda susmayan çalınan sazlar
  Kıyamet koparken alınan hazlar
  Gün gelir boynuna dolanır bir gün

  Kimisi beşikte kimi kucakta
  Kimisi on yedi kimi kırkında
  Kara toprak boyanmış kızıl kanlara
  Gün gelir sana da bulaşır bir gün

  Dilleri lanetler içleri serin
  Zerrece kızarmaz cemali tenin
  Mazlumun üstüne uzanan elin
  Gün gelir kökünden kırılır bir gün

  Neler gördü neler bu koca dünya
  Firavun'un haline dönüp baksana
  Zalimlerin zulmü kalmaz yanına
  Gün gelir hesabı sorulur bir gün
degerlendirme:
  genelBakis: “Sorulur bir gün”, bir yanda gözyaşı ve ölüm varken öte yanda sazlarla haz süren duyarsız insanları ve zalimleri ilahi hesapla yüzleştiren toplumsal şiirdir. Beşikten kırk yaşına kadar ölenlerin kanı kara toprağı boyar. Dili lanet ederken içi serin kalan ikiyüzlü tavır eleştirilir. Son dörtlükte Firavun örneği verilerek hiçbir zulmün karşılıksız kalmayacağı hükmü kesinleştirilir.
  temaVeKonu: Ana tema zulmün hesabı ve ilahi adalettir. Şiirin konusu, kıyamet gibi bir felaket yaşanırken eğlenmeye devam edenlerin, mazlumlara el uzatanların ve acı karşısında yüzü kızarmayanların gelecekte aynı sonuçla karşılaşmasıdır. Kanın toprağa ve zalime bulaşması, suçun gizlenemeyeceğini gösterir. Firavun’un sonu tarihsel-dinî bir ibret örneği olarak bugünkü zalimlerin önüne konur.
  dilVeSoylevis: Dil sert, suçlayıcı ve kehanet gibi kesin bir tondadır. “Bir yanda/diğer yanda” karşıtlığı yas ile eğlenceyi aynı görüntüde buluşturur. Beşik, kucak, yaş sayıları ve kızıl kan, kaybı somutlaştırır. “Gün gelir” kalıbı geciken adaletin mutlaka geleceğini bildirir. “Baksana” hitabı dinleyeni Firavun kıssasına yöneltir; “kökünden kırılır” sözü zalimin gücünün bütünüyle yok oluşunu anlatır.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; uzun dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda yinelenen “bir gün” redifi gelecekteki hesabı ritmik olarak sabitler. İlk bölüm duyarsızlığı, ikinci bölüm kurbanları, üçüncü bölüm zalimin elini, son bölüm tarihsel ibreti ele alır. Yapı görüntüden suça ve oradan hükme doğru ilerler.
  gelenekVeSonuc: Mazlum, zalim, kıyamet, kara toprak ve Firavun kavramları halkın dinî-toplumsal hafızasına dayanır. Haksızlığa karşı açık hüküm vermesi şiiri taşlama geleneğine yaklaştırır. Eserin sonucu, gözyaşı karşısında duyarsız kalmanın ve mazluma uzanan elin sahibine döneceğidir. Dünya birçok zalim görmüştür; hiçbirinin zulmü yanında kalmamış, hesabı er ya da geç sorulmuştur.
