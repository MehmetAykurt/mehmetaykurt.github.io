baslik: Anlamadım
aciklama: Mehmet Aykurt’un Anlamadım adlı şiiri; siyasetteki beklenmedik geri dönüşleri ölümden dönme benzetmesiyle hicveden mizahi bir taşlamadır.
tarih: "2026-11-02"
icerikTuru: Şiir
anaTema: Siyasi geri dönüş ve şaşkınlık
konu: Siyasetten çekildiği düşünülen bir kişinin yeniden görünmesini mezardan dönüş ve kopya benzetmeleriyle sorgulamak
siirTuru: Mizahi şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Anlamadım şu siyaset işini
  Sustu derken yazageldi arkadaş
  Nasıl atlatırsın bilmem eceli
  Öldü derken çıkageldi arkadaş

  Yatamayıp kaçtı desek mezardan
  Üzerinde zerre iz yok topraktan
  Hiç şikâyet etmiyor da halından
  Kameraya poz veriyor arkadaş

  Çin işi mi Japon işi mi acaba
  Halk içinde kopya diyen çok fazla
  Bu işte bir numara var ama
  Kafa yormak kâr etmiyor arkadaş

  Der Mehmet'im isim falan vermedim
  Aleyhinde kötü bir şey demedim
  Yalan yok birazcık da sevindim
  Oh derken vah'a düştük arkadaş
degerlendirme:
  genelBakis: “Anlamadım”, siyasette ortadan kaybolduğu veya sustuğu düşünülen bir kişinin yeniden görünmesini ölümden dönüşe benzeterek hicveden mizahi bir şiirdir. Mezar, toprak izi, kopya ve kamera görüntüleri çevresinde kurulan anlatı, şaşkınlığı bilinçli bir abartıya dönüştürür. Anlatıcı isim vermediğini ve kötü söz söylemediğini belirterek taşlamasını ironik bir korunma diliyle sürdürür.
  temaVeKonu: Ana tema siyasi geri dönüş ve şaşkınlıktır. Şiirin konusu, siyaset sahnesinden çekildiği sanılan kişinin yeniden ortaya çıkmasıdır. İlk dörtlükte susma ile ölüm, geri dönüş ile mezardan çıkma arasında benzerlik kurulur. Sonraki bölümlerde toprak izi taşımayan görüntü, kamera pozu ve kopya kuşkusu mizahı büyütür. Son dörtlükte sevinç ile yeniden hayal kırıklığı yaşama ihtimali yan yana gelir.
  dilVeSoylevis: Dil konuşma havasında, şaşkın ve alaycıdır. “Arkadaş” hitabının sürekli tekrarı, anlatıcının gözlemlerini yakın çevresine aktaran bir sohbet tonu kurar. “Çin işi mi Japon işi mi”, “bu işte bir numara var” ve “isim falan vermedim” sözleri gündelik mizahı besler. Açıkça isim vermekten kaçınma, eleştiriyi gizlemez; tersine ironik biçimde daha görünür hâle getirir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; birkaç dizede hece farklılığı görülür. Dörtlük sonlarındaki “arkadaş” sözü redif ve hitap görevi görür. “Mezardan / topraktan / halından”, “acaba / fazla / ama” ve “vermedim / demedim / sevindim” ses birlikleri ahengi destekler. Şaşkınlık örnekleri her bölümde artarak mizahi bir anlatı zinciri kurar.
  gelenekVeSonuc: Siyasi kişileri ad vermeden ima yoluyla eleştirmek, abartıdan ve günlük konuşma dilinden yararlanmak halk şiirindeki taşlama geleneğine uygundur. Şair “Der Mehmet’im” sözüyle kendisini anarken aynı anda eleştirisinin sorumluluğunu mizahla hafifletir. Eserin öne çıkan yönü, siyasi geri dönüşü mezardan çıkma ve kopya görüntüsü çevresinde kurduğu gerçeküstü benzetmelerle anlatmasıdır.
sira: 43
taslak: false
