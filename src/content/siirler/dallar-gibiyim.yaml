baslik: Dallar Gibiyim
aciklama: Mehmet Aykurt’un Dallar gibiyim adlı şiiri; tükenen umudu, ömrün geçişini ve varlık içindeki yokluk duygusunu işler.
tarih: "2026-09-18"
icerikTuru: Şiir
anaTema: Umutsuzluk, fanilik ve yokluk
konu: Gönül yarasıyla kuruyan umutların, geçen ömrün ve insanın varlık içinde kendini yok hissetmesinin anlatılması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Kalmışım biçare gönül yaralı
  Lokman hekim gelse yoktur ilacı
  Kökünden kurumuş umut ağacı
  Meyvesi olmayan dallar gibiyim

  Yaşımız erişti artık kemale
  Geldi de geçiyor ömrüm beyhude
  Hiç gözüm kalmadı gelecek günde
  Kalemi kırılmış mahkûm gibiyim

  Derler ya hep sabrın sonu selamet
  Ne zaman erişir bilmem bu himmet
  Taşıdığım canım bile emanet
  Varlığın içinde yokluk gibiyim
degerlendirme:
  genelBakis: “Dallar gibiyim”, gönül yarasının tükettiği umudu, ömrün geçişini ve insanın varlık içinde hissettiği yokluğu anlatan içli bir şiirdir. Kökünden kuruyan umut ağacı, geleceğe meyve veremeyen bir hayatı simgeler. Ömür kemale erişirken mahkûmiyet duygusu ağırlaşır; sabır ve himmet beklentisi sürse de şiir, emanet canın taşıdığı derin bir eksiklikle son bulur.
  temaVeKonu: Ana tema umutsuzluk, fanilik ve yokluktur. İlk dörtlükte gönül yarasının Lokman Hekim’in bile iyileştiremeyeceği bir derde dönüşmesi anlatılır. İkinci bölümde ömrün boşuna geçtiği ve geleceğe ilişkin isteğin tükendiği görülür. Son dörtlük sabır, himmet ve canın emanet oluşu üzerinden düşünceyi manevi bir alana taşır; kişi var olduğu hâlde kendisini yok hisseder.
  dilVeSoylevis: Dil sade fakat güçlü benzetmelerle yüklüdür. “Umut ağacı”, “meyvesi olmayan dallar” ve “kalemi kırılmış mahkûm” sözleri çaresizliği somut görüntülere dönüştürür. Lokman Hekim, selamet, himmet ve emanet kelimeleri geleneksel hikmet dilini besler. “Gibiyim” tekrarı, anlatıcının ruh hâlini her dörtlükte başka bir yokluk ve hükümlülük görüntüsüyle tanımlamasını sağlar.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle düzenli biçimde kurulmuştur. Dörtlüklerin son dizelerinde tekrarlanan “gibiyim” sözü redif görevi görür. “Yaralı / ilacı / ağacı”, “kemale / beyhude / günde” ve “selamet / himmet / emanet” ses yakınlıkları ahengi destekler. Anlatım, kuruyan umuttan geçen ömre, oradan varlık içindeki yokluğa doğru aşamalı biçimde derinleşir.
  gelenekVeSonuc: Gönül yarası, Lokman Hekim, sabrın sonundaki selamet, himmet ve canın emanet oluşu halk şiiri ile tasavvufi düşüncenin ortak söz varlığına dayanır. Şiir bireysel umutsuzluğu fanilik ve kader anlayışıyla birleştirir. Eserin öne çıkan yönü, köksüzleşen umut ile meyvesiz dal benzetmesini yaşamın boşa geçişi ve insanın kendisini yok hissetmesiyle bütünleştirmesidir.
