baslik: Ben de varım
aciklama: Mehmet Aykurt’un Ben de varım adlı şiiri; erenler yoluna katılma, birlik, semah, Hacı Bektaş ocağında pişme ve Hak’ta varlık bulma arzusunu anlatır.
tarih: "2027-03-08"
icerikTuru: Şiir
anaTema: Erenler yoluna teslimiyet ve birlik
konu: İmam Hüseyin ve Hazreti Ali aşkıyla erenler safına katılmak, semah ve sazla birliğe ermek, dört kapının sırlarını öğrenip Hak yolunda ölmek
siirTuru: Tasavvufi şiir
gelenek: Alevi-Bektaşi şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ey erenler kapınıza
  Ben de varım diye geldim
  Ben bu başı yolunuza
  Kurban edem diye geldim

  Yer var ise safınızda
  Alın beni aranıza
  İmam Hüseyin aşkına
  Ben de yanam diye geldim

  Semaha durmuş şu dünya
  Döner Ali'nin aşkına
  Ayrı durmak kime fayda
  Birlik olam diye geldim

  Hacı Bektaş dergahında
  Biz de pişsek ocağında
  Dört kapının sırlarına
  Ben de erem diye geldim

  Zakir niyaz ile sazı
  Alır ele çalar bazı
  Doya doya aşk şarabı
  Ben de içem diye geldim

  Vursam saza inler telim
  Zikir eyler Hakk'a dilim
  Şu dünyada hiçbir şeyim
  Varlık bulam diye geldim

  Der Mehmet'im sevgi yolu
  Hakka varır yolun sonu
  Geldi geçti ömrün çoğu
  Burda ölem diye geldim
degerlendirme:
  genelBakis: “Ben de varım”, erenler kapısına gelen söyleyicinin yol uğruna başını verme, saf içinde yer alma ve Hak aşkında yanma arzusunu dile getiren tasavvufi bir şiirdir. İmam Hüseyin, Hazreti Ali ve Hacı Bektaş çevresinde kurulan bağlılık; semah, zakir, saz, zikir ve aşk şarabıyla yaşanan bir yolculuğa dönüşür. Son dörtlükte sevgi yolunun Hakk’a vardığı ve bu yolda ölme isteği belirtilir.
  temaVeKonu: Ana tema erenler yoluna teslimiyet ve birliktir. Şiirin konusu, ayrı durmanın faydasızlığını anlayıp topluluğa katılmak, İmam Hüseyin aşkıyla yanmak, dört kapının sırlarına ermek ve Hacı Bektaş ocağında pişmektir. Söyleyici dünyadaki hiçliğini kabul ederken Hak yolunda varlık bulmayı amaçlar. Ömrün çoğunun geçtiği bilinci, manevi menzile ulaşma arzusunu daha acil ve içten kılar.
  dilVeSoylevis: Dil niyaz eden, coşkulu ve teslimiyet doludur. “Diye geldim” redifi her dörtlükte niyeti yeniden açıklar. Kapı, saf, ocak ve dört kapı yolun kurumsal-manevi yönünü; semah, saz, tel ve zikir ibadet ile sanatın birlikteliğini gösterir. “Aşk şarabı” tasavvufi vecdi simgeler. “Der Mehmet’im” tapşırması finalde kişisel kimliği sevgi yolunun genel hükmüyle birleştirir.
  ahenkVeYapi: Şiir yedi dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. Her dörtlüğün ikinci ve dördüncü dizelerinde tekrarlanan “diye geldim” kalıbı güçlü bir nefes ritmi oluşturur. Yapı kapıya gelişten safa, semaha, dergâha, saz ve zikre, varlık bulmaya ve ölüme doğru ilerler. Bu basamaklar dışarıdan içeriye, topluluktan manevi tamamlanmaya uzanan bir yol haritası çizer.
  gelenekVeSonuc: İmam Hüseyin, Hazreti Ali, Hacı Bektaş, semah, zakir, niyaz, dört kapı ve aşk şarabı şiiri Alevi-Bektaşi nefes geleneğine güçlü biçimde bağlar. Saz ile zikrin aynı dörtlükte buluşması âşık kimliğiyle inanç yolunu birleştirir. Eserin sonucu, ayrılığın değil birliğin, benlik iddiasının değil teslimiyetin ve sevgi yolunda hiçleşerek Hak’ta varlık bulmanın yüceltilmesidir.
