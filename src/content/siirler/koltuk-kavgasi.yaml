baslik: Koltuk Kavgası
aciklama: Mehmet Aykurt’un Koltuk kavgası adlı şiiri; seçim dönemlerindeki vaatleri, çıkar ilişkilerini ve siyasal gösterişi eleştiren bir taşlamadır.
tarih: "2026-10-30"
icerikTuru: Şiir
anaTema: Siyasi çıkarcılık ve seçim vaatleri
konu: Seçim döneminde halka yaklaşan siyasetçilerin vaatleri, oy hesabı ve sandık sonrasında unutulan sözlerin eleştirilmesi
siirTuru: Toplumsal taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bak yine başladı koltuk kavgası
  Halimi hatırımı sorarlar şimdi
  Köylüyü kentliyi dağda çobanı
  Arayıp tarayıp bulurlar şimdi

  Havada uçuşur bin bir vaatler
  Yalana alışmış yorulmaz diller
  Bir gün uzanıp da sıkılmayan eller
  Mübarek sayılıp öpülür şimdi

  Vekiller karışır halkın içine
  Vatandaşa biraz şirin görüne
  Hatırlamaz iken bizi bir kere
  Kolumuza bile girerler şimdi

  Meydana doluşur yüzlerce insan
  Kimisi Var ol der kimisi aman
  Söylenen her şey külliyen yalan
  Doğruyu bulmak zor olur şimdi

  Gençlere iş emekliye zam
  Oluru vardı da ne durdunuz lan
  Tek tek oyların hesabın yapan
  Sandığa girince toz olur şimdi

  Kimisi sığınır dinin ardına
  Kimisi şehit vatan aşkına
  Elimizde yok ki verecek başka
  Diyerek mühürler basılır şimdi

  Der Mehmet'im sözü fazla uzatma
  Konuşup da zülfü yâre dokunma
  İçimden neler geçiyor ama
  Çekilip köşeye susmalı şimdi
degerlendirme:
  genelBakis: “Koltuk kavgası”, seçim dönemlerinde siyasetçilerin halka yönelişini, çoğalan vaatleri ve oy hesabını eleştiren kapsamlı bir toplumsal taşlamadır. Normal zamanda hatırlanmayan köylü, kentli ve çoban aranıp bulunur; sıkılmayan eller öpülür, vekiller halkın koluna girer. Sandık yaklaştıkça büyüyen yakınlık ve vaatler, seçim sonrasında kaybolacak geçici bir gösteri olarak sunulur.
  temaVeKonu: Ana tema siyasi çıkarcılık ve seçim vaatleridir. Şiirin konusu, iktidar arzusunun halkla kurulan ilişkiyi samimiyetten çıkarıp oy hesabına dönüştürmesidir. İş ve zam sözleri, din, şehitlik ve vatan gibi değerlerin kullanılmasıyla birlikte ele alınır. Son dörtlükte anlatıcı, düşüncelerini bütünüyle söylemenin tehlikesini sezerek geri çekilir; böylece taşlamaya baskı ve suskunluk boyutu eklenir.
  dilVeSoylevis: Dil doğrudan, konuşma havasında ve sert bir mizah taşır. “Koltuk kavgası”, “vaatler havada uçuşur”, “şirin görünmek” ve “sandığa girince toz olmak” sözleri siyasi davranışları somutlaştırır. “Oluru vardı da ne durdunuz lan” dizesi öfkeyi gündelik dilin açıklığıyla verir. “Zülfü yâre dokunma” deyimi, eleştirinin sınırını ve anlatıcının kendini koruma ihtiyacını sezdirir.
  ahenkVeYapi: Şiir yedi dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde farklılık görülür. Her dörtlüğün sonunda yinelenen “şimdi” sözü redif görevi görerek seçim döneminin geçici yakınlığını vurgular. “Vaatler / diller / eller”, “insan / aman / yalan” ve “uzatma / dokunma / ama” ses birlikleri ahengi destekler. Örnekler dörtlükler boyunca birikerek eleştiriyi büyütür.
  gelenekVeSonuc: Yöneticileri ve toplumsal düzeni doğrudan halkın diliyle eleştirmek, taşlama geleneğinin temel işlevlerindendir. Şiir, âşığın kendi adını anması ve deyimlerden yararlanmasıyla bu geleneği sürdürür. Eserin öne çıkan yönü, seçim davranışlarını köylüden emekliye uzanan geniş bir toplumsal çevrede göstermesi ve son dörtlükte taşlamayı susmak zorunda kalan şairin öz eleştirisiyle tamamlamasıdır.
