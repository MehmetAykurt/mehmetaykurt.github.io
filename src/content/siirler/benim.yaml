baslik: Benim
aciklama: Mehmet Aykurt’un Benim adlı şiiri; hayattayken yanında olmayan kişilerin cenazesine ve mahşerdeki hesabına katılmasını reddeder.
tarih: "2027-04-13"
icerikTuru: Şiir
anaTema: Vefasızlığa karşı ölüm sonrası tavır
konu: Sağlığında selam vermeyen, yoldaş olmayan ve hakkından emin bulunmayan kişilerin cenazeden ve mahşerdeki hesaptan uzak tutulması isteği
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Öldüğümü duyanlar bir gün ellerden
  Utanıp gelmesin sakın milletten
  Sağlığımda bir kez selam vermeyen
  Cenazem başında durmasın benim

  İster kavim olsun isterse gardaş
  İster dostum olsun isterse sırdaş
  Hayattayken bana değilse yoldaş
  Tabutum ardından gelmesin benim

  İster helal etsin isterse haram
  Cehenneme girsem dilemem eman
  Varsa ki hakkından emin olmayan
  Gelip de mahşerde yormasın benim
degerlendirme:
  genelBakis: “Benim”, hayattayken ilgi ve yoldaşlık göstermeyen kişilerin ölümden sonra cenazeye gelmesini reddeden sert bir vefa şiiridir. Selam vermeyen, yanında yürümeyen ve hakkından emin olmayan insanların toplumsal baskıyla cenaze başında görünmesi anlamsız bulunur. Son dörtlükte söyleyici, helallik ve haramlık hesabını mahşere taşır; cehennem ihtimalini bile sahte bir eman talebine tercih eder.
  temaVeKonu: Ana tema vefasızlığa karşı ölüm sonrası tavırdır. Şiirin konusu, sağlıkta kurulmayan ilişkinin ölüm töreniyle telafi edilemeyeceğidir. Kavim, kardeş, dost ve sırdaş gibi yakınlık adları tek başına yeterli görülmez; asıl ölçü hayattayken yoldaş olmaktır. Hakkından emin olmayan kişinin mahşerde de uzak durması istenir. Böylece cenaze, toplumsal gösteriş değil gerçek ilişkinin sınandığı son eşik olur.
  dilVeSoylevis: Dil doğrudan, kararlı ve kırgınlık yüklüdür. “Gelmesin, durmasın, yormasın” fiilleri ölüm sonrasına ilişkin kesin sınırlar çizer. “İster ... ister” tekrarları akrabalık ve dostluk unvanlarının davranış olmadan değersizliğini gösterir. “Gardaş, yoldaş, sırdaş” ses dizisi yakınlık halkasını kurar. “Benim” redifi, cenaze, tabut ve mahşer üzerindeki kişisel iradeyi sürekli öne çıkarır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonundaki “benim” redifi şiirin sahiplik ve sınır koyma tonunu güçlendirir. İlk bölüm cenaze başını, ikinci bölüm tabut arkasını, üçüncü bölüm mahşeri ele alır. Yapı dünyadaki törenden ahiret hesabına ilerleyerek vefasızlığın sonuç alanını genişletir.
  gelenekVeSonuc: Cenaze, tabut, helallik, haram ve mahşer kavramları halkın ölüm ve ahiret kültürüne dayanır. Vefa ile gösterişi karşılaştıran sert söyleyiş şiiri âşık edebiyatının kişisel taşlama damarına yaklaştırır. Eserin sonucu, ölümden sonra yapılan kalabalık ziyaretlerin hayattaki bir selamın ve gerçek yoldaşlığın yerini tutamayacağıdır; samimiyet zamanında gösterilmelidir.
