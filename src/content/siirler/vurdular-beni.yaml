baslik: Vurdular Beni
aciklama: Mehmet Aykurt’un Vurdular beni adlı şiiri; insanın yaşarken öldürülmesini, gizli gözyaşını ve anlaşılmamanın acısını işler.
tarih: "2026-09-24"
icerikTuru: Şiir
anaTema: Ruhsal yıkım ve anlaşılmama
konu: Çevresindeki insanların darbeleriyle umudunu yitiren kişinin acısını gizlemesi ve sonunda deli sayılması
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Yaşıyorum sanma ayaktayım diye
  Yüzüme baka baka vurdular beni
  Bulanmamışken henüz ecel terine
  Diri diri mezara koydular beni

  Yaşarken de ölür bazı insanlar
  Kaybolur yarınlar biter umutlar
  Her zaman dışarı akmaz ki yaşlar
  Ağlarken gülüyor sandılar beni

  Hiç kimseye anlatmadım derdimi
  Düşüne düşüne yedim kendi kendimi
  Yar uğruna verdim bütün serimi
  En sonunda deliye saydılar beni
degerlendirme:
  genelBakis: “Vurdular beni”, bedenen ayakta olsa da ruhen yıkılmış insanın görünmeyen acısını anlatan karanlık ve içli bir şiirdir. Anlatıcı, eceli gelmeden diri diri mezara konulduğunu söyler; umutlarını kaybeder ve gözyaşını içine akıtır. Derdini kimseye açmadığı için çevresi onun gülüşünü mutluluk sanır, sevda uğruna tükenen kişi sonunda deli sayılır.
  temaVeKonu: Ana tema ruhsal yıkım ve anlaşılmamadır. Şiirin konusu, insanların darbeleriyle yaşarken ölüme sürüklenen kişinin acısının çevresi tarafından fark edilmemesidir. İlk dörtlükte uğranılan ağır haksızlık, ikinci bölümde kaybolan yarınlar ve gizli gözyaşı anlatılır. Son dörtlükte derdin içe atılması, kendini tüketme ve sevda uğruna her şeyi verme, yalnızlığı son noktaya taşır.
  dilVeSoylevis: Dil yalın, sert ve doğrudan bir hesaplaşma tonuna sahiptir. “Ayakta olmak” ile “yaşamak”, “ağlamak” ile “gülmek”, “diri olmak” ile “mezara konmak” arasındaki karşıtlıklar şiirin anlam gerilimini kurar. “Vurdular, koydular, sandılar, saydılar” fiilleri yapılan haksızlıkların öznesini belirsiz ama kuşatıcı bir topluluğa dönüştürür. Söyleyiş bir iç döküş niteliğindedir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; dizeler arasında hece farklılıkları vardır. Dörtlük sonlarında yinelenen “beni” sözü redif görevi görerek anlatıcının uğradığı eylemleri aynı merkezde toplar. “İnsanlar / umutlar / yaşlar” ve “derdimi / kendimi / serimi” uyakları ahengi destekler. Tekrarlanan çoğul fiiller şiire ağır bir darbe ritmi verir.
  gelenekVeSonuc: Yaşarken ölmek, diri diri mezara konmak, gözyaşını içine akıtmak ve sevda uğruna ser vermek halk şiirinde acıyı büyüten güçlü anlatım biçimleridir. Şiir bu geleneksel sözleri anlaşılmayan insanın ruhsal yıkımıyla birleştirir. Eserin öne çıkan yönü, dışarıdan görünen gülüş ile içeride yaşanan ağlayış arasındaki uçurumu sade fakat sarsıcı bir dille ortaya koymasıdır.
sira: 30
