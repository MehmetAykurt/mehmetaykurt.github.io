baslik: Gönül Dediğin
aciklama: Mehmet Aykurt’un Gönül Dediğin adlı şiiri; gönlün söz dinlemeyen, umut ve sevdaya tutunan yönünü halk şiiri söyleyişiyle anlatır.
tarih: "2026-07-24"
icerikTuru: Şiir
anaTema: Gönül ve sevda
konu: Gönlün söz ve nasihat dinlemeyen, imkânsızlığa rağmen umuda, hayale ve sevdaya tutunan yapısı
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: "https://www.youtube.com/watch?v=T-r53iLDUKk&source_ve_path=OTY3MTQ&embeds_referring_euri=https%3A%2F%2Fmehmetaykurt.com.tr%2F"
siirMetni: |-
  Ne dile gerek var ne bir söze
  Kelamsız konuşur gönül dediğin
  Kanarsa yarası akar içine
  Gizli gizli sarar gönül dediğin

  Bir bakıştan binbir mana çıkarır
  Her manada bir umuda kapılır
  Olmaz desen de olacak sanır
  Hiç laftan anlamaz gönül dediğin

  Nasihat etsen de kar etmez ona
  Çatar kaşlarını gitmezse hoşa
  Üzerine gelsin isterse dünya
  Hiçbir şeyden korkmaz gönül dediğin

  Dalar hayallere kendi kendine
  Daldığı hayalin düşer peşine
  Açıkça görse de kendi gözüyle
  Yine de inanmaz gönül dediğin

  İmkânsızlık içinde yanar kavrulur
  Düşüne düşüne derde tutulur
  Aldığı her nefes ah u zar olur
  Ölse de vazgeçmez gönül dediğin
degerlendirme:
  genelBakis: “Gönül Dediğin” adlı şiir, gönlün akıl, söz ve nasihat karşısındaki bağımsız tavrını anlatan içten bir şiirdir. Gönül; yarasını içinde taşıyan, bir bakıştan türlü anlamlar çıkaran, umuda kolayca bağlanan ve imkânsızlık karşısında bile sevdiğinden vazgeçmeyen canlı bir varlık gibi ele alınmıştır. Şiirin genel havasında sevda, umut, inat ve içli bir yanış birlikte hissedilir.
  temaVeKonu: Şiirin ana teması gönül ve sevdadır. Konu, gönlün söz dinlemeyen ve kendi bildiği yolda ilerleyen yapısıdır. İlk dörtlükte gönlün söze ihtiyaç duymadan konuşması ve yarasını içine akıtması anlatılır. Sonraki dörtlüklerde bir bakıştan umut çıkarması, nasihate kulak asmaması, hayallerinin peşine düşmesi ve imkânsızlık içinde yansa da sevgisinden vazgeçmemesi işlenir.
  dilVeSoylevis: Şiirin dili sade, doğrudan ve halk söyleyişine yakındır. “Gönül dediğin” ifadesinin yinelenmesi, şiire konuşma havası ve güçlü bir vurgu kazandırır. Gönlün kaş çatması, nasihat dinlememesi, hayale dalması ve korkmaması kişileştirme yoluyla anlatılmıştır. Bu söyleyiş, soyut bir kavram olan gönlü okuyucunun gözünde canlı ve tanıdık bir karaktere dönüştürür.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde küçük hece farklılıkları görülür. Dörtlüklerin sonlarında yinelenen “gönül dediğin” sözü şiirin ana duygusunu bir nakarat gibi pekiştirir. “Çıkarır / kapılır / sanır” ve “kavrulur / tutulur / olur” gibi ses benzerlikleri de şiirin ritmini ve akıcılığını destekler.
  gelenekVeSonuc: Gönül kavramı, Türk halk şiiri ve âşık edebiyatının en köklü motiflerinden biridir. Dörtlük yapısı, hece ölçüsüne dayalı söyleyiş, sade dil, sevda teması ve tekrarlanan “gönül dediğin” ifadesi şiiri bu gelenekle buluşturur. Şiirin öne çıkan yönü, gönlün çelişkili hâllerini öğüt veren fakat yargılamayan sıcak bir anlatımla sunması ve vazgeçmeyen sevdayı güçlü bir sona bağlamasıdır.
