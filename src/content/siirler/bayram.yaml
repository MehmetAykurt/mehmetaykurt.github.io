baslik: Bayram
aciklama: Mehmet Aykurt’un Bayram adlı şiiri; bayram gününde kayıpları, yalnızlığı ve nüfusu azalan köyde yaşanan sessizliği anlatır.
tarih: "2026-10-18"
icerikTuru: Şiir
anaTema: Bayram yalnızlığı ve kayıp
konu: Aile ve dostların dağılması ya da vefatı nedeniyle bayramın anlamını yitirmesi ve köyün giderek tenhalaşması
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bayram dediler bugün günlerden
  Bir şeyler koptu sanki içimden
  Anlatsam anlamaz kimse dilimden
  Oturup halleşir dost bulamadım

  Kimisi sağda kimisi solda
  Böyle bayram mı olur Allah aşkına
  Yarısı girmiş toprak altına
  Uzanıp öpecek el bulamadım

  Oturup kalmışım öyle köşede
  Çıkıp gitmeli ama nereye
  500 haneden düştük 50'ye
  Bir selam verecek kul bulamadım
degerlendirme:
  genelBakis: “Bayram”, sevinç ve buluşma günü olması beklenen bayramın kayıp, dağılma ve yalnızlık yüzünden anlamını yitirmesini anlatan hüzünlü bir şiirdir. Anlatıcının içinde bir şeyler kopar; dertleşecek dost, öpecek el ve selam verecek insan bulamaz. Köşede kalışı ve köyün beş yüz haneden elliye düşmesi, kişisel yalnızlığı toplumsal bir tenhalaşma görüntüsüne dönüştürür.
  temaVeKonu: Ana tema bayram yalnızlığı ve kayıptır. Şiirin konusu, yakınların farklı yerlere dağılması veya toprağa girmesi nedeniyle bayramın geleneksel sıcaklığını kaybetmesidir. İlk dörtlükte anlaşılmama ve dostsuzluk, ikinci bölümde ölümle eksilen büyükler, son dörtlükte ise köyün nüfus kaybı öne çıkar. Böylece bir kişinin hüznü, göç ve ölümle boşalan köyün ortak hafızasına bağlanır.
  dilVeSoylevis: Dil yalın, içten ve doğrudan bir yakınma biçimindedir. “Böyle bayram mı olur Allah aşkına” sorusu, bayramın adıyla yaşanan gerçeklik arasındaki çelişkiyi açıkça dile getirir. “Halleşmek”, “el öpmek” ve “selam vermek” bayram kültürünün temel davranışlarını hatırlatır. Hane sayılarındaki keskin düşüş, duygusal kaybı somut ve çarpıcı bir toplumsal göstergeye dönüştürür.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; dizelerde farklı hece sayıları görülür. Her dörtlüğün sonunda tekrarlanan “bulamadım” sözü redif niteliği taşıyarak eksiklik duygusunu birleştirir. “Günlerden / içimden / dilimden”, “solda / aşkına / altına” ve “köşede / nereye / 50’ye” ses yakınlıkları şiirin ağıt tonunu destekler.
  gelenekVeSonuc: Bayram, el öpme, halleşme, selamlaşma, köy ve toprağa giren büyükler halk hayatının ortak hafıza unsurlarıdır. Şiir bayramı bir kutlama görüntüsüyle değil, eksilen insanların bıraktığı boşlukla ele alır. Eserin öne çıkan yönü, bireysel dostsuzluğu köyün nüfus kaybıyla bir araya getirerek göçün ve ölümün geleneksel bayram kültürü üzerindeki etkisini sade bir dille göstermesidir.
