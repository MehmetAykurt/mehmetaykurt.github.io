baslik: Burası
aciklama: Mehmet Aykurt’un Burası adlı şiiri; sözün tükendiği bir felaket ortamında acıyı, bekleyişi, duayı ve şifa umudunu anlatır.
tarih: "2026-12-08"
icerikTuru: Şiir
anaTema: Felaket karşısında acı, bekleyiş ve umut
konu: İnsanların büyük bir felaketin ardından sözsüz kalması, haber beklemesi, dua ederek Allah’ın Şafi ismine sığınması ve şifa umması
siirTuru: Lirik ve toplumsal şiir
gelenek: Halk şiiri ve ağıt geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Kelamın bittiği yerdeyiz üstat
  Dillerin durduğu yer burası
  İçin için yanıp ederken feryat
  Yaşların aktığı yerdir burası

  Söylenecek ne söz kaldı ne de bir cümle
  Sessizce durmalı şimdi köşede
  Parmağınla dokun şöyle birine
  Ahların yükseldiği yerdir burası

  Durmadan dualar yükselir göğe
  Kulaklar gelecek tek bir haberde
  Sığınmış insanlar Şafi ismine
  Şifanın beklendiği yerdir burası
degerlendirme:
  genelBakis: “Burası”, büyük bir felaketin ardından sözün tükendiği, insanların sessizlik içinde ağladığı ve haber beklediği ortamı anlatır. İlk iki dörtlükte acı, dilin durması ve ahların yükselmesiyle belirginleşir. Son bölümde duaların göğe yönelmesi ve Şafi ismine sığınılması, çaresiz bekleyişin içine inançtan doğan bir umut yerleştirir; şiir feryattan şifa beklentisine ilerler.
  temaVeKonu: Ana tema felaket karşısında acı, bekleyiş ve umuttur. Şiirin konusu, anlatılamayacak kadar ağır bir olayın çevresinde insanların sessizce durması, gözyaşı dökmesi ve gelecek tek bir habere kulak kesilmesidir. Dokunulan her insandan bir ah yükselmesi acının ortaklığını gösterir. Son dörtlükte Allah’ın şifa veren anlamındaki Şafi ismi, kurtuluş beklentisinin manevi odağı olur.
  dilVeSoylevis: Dil içli, ağırbaşlı ve doğrudan gözleme dayanır. “Kelamın bittiği yer” ile “dillerin durduğu yer” sözleri anlatmanın yetersizliğini art arda vurgular. “Üstat” hitabı acıyı paylaşan bir muhatap kurar. Her dörtlüğün sonunda yinelenen “burası”, soyut duyguları belirli bir mekâna toplar. Ah, dua, haber ve şifa kelimeleri şiirin duygusal yönünü kederden ümide çevirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; uzun dizelerde ölçü genişler. İkinci ve dördüncü dizelerdeki “yer/yerdir burası” kalıbı nakarat işlevi görür. İlk bölüm gözyaşını, ikinci bölüm ahı, üçüncü bölüm duayı merkeze alır. Böylece aşağı akan yaştan göğe yükselen duaya doğru dikey bir hareket ve anlamlı bir yapı kurulur.
  gelenekVeSonuc: Ağıt dilindeki feryat, gözyaşı ve ortak acı unsurları halk şiiri duyarlığını taşırken Şafi adına sığınma inanç merkezli bir teselli sağlar. Eser, felaket karşısında gösterişli sözler üretmek yerine sessizliğin ve bekleyişin ağırlığını öne çıkarır. En etkili yönü, sözün bittiğini söyleyen dizelerin ardından yine de dua aracılığıyla umuda açık bir kapı bırakmasıdır.
sira: 55
