baslik: Der Gibi
aciklama: Mehmet Aykurt’un Der gibi adlı şiiri; geçmişin düşe dönüşmesini, yaşlılığı ve ölüm sırasının kendisine yaklaştığı duygusunu anlatır.
tarih: "2027-04-04"
icerikTuru: Şiir
anaTema: Geçen ömür ve yaklaşan ölüm
konu: Dünyadan gelip geçenlerin ardından yetmiş yaşına ulaşan söyleyicinin geçmişi hayal gibi görmesi ve kendi ölümünü düşünmesi
siirTuru: Lirik ve düşünsel şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Kimler geldi kimler geçti dünyadan
  Düşününce hayal gibi düş gibi
  Herkesler de göç eylemiş cihandan
  Sanki sıra bize geliyor gibi

  Yaşım yedi iken girdim yetmişe
  Aklım ermez oldu geçen günlere
  Şöyle biraz dönüp baksam geçmişe
  Hayal gibi rüya gibi düş gibi

  Der Mehmet'im yaş kemale erince
  Ölüm bu ya kısmet olur herkese
  Beni de korsunuz bir gün kabre
  Bir varmış bir yokmuş der gibi
degerlendirme:
  genelBakis: “Der gibi”, dünyadan gelip geçen insanları düşünürken kendi ölüm sırasının yaklaştığını hisseden yaşlı söyleyicinin içli muhasebesidir. Yedi yaştan yetmişe geçiş tek bir sıçrama gibi anlatılır; geçmiş hayal, rüya ve düşe dönüşür. Son dörtlükte ölümün herkese kısmet olduğu kabul edilir. Söyleyici kendi mezara konuluşunu “bir varmış bir yokmuş” masal cümlesiyle düşünerek hayatın kısalığını vurgular.
  temaVeKonu: Ana tema geçen ömür ve yaklaşan ölümdür. Şiirin konusu, daha önce dünyadan göçenleri hatırlayan kişinin artık sıranın kendisine geldiğini sezmesidir. Yetmiş yaş, çocuklukla bugün arasındaki zamanın anlaşılmaz hızını görünür kılar. Geçmişe bakıldığında gerçek olayların bile düş gibi belirsizleşmesi, hafıza ile faniliği birleştirir. Ölüm korkudan çok kaçınılmaz ve ortak bir kısmet olarak karşılanır.
  dilVeSoylevis: Dil sade, hüzünlü ve kabulleniş içindedir. “Kimler geldi kimler geçti” tekrarı dünyanın insan akışını, “hayal/rüya/düş” sıralaması geçmişin silikleşmesini anlatır. “Göç eylemek” ölüm için geleneksel ve yumuşatıcı bir ifadedir. “Der Mehmet’im” tapşırması kişisel tanıklığı belirler. Masal başlangıcı olan “bir varmış bir yokmuş”, hayatın tamamını kısa bir anlatıya indirerek güçlü bir ironi yaratır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. “Gibi” redifi benzetme ve belirsizlik duygusunu sürekli taşır. İlk dörtlük başkalarının göçünü, ikinci bölüm kişisel geçmişi, üçüncü bölüm ise gelecekteki ölümü ele alır. Zaman geçmişten şimdiye ve geleceğe uzanırken bütün dönemler düşsel bir hafiflikte birbirine bağlanır.
  gelenekVeSonuc: Dünya göçü, yaş kemali, kabir, tapşırma ve masal kalıbı şiiri halk ile âşık edebiyatının fanilik geleneğine bağlar. Şair ölüm düşüncesini ağır dinî terimlerden çok gündelik hafıza ve masal diliyle işler. Eserin sonucu, insan ömrünün yaşanırken uzun, geriye bakıldığında bir düş kadar kısa göründüğü ve her varlığın sonunda “yokmuş” cümlesine karıştığıdır.
