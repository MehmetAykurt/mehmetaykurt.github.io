baslik: Niye Gamlanırsın Divane Gönül
aciklama: Mehmet Aykurt’un Niye gamlanırsın divane gönül adlı şiiri; yaşlanmış ve yaralı gönlün yeniden sevdaya yönelmesini sorgular.
tarih: "2027-01-13"
icerikTuru: Şiir
anaTema: Yaşlılıkta sevda ve gönlün direnci
konu: Ömrün sonbaharına gelmiş, acılarla yüklü gönlün bir sesle yeniden hayale kapılması ve sevgiye uzanmak için karşılık beklemesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Niye gamlanırsın divane gönül
  Bahar geldi diye gül mü beklersin
  Geldi de geçiyor baksana ömür
  Hâline bakmadan yar mı seversin

  Dökülmüş yaprağın kurumuş dalın
  Aklara bürünmüş bak hele saçın
  Karışmış gidiyor ah ile vahın
  Zemherine geldin gün mü beklersin

  Göz göz olmuş yaralarım sızılar
  Lokman Hekim gelse bana ne yarar
  Yüklenmiş omzuna şu yüce dağlar
  Yetmedi mi bunlar daha istersin

  Der Mehmet'im bir kez duydum sesini
  Hayale mi verdin hemen kendini
  Kurban olam hadi uzat elini
  Tutmak için benden can mı istersin
degerlendirme:
  genelBakis: “Niye gamlanırsın divane gönül”, ömrün kışına yaklaştığını bilen söyleyicinin yeniden sevdaya kapılan gönlüyle yaptığı iç konuşmadır. Kurumuş dal, dökülmüş yaprak ve ak saç yaşlanmayı; sızlayan yaralar geçmişin yükünü simgeler. Buna rağmen bir kez duyulan ses hayali canlandırır. Son bölümde uzatılması beklenen el, yorgunluğun içinde hâlâ karşılık ve yakınlık arayan gönlü açığa çıkarır.
  temaVeKonu: Ana tema yaşlılıkta sevda ve gönlün direncidir. Şiirin konusu, hayatın zemherisine geldiğini düşünen kişinin bahar, gül ve yar beklentisini sorgulamasıdır. Omuzdaki dağlar ve Lokman Hekim’in bile iyileştiremeyeceği yaralar yeni bir acıya karşı uyarı oluşturur. Fakat son dörtlükte gönlün yalnız bir sesle hayale yönelmesi, aklın kurduğu bütün engellere rağmen sevme arzusunun sürdüğünü gösterir.
  dilVeSoylevis: Dil içten, sorgulayıcı ve gönülle konuşan halk şiiri üslubundadır. “Divane gönül” hitabı hem şefkat hem de hafif sitem taşır. Bahar, gül, yaprak, dal ve zemheri imgeleri insan ömrünü mevsimlerle anlatır. Art arda gelen “beklersin, seversin, istersin” soruları gönlü kendi hâliyle yüzleştirir. “Der Mehmet’im” tapşırmasından sonra söyleyiş eleştiriden ricaya ve sevgi talebine döner.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde farklılık görülür. Dörtlük sonlarındaki soru biçimleri şiirin ritmik omurgasını kurar. İlk iki bölüm ömür ve mevsim, üçüncü bölüm yara ve yük, son bölüm ise ses, hayal ve el imgeleri çevresinde gelişir. Böylece dış görünüşteki yaşlılıktan içte yeniden doğan yakınlık isteğine doğru ilerleyen bir yapı oluşur.
  gelenekVeSonuc: Gönülle söyleşme, Lokman Hekim göndermesi, tabiat imgeleri ve tapşırma şiiri âşık edebiyatı geleneğine bağlar. Yaşlılığı kış, sevgiyi bahar olarak kurmak geleneksel bir mecazdır; ancak son dizedeki doğrudan karşılık talebi duyguyu gündelik ve canlı kılar. Eserin sonucu, beden ve akıl yorgun düşse bile gönlün bir sesle yeniden umutlanabileceği ve sevdaya bütünüyle kapatılamayacağıdır.
