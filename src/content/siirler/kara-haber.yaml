baslik: Kara haber
aciklama: Mehmet Aykurt’un Kara haber adlı şiiri; Nurhak Dağı ve Maraş üzerinden gelen bir felaket haberini duman, taş ve toprak imgeleriyle duyurur.
tarih: "2026-12-02"
icerikTuru: Şiir
anaTema: Felaket ve ortak acı
konu: Nurhak Dağı’nı dumanın kaplaması ve taşla toprağın savrulması üzerinden Maraş’tan gelen kara haberin duyurulması
siirTuru: Ağıt
gelenek: Halk şiiri ve ağıt geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir duman bürümüş Nurhak Dağı'nı
  Maraş ellerinden kara haber var
  Savrulmuş etrafa taşı toprağı
  Maraş ellerinden kara haber var
degerlendirme:
  genelBakis: “Kara haber”, yalnız bir dörtlük içinde felaketin genişliğini ve haberin ağırlığını duyuran yoğun bir ağıttır. Nurhak Dağı’nı kaplayan duman ile savrulan taş ve toprak, yaşanan yıkımı doğrudan açıklamadan görünür kılar. “Maraş ellerinden kara haber var” dizesinin iki kez yinelenmesi, uzaktan gelen acı haberin topluluk içinde dalga dalga yayılmasını ve dinleyende bıraktığı sarsıntıyı güçlendirir.
  temaVeKonu: Ana tema felaket ve ortak acıdır. Şiirin konusu, Maraş yöresinden gelen kara haberin tabiat üzerindeki izlerle duyurulmasıdır. Dumanın dağı bürümesi görüşü kapatır; taşla toprağın savrulması düzenin bozulduğunu gösterir. Olayın ayrıntılarının verilmemesi, şiiri tek bir açıklamaya kapatmaz; asıl ağırlık, yurdun bir köşesindeki yıkımın ortak hafızada oluşturduğu yas duygusuna bırakılır.
  dilVeSoylevis: Dil son derece yalın, haber verici ve ağıt tonundadır. “Bir duman bürümüş” ifadesi hem gerçek bir felaket görüntüsü hem de kederin çevreyi kaplaması olarak okunabilir. “Maraş elleri” sözü yöreyi halk söyleyişi içinde kişileştirir. “Kara haber” kalıbı ölüm ve felaket çağrışımını doğrudan taşırken tekrar, söyleyicinin aynı acı cümlesine dönmek zorunda kaldığı izlenimini verir.
  ahenkVeYapi: Şiir tek dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. Birinci ve üçüncü dizeler görüntüyü kurar; ikinci ve dördüncü dizeler aynı nakaratla bunun anlamını bildirir. “Dağı’nı / toprağı” ses yakınlığı dış dizeleri bağlarken “kara haber var” redifi içte sabit bir yas noktası yaratır. Kısa ve kapalı yapı, haberin ani gelişini biçimsel olarak da yansıtır.
  gelenekVeSonuc: Yer adı, tabiat görüntüsü ve yinelenen haber dizesi eseri halk şiirinin ağıt geleneğine yaklaştırır. Şair açıklama yapmaktan çok işaret eder; dağı, dumanı, taşı ve toprağı felaketin tanıkları hâline getirir. Eserin gücü kısalığındadır; dört dizeyle hem belirli bir coğrafyayı anımsatır hem de ayrıntıya ihtiyaç duymadan ortak yasın ağır sessizliğini kurar.
