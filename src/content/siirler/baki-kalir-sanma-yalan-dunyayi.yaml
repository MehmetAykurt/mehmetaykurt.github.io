baslik: Baki kalır sanma yalan dünyayı
aciklama: Mehmet Aykurt’un Baki kalır sanma yalan dünyayı adlı şiiri; kıyamet, nefis, amel, kul hakkı ve mahşer hesabı üzerinden faniliği anlatır.
tarih: "2027-04-07"
icerikTuru: Şiir
anaTema: Fanilik ve ahiret sorumluluğu
konu: Dünyanın kalıcı olmadığını bilmek, nefse uymamak, ibadete güvenip kibirlenmemek, kul hakkından sakınmak ve hidayet aramak
siirTuru: Dinî ve didaktik şiir
gelenek: Halk şiiri ve tasavvufi öğüt geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Baki kalır sanma yalan dünyayı
  Kıyamet dediğin Kopacak bir gün
  Mağrur olma boşa eğdir başını
  Karışıp toprağa gidecek bir gün

  Varmak ister isen eğer menzile
  Uymayasın sakın ola nefsine
  Rıza göstermeyen Hakk'ın emrine
  Cehennem ehlinden sayılır bir gün

  Bin defa da varsa alnın secdeye
  Bir namazla girilmez ki cennete
  Hiçbir zaman ameline güvenme
  Mahşerde hesabın şaşacak bir gün

  Kul hakkına Mevla bile karışmaz
  Bu ah ile hiç huzura varılmaz
  Âlim susar cahiller de anlamaz
  Hidayete eren kurtulur bir gün
degerlendirme:
  genelBakis: “Baki kalır sanma yalan dünyayı”, insanı dünyanın geçiciliği ve ahiret hesabı konusunda uyaran dinî-didaktik bir şiirdir. Kıyamet ve toprağa karışma, faniliği; nefis, amel, secde ve namaz kişisel sorumluluğu; kul hakkı ise başkalarına karşı borcu anlatır. İbadetin sayısına güvenmek yerine alçakgönüllülük ve Hakk’ın emrine rıza istenir. Son bölüm hidayeti kurtuluş yolu olarak gösterir.
  temaVeKonu: Ana tema fanilik ve ahiret sorumluluğudur. Şiirin konusu, dünyanın baki olmadığını bilerek mağrur olmamak, menzile ulaşmak için nefse uymamak ve kendi ibadetini yeterli görmemektir. Mahşer hesabının şaşabileceği uyarısı amele güvenen kibri sarsar. Kul hakkının ağırlığı, ilahi bağışlanma beklentisinin önüne konur. Âlimin sustuğu ve cahilin anlamadığı ortamda hidayet belirleyici ölçü olur.
  dilVeSoylevis: Dil kesin, uyarıcı ve dinî kavramlarla yüklüdür. “Sanma, mağrur olma, uymayasın, güvenme” emirleri muhatabın davranışına sınır çizer. Yalan dünya, kıyamet, toprak, menzil, nefis, cehennem, secde, cennet, mahşer ve hidayet kelimeleri dünya ile ahiret arasında geniş bir anlam ağı kurar. Her bölümde yinelenen “bir gün” sözü hesabın ertelense bile kaçınılmaz olduğunu vurgular.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Dörtlük sonlarındaki “bir gün” redifi gelecek hükmünü sabit tutar. İlk bölüm fanilik, ikinci bölüm nefis ve rıza, üçüncü bölüm ibadet ile mahşer, son bölüm kul hakkı ve hidayet üzerinde durur. Bu yapı dış dünyanın sonundan kişinin manevi hesabına doğru derinleşir.
  gelenekVeSonuc: Yalan dünya, menzil, nefis, secde, kul hakkı ve hidayet kavramları tasavvufi halk şiirinin nasihat geleneğine dayanır. Şiir ibadeti değersizleştirmez; onu kibir ve güvence aracına çevirmeyi eleştirir. Eserin sonucu, kurtuluşun yalnız görünür amellerde değil, alçakgönüllülük, Hakk’ın emrine rıza, kul hakkından sakınma ve hidayete yönelmede bulunduğudur.
