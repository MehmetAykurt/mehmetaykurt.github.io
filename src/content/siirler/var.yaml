baslik: Var
aciklama: Mehmet Aykurt’un Var adlı şiiri; aşk, güzellik ve özlem duygusunu halk şiiri geleneğine yakın içli bir söyleyişle anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Aşk ve güzellik
konu: Sevgilinin güzelliği karşısında duyulan hayranlık, ulaşamamanın verdiği sızı ve özlem
siirTuru: Lirik şiir ve güzelleme
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Kıskanma güllerin güzelliğini
  Dalında gizlenir dikenleri var
  Uzatıp elini koparma emi
  Renginde bülbülün ahu zarı var

  Kirpiği ok gibi kaşı kemanım
  Salınır yürürken zülfü dalgalım
  Alamadım sende kaldı muradım
  Yaralı gönlümde dinmez sızı var

  Perçemi dökülür gelir yüzüne
  Canımı veririm bir tek teline
  Gecemi ek ettim gayri gündüze
  Görmeyen gözümün akar yaşı var
degerlendirme:
  genelBakis: “Var” adlı şiir, sevgilinin güzelliğini ve bu güzelliğin âşıkta bıraktığı derin izi anlatan lirik bir şiirdir. Şiirin genel havasında hayranlık, özlem ve içli bir sızı öne çıkar. Gül, diken, bülbül, kaş, kirpik, zülüf ve gözyaşı gibi imgelerle hem sevgilinin çekiciliği hem de aşkın acı veren yanı dile getirilmiştir.
  temaVeKonu: Şiirin ana teması aşk ve güzelliktir. Konu, sevgilinin güzelliğine kapılan âşığın muradına erememesi ve gönlünde dinmeyen bir yara taşımasıdır. İlk dörtlükte gülün güzelliği ile dikenin acısı birlikte verilir. Bu durum, aşkın hem güzel hem de yaralayıcı yönüne işaret eder. İkinci ve üçüncü dörtlüklerde sevgilinin kaşı, kirpiği, zülfü ve perçemi üzerinden geleneksel güzellik anlayışı işlenir.
  dilVeSoylevis: Şiirin dili sade, samimi ve halk söyleyişine yakındır. “Koparma emi”, “sende kaldı muradım”, “canımı veririm” gibi ifadeler şiire içten bir konuşma havası kazandırır. Söyleyiş, sevgiliye duyulan hayranlıkla birlikte sitemli ve hüzünlü bir tona sahiptir. Şair, ağır ve süslü bir dil yerine halk şiirinin doğal anlatımını tercih etmiştir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle yazılmıştır. Her dörtlüğün sonunda yer alan “var” sözcüğü, şiire güçlü bir tekrar ve ahenk kazandırır. “Güzelliğini / dikenleri”, “kemanım / dalgalım / muradım”, “yüzüne / teline / gündüze” gibi ses benzerlikleri şiirin uyak düzenini destekler. Mısraların düzenli akışı, şiire türküye yakın bir ritim verir.
  gelenekVeSonuc: Şiir, Türk halk şiiri ve âşık edebiyatı geleneğiyle güçlü bir bağ taşır. Gül, bülbül, diken, zülüf, kaş ve kirpik gibi imgeler, klasik halk şiiri ve güzelleme anlayışında sıkça kullanılan unsurlardır. Âşığın sevgili karşısındaki çaresizliği, muradına erememesi ve gözyaşı dökmesi de bu geleneğin belirgin duygularındandır. Şiirin öne çıkan yönü, sevgilinin güzelliğini aşkın yaralayıcı tarafıyla birlikte sade ve ahenkli bir dille anlatmasıdır.
sira: 8
