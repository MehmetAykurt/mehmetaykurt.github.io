baslik: Yalan oldu
aciklama: Mehmet Aykurt’un Yalan oldu adlı şiiri; siyasal çelişkileri, korkuyu, adalet kaybını ve ozanın suskunluğunu eleştiren bir taşlamadır.
tarih: "2026-11-05"
icerikTuru: Şiir
anaTema: Siyasal çelişki, korku ve adalet kaybı
konu: Değerlerin ve tarafların belirsizleşmesiyle toplumda güvenin, ifade özgürlüğünün ve ozanlık sözünün zayıflaması
siirTuru: Toplumsal taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: Hece ölçüsü ağırlıklı, değişken
youtubeAdresi: ""
siirMetni: |-
  Lanetler yağdırıp sövdüklerimiz
  Sayın diye anılır oldu
  Vatan diye şehit verdiklerimiz
  Mezarında sızılar oldu

  Ne sağımız belli ne de solumuz
  Ne olur acaba bilmem sonumuz
  Meydanda kesilir bir gün yolumuz
  Vatanın içine eşkıya doldu

  Konuşsan bir türlü sussan bin türlü
  Ne gelir başa bilmiyoz çünkü
  İki adım şöyle bir önde yürü
  Koluna kelepçe takılır oldu

  Bir umut hani gelir mi diye
  Gözümüz Samsun'a bakıyor öyle
  Aman sessiz ol duymasın kimse
  Eşinden dostundan korkulur oldu

  Eğrisi doğrusu kalmadı artık
  Vallahi gelecek nesile yazık
  İyisiyle kötüsüyle çorbaya battık
  At izi it izine karışır oldu

  Der Mehmet'im sazın teli
  Çıkmaz oldu gayri sesi
  O bile korkmuş belli
  Ozanlıkta yalan oldu
degerlendirme:
  genelBakis: “Yalan oldu”, siyasal tutumların değişmesini, doğru ile yanlışın birbirine karışmasını ve toplumda büyüyen korkuyu eleştiren sert bir taşlamadır. Daha önce sövülenlerin saygıyla anılması ve vatan uğruna ölenlerin hatırası arasındaki çelişkiyle başlayan şiir, konuşmanın tehlikesine kadar ilerler. Son dörtlükte sazın teli bile susar; ozanlık, korkunun gölgesinde işlevini yitirir.
  temaVeKonu: Ana tema siyasal çelişki, korku ve adalet kaybıdır. Şiirin konusu, tarafların belirsizleşmesiyle toplumun neye inanacağını şaşırması ve söz söylemenin riskli hâle gelmesidir. Kelepçe korkusu, dosttan bile çekinme ve gelecek nesil için duyulan kaygı, bireysel huzursuzluğu toplumsal bir güvensizliğe dönüştürür. At izi ile it izinin karışması, değer ölçülerinin yok oluşunu özetler.
  dilVeSoylevis: Dil açık, öfkeli ve deyimlerle güçlendirilmiş bir halk söyleyişine sahiptir. “Konuşsan bir türlü sussan bin türlü”, “at izi it izine karışmak” ve “iyisiyle kötüsüyle çorbaya batmak” sözleri karmaşa duygusunu somutlaştırır. “Aman sessiz ol” uyarısı şiirin içindeki korkuyu doğrudan duyurur. Son bölümde sazın kişileştirilmesi, ozanın suskunluğunu etkili bir simgeye dönüştürür.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve değişken hece sayılarıyla ilerleyen halk şiiri söyleyişine dayanır. Dörtlük sonlarında yinelenen “oldu” sözü redif niteliği taşır ve bozulmanın tamamlanmış sonuçlarını art arda sıralar. “Solumuz / sonumuz / yolumuz”, “diye / öyle / kimse” ve “teli / sesi / belli” ses yakınlıkları ahengi destekler. Son dörtlüğün kısalan dizeleri suskunluk etkisini artırır.
  gelenekVeSonuc: Toplumsal bozulmayı, yöneticileri ve söz üzerindeki baskıyı saz ile ozan üzerinden eleştirmek âşık edebiyatının taşlama geleneğine uygundur. Şair kendi adını anarak bu gelenekteki tanıklık görevini üstlenir; ancak sazın ses çıkaramaması, bu görevin tehdit altında olduğunu gösterir. Eserin öne çıkan yönü, siyasi karmaşayı yalnız olaylarla değil, ozanlığın ve sözün anlam kaybıyla birlikte ele almasıdır.
