baslik: Yaralama Gel Beni
aciklama: Mehmet Aykurt’un Yaralama Gel Beni adlı şiiri; aşk ve sitem temasını, sevgilinin ilgisizliği karşısında incinen âşığın yakarışıyla anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Aşk ve sitem
konu: Âşığın sevgilinin ilgisizliği ve tavırları karşısında incinmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Kara kaşlarına kurban olduğum
  Bakışınla yaralama gel beni
  Tatlı dillerine hayran olduğum
  Sözün ile yaralama gel beni

  Başımı koymuşum senin yoluna
  Feda olsun canım istersen sana
  Daha ne yapayım Allah aşkına
  Hallerinle yaralama gel beni

  Gölge oldum peşindeyim görmezsin
  Ne yaparım ne ederim bilmezsin
  Bir kelam etmeden çekip gidersin
  Sırtın dönüp yaralama gel beni
degerlendirme:
  genelBakis: “Yaralama Gel Beni” adlı şiir, sevdiği kişiye içten bir yakarışta bulunan âşığın duygularını anlatır. Şiirin genel havasında sevgi, bağlılık, kırgınlık ve sitem bir aradadır. Âşık, sevgilinin bakışından, sözünden, hâlinden ve ilgisizliğinden incinmekte; buna rağmen ona olan bağlılığından vazgeçmemektedir.
  temaVeKonu: Şiirin ana teması aşk ve sitemdir. Konu, âşığın sevgili karşısında yaşadığı gönül kırgınlığıdır. İlk dörtlükte sevgilinin kaşlarına, bakışına ve tatlı diline duyulan hayranlık dile getirilir. Ancak bu güzelliklerin âşığı yaralayan bir güce dönüştüğü görülür. İkinci ve üçüncü dörtlüklerde ise âşığın fedakârlığı, sevgilinin peşinden gidişi ve karşılık görememenin verdiği acı öne çıkar.
  dilVeSoylevis: Şiirin dili sade, içten ve halk söyleyişine yakındır. “Kurban olduğum”, “feda olsun canım”, “Allah aşkına” gibi ifadeler şiire samimi bir yakarış havası kazandırır. Şair, sevgiliye doğrudan seslenir. Bu doğrudan hitap biçimi, şiirin duygusal etkisini artırır. Söyleyiş hem yalvaran hem de sitem eden bir tona sahiptir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle yazılmıştır. Her dörtlüğün sonunda tekrar edilen “yaralama gel beni” ifadesi, şiirin ana duygusunu güçlendiren belirgin bir redif niteliğindedir. “Olduğum / olduğum”, “yoluna / sana”, “görmezsin / bilmezsin” gibi ses tekrarları ahengi destekler. Düzenli mısra yapısı ve tekrarlar, şiire türküye yakın bir ritim kazandırır.
  gelenekVeSonuc: Şiir, halk şiiri ve âşık edebiyatı geleneğiyle güçlü bir bağ taşır. Sevgiliye duyulan bağlılık, karşılık görememe, sitem ve yakarış bu geleneğin temel duyguları arasındadır. Âşığın kendini sevgilinin yoluna adaması, halk şiirindeki fedakâr âşık tipini hatırlatır. Şiirin öne çıkan yönü, sade ve etkili bir dille sevginin inciten tarafını anlatmasıdır.
sira: 5
