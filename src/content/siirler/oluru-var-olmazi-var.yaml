baslik: Oluru Var Olmazı Var
aciklama: Mehmet Aykurt’un Oluru var olmazı var adlı şiiri; aşkın akılla çözülemeyen, huzur kadar yara ve ihtimal taşıyan doğasını anlatır.
tarih: "2027-01-16"
icerikTuru: Şiir
anaTema: Aşkın belirsizliği
konu: Kıraç ve çorak tarla benzetmeleriyle her sevdanın sonuç vermeyeceğinin, aşkın yara, sızı, umut ve imkânsızlığı birlikte taşıdığının anlatılması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Kıraç tarla ekin vermez
  Gönül işi akıl ermez
  Aşka düşen huzur bilmez
  Yarası var sızısı var

  Çorak tarladan geçilmez
  Diken biter gülü dermez
  Her sevda huzur vermez
  Oluru var olmazı var

  Yaz ayında kar yağar mı
  Durduk yere saç ağar mı
  Gece vakti gün çıkar mı
  Seheri var şafağı var
degerlendirme:
  genelBakis: “Oluru var olmazı var”, aşkı kesin sonuçlara bağlanamayan, akıl dışı ve çelişkili bir alan olarak anlatan kısa bir şiirdir. Kıraç ve çorak tarla, karşılık vermeyen gönlün simgesi olur; diken ile gül huzur ve acının yan yana durduğunu gösterir. Son dörtlükte doğa düzenine aykırı sorular sorulur, ardından seher ve şafak anılarak karanlığın içinde yine de bir başlangıç ihtimali bırakılır.
  temaVeKonu: Ana tema aşkın belirsizliğidir. Şiirin konusu, her gönül ilişkisinin ürün vermediği, aşka düşenin huzur kadar yara ve sızıyla da karşılaştığı gerçeğidir. “Oluru var olmazı var” sözü sevdanın hem mümkün hem imkânsız yönünü aynı anda kabul eder. Yazın kar yağması ve gece gün çıkması gibi sorular olağan dışılığı vurgularken seher ile şafak, beklenmedik umudun simgesi hâline gelir.
  dilVeSoylevis: Dil yalın, özlü ve atasözü söyleyişine yakındır. Tarla, ekin, diken ve gül üzerinden gönül işi gündelik hayatın somut görüntüleriyle açıklanır. “Akıl ermez”, “huzur bilmez” ve “huzur vermez” ifadeleri olumsuz yargıları ses benzerliğiyle bağlar. Son dörtlükte art arda gelen sorular, kesin öğüt vermek yerine okuru aşkın olağan düzeni bozabilen gücü üzerine düşündürür.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde hece farklılığı görülür. İlk bölüm “yarası var sızısı var”, ikinci bölüm “oluru var olmazı var”, üçüncü bölüm “seheri var şafağı var” ikili tekrarlarıyla kapanır. Bu paralel yapı acıdan belirsizliğe, oradan umuda doğru ilerler. “Vermez/ermez/bilmez” sesleri ilk iki bölümde ahengi güçlendirir.
  gelenekVeSonuc: Toprak ve ekin benzetmeleri, gül ile diken karşıtlığı ve atasözü tadındaki kısa hükümler şiiri halk şiiri geleneğine yaklaştırır. Eser aşkı yalnız mutluluk ya da yalnız acı olarak tanımlamaz; iki ihtimali birlikte taşır. Sonuçta gönül işinin akılla bütünüyle çözülemeyeceği, her sevdanın olmayabileceği fakat en karanlık gecenin bile seher ve şafak ihtimalini sakladığı söylenir.
