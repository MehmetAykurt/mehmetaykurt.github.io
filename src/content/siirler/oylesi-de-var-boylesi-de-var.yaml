baslik: Öylesi de Var Böylesi de Var
aciklama: Mehmet Aykurt’un Öylesi de var böylesi de var adlı şiiri; insanların farklı huylarını, kaderlerini ve ahlaki tutumlarını karşılaştırır.
tarih: "2026-12-23"
icerikTuru: Şiir
anaTema: İnsan karakterlerinin çeşitliliği
konu: Kibirli, edepli, nefsine esir, şükreden ya da isyan eden farklı insan tiplerinin karşılaştırılması ve kişinin kendine sahip çıkması
siirTuru: Didaktik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  İnsan kısım kısım yer damar damar
  Öylesi de var böylesi de var
  Kimisinde kibir kimisinde ar
  Öylesi de var böylesi de var

  Kimisi rezil olmuş kimisi vezir
  Kimisi de olmuş nefsine esir
  İnsanlık gereği önce edeptir
  Öylesi de var böylesi de var

  Kimi ağlar kimi güler dünyada
  Kimi sefasında kimi cefada
  Kimi şükrederken kimi isyanda
  Öylesi de var böylesi de var

  Akıl ermez insana türlüdür işi
  Şeytanı aratmaz vallahi kimi
  Sen kendine sahip çık şaşırma emi
  Öylesi de var böylesi de var
degerlendirme:
  genelBakis: “Öylesi de var böylesi de var”, insanların huy, makam, kader ve ahlak bakımından çeşitliliğini karşılaştırmalı dizelerle anlatan didaktik bir şiirdir. Kibir ile ar, rezillik ile vezirlik, sefa ile cefa, şükür ile isyan yan yana getirilir. Şiir başkalarını bütünüyle çözmenin güçlüğünü kabul ederken son bölümde dikkati bireye çevirir ve asıl görevin kişinin kendine sahip çıkması olduğunu söyler.
  temaVeKonu: Ana tema insan karakterlerinin çeşitliliğidir. Şiirin konusu, aynı dünyada yaşayan insanların kimisinin nefsine esir, kimisinin edepli; kimisinin mutlu, kimisinin acı içinde oluşudur. Toplumsal konumun ahlaki değeri garanti etmediği vurgulanır. Son dörtlükte bazı kişilerin şeytanı aratabileceği söylenirken dinleyene şaşırmaması ve kendi davranışını denetlemesi öğütlenir.
  dilVeSoylevis: Dil yalın, atasözü tadında ve gözlemci bir yapıdadır. “İnsan kısım kısım, yer damar damar” sözü halk bilgeliğini başlangıç hükmü olarak kullanır. “Kimi” ve “kimisi” kelimelerinin sık tekrarı karşılaştırmaları hızlandırır. “Öylesi de var böylesi de var” nakaratı yargıyı yumuşatırken çeşitliliği kabullenir. “Şaşırma emi” hitabı öğüdü samimi bir konuşmaya dönüştürür.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde farklılıklar görülür. Her dörtlüğün ikinci ya da dördüncü dizesinde yinelenen başlık sözü güçlü bir nakarat kurar. “Kimi/kimisi” ön tekrarları ve “rezil/vezir/esir” ses yakınlıkları ahengi besler. İlk üç bölüm insan tiplerini sıralar, son bölüm bu gözlemlerden kişisel bir öğüt çıkarır.
  gelenekVeSonuc: Atasözüyle başlaması, insan tiplerini karşıtlıklarla göstermesi ve dinleyene öğüt vermesi eseri âşık edebiyatının didaktik şiirlerine yaklaştırır. Yer yer sertleşen insan eleştirisi taşlama özelliği taşır. Şiirin vardığı sonuç, dünyanın türlü insanlarla dolu olduğu gerçeği karşısında şaşkınlığa kapılmak yerine kişinin kendi nefsini ve davranışını koruması gerektiğidir.
