baslik: Benziyor
aciklama: Mehmet Aykurt’un Benziyor adlı şiiri; ticaret, din ve siyasette görülen çelişkileri mizahi benzetmelerle eleştiren bir taşlamadır.
tarih: "2026-10-27"
icerikTuru: Şiir
anaTema: Toplumsal ve siyasi yozlaşma
konu: Değişen görünüşler, ticari hile, dini gösteriş ve siyasi çıkarcılık üzerinden toplumdaki bozulmanın eleştirilmesi
siirTuru: Mizahi şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Öyle bir zamana geldik
  Kızım oğluma benziyor
  Kulağında küpeleri
  Oğlum kızıma benziyor

  Okka gitti kilo geldi
  O da iyice eridi
  Esnaf aldı ayar verdi
  Biraz hileye benziyor

  İmamım der caka satar
  Koy minbere öyle bakar
  Çıktı yoksa vaazdan kaçar
  Biraz arsıza benziyor

  Seçim gelir meydan dolar
  Vaatler havada uçar
  Her gelen kese yoklar
  Biraz hırsıza benziyor

  Vekilim ol dedim sana
  Git meclise hakkım ara
  Unuttu lan üç gün sonra
  Biraz balığa benziyor

  Der Mehmet'im dünya hali
  Böyle gelir gider yani
  Yorma boşa sen kendini
  Biraz hırslıya benziyor
degerlendirme:
  genelBakis: “Benziyor”, gündelik hayattan din ve siyasete uzanan toplumsal çelişkileri kısa, mizahi benzetmelerle eleştiren bir taşlamadır. Şiir görünüş değişikliklerinden ölçü ve ticaret hilesine, dinî gösterişten seçim vaatlerine ve unutkan vekile kadar farklı alanları dolaşır. Her dörtlüğün sonunda yapılan benzetme, gözlenen davranışı hile, arsızlık, hırsızlık, unutkanlık veya hırs kavramıyla ilişkilendirir.
  temaVeKonu: Ana tema toplumsal ve siyasi yozlaşmadır. Şiirin konusu, değişen zaman içinde görünüşlerin, ölçülerin, meslek ahlakının, dinî temsilin ve siyasal sorumluluğun güven kaybetmesidir. Esnafın ayarı, imamın gösterişi, seçim vaatleri ve halkı unutan vekil ayrı örnekler hâlinde sıralanır. Son dörtlük, bu bozulmanın dünyada sürüp giden bir hâl olduğunu söyleyerek anlatıcıyı yorgun bir kabullenişe taşır.
  dilVeSoylevis: Dil konuşma havasında, kısa ve alaycıdır. “Biraz ... benziyor” kalıbı doğrudan suçlama yerine benzetme üzerinden iğneleyici bir eleştiri kurar. “Caka satar”, “vaatler havada uçar”, “kese yoklar” ve “üç gün sonra unuttu” gibi gündelik sözler taşlamayı somutlaştırır. “Der Mehmet’im” ifadesi şairin kendisini anmasını sağlarken son bölümdeki öğüt, hicvi kişisel bir iç konuşmayla tamamlar.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; birkaç dizede hece farklılığı vardır. Dörtlük sonlarındaki “benziyor” sözü redif görevi görerek farklı eleştiri konularını tek yapıda birleştirir. “Geldi / eridi / verdi”, “satar / bakar / kaçar” ve “dolar / uçar / yoklar” ses birlikleri ahengi destekler. Kısa dizeler taşlamaya hızlı ve canlı bir ritim kazandırır.
  gelenekVeSonuc: Esnafı, din adamını, siyasetçiyi ve toplumsal değişimi mizah yoluyla eleştirmek halk şiirindeki taşlama geleneğinin belirgin özelliklerindendir. Şiir ağır bir söylem yerine benzetme, abartı ve konuşma dili kullanır. Eserin öne çıkan yönü, birbirinden farklı bozulma örneklerini aynı “benziyor” kalıbında toplaması ve kesin yargıdan kaçınır görünürken eleştirisini daha iğneleyici hâle getirmesidir.
