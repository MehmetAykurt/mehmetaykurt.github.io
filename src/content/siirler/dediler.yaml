baslik: Dediler
aciklama: Mehmet Aykurt’un Dediler adlı şiiri; edep, tutumluluk, saygı ve inançla yaşayan kişinin toplum tarafından yanlış etiketlenmesini işler.
tarih: "2027-02-12"
icerikTuru: Şiir
anaTema: Değerlerin toplumca yanlış anlaşılması
konu: Edepli, tutumlu, saygılı ve inançlı davranışların saflık, cimrilik, korkaklık ve yobazlık diye adlandırılması; gerçek değerin ahirette bulunması
siirTuru: Taşlama ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Edeptir dedim büktüm boynumu
  Saf biraz sanırım meczup dediler
  Sağa sola bakmadım yumdum gözümü
  Kördür galiba bu da dediler

  Çalıştım çabaladım emek sarfettim
  İsrafa dur dedim yeteri bildim
  Her şeyin fazlası zarardır dedim
  Ne bilir yemeyi cimri dediler

  Saygıyı sevgiyi ölçü edindim
  Büyüğün önünden hiç yürümedim
  Haklı da olsam kavga etmedim
  Pusup kalır öyle korkak dediler

  Tane tane yedim suyunu içtim
  Şaraba gelince haramdır dedim
  Kadehler doldu elim sürmedim
  Ne bilir yaşamayı yobaz dediler

  Ağlaya ağlaya geldim dünyaya
  Güle güle girdim kara toprağa
  Burada horlanan değerli orda
  Aradığımız zaten budur dediler
degerlendirme:
  genelBakis: “Dediler”, edep, tutumluluk, saygı ve inançla yaşayan bir insanın çevresi tarafından sürekli yanlış etiketlenmesini anlatan toplumsal taşlamadır. Boyun bükmek saflık, israftan kaçınmak cimrilik, kavga etmemek korkaklık, içkiden uzak durmak yobazlık sayılır. Son dörtlükte dünyada horlanan değerlerin ölümden sonra karşılık bulacağı düşüncesi, toplumsal yargılara manevi bir cevap verir.
  temaVeKonu: Ana tema değerlerin toplumca yanlış anlaşılmasıdır. Şiirin konusu, kişinin ahlaki tercihleri ile çevrenin bunlara verdiği küçültücü adlar arasındaki çatışmadır. Her dörtlükte davranış önce gerekçesiyle anlatılır, ardından başkalarının hükmü gelir. Son bölüm yaşam ile ölüm, horlanma ile değer görme karşıtlığını kurar; söyleyici aradığı hakiki ölçünün dünya övgüsü değil öteki âlemdeki karşılık olduğunu belirtir.
  dilVeSoylevis: Dil yalın, ironik ve savunma niteliğindedir. “Dediler” sözü her bölümde yinelenerek toplumun etiketleyen sesini görünür kılar. “Saf, meczup, kör, cimri, korkak, yobaz” kelimeleri dışarıdan yöneltilen hükümleri sıralar. Söyleyici buna öfkeyle değil kendi davranışlarının nedenlerini açıklayarak karşılık verir. “Ağlaya ağlaya” ile “güle güle” karşıtlığı finalde kaderin tersine dönüşünü güçlü biçimde anlatır.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı uzun dizelerde ölçü farklılıkları vardır. Dörtlüklerin ikinci ve dördüncü dizelerindeki “dediler” redifi dış yargının sürekliliğini sağlar. İlk dört bölüm ayrı bir erdem ile yanlış etiketi eşleştirir. Son bölüm bu örnekleri dünya ve ahiret karşıtlığında toplar; tekrar düzeni şiire savunma konuşması ritmi kazandırır.
  gelenekVeSonuc: Edep, israf, büyüğe saygı, haram ve ahiret gibi kavramlar halkın ahlak ve inanç dünyasına dayanır. Toplumun ikiyüzlü ölçülerini tekrar ve ironiyle eleştirmesi şiiri âşık edebiyatının taşlama çizgisine yerleştirir. Eserin sonucu, çoğunluğun verdiği adların hakikati belirlemediğidir; dünyada küçümsenen erdemler, kişinin manevi hesabında asıl değer olarak kalabilir.
