baslik: Ben Ali'yim
aciklama: Mehmet Aykurt’un Ben Ali’yim adlı şiiri; Ali adı, Kerbela, On İki İmam, semah, Yunus Emre, dergâh ve cami üzerinden inanç kimliğini anlatır.
tarih: "2027-03-11"
icerikTuru: Şiir
anaTema: Alevi kimliği ve inanç bağlılığı
konu: Ali adını ve soy bağını benimseyen söyleyicinin Hazreti Ali, Kerbela, On İki İmam, semah, Yunus Emre, dergâh, cami ve Allah inancıyla kendini tanıtması
siirTuru: Tasavvufi ve kimlik şiiri
gelenek: Alevi-Bektaşi şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ben Ali'yim Ali oğluyum
  Tanıyanlar beni böyle bilsinler
  Belki de halkanın en son koluyum
  Varsa inanmayan izim sürsünler

  Hazreti Ali’yle çıkmışım yola
  Kerbela'da boyandı başım kanlara
  Ölesiye bağlıyım on iki imama
  Varsa inanmayan hâlim görsünler

  Kalkarım ayağa semah ederim
  Oturur köşeye cümle dizerim
  Yunus Emre ile birlik gezerim
  Varsa inanmayan söze gelsinler

  Dergâha gider sohbet ederim
  Camiye gelir kelam dinlerim
  Allah'a inanır iman ederim
  Varsa inanmayan tövbe etsinler
degerlendirme:
  genelBakis: “Ben Ali’yim”, söyleyicinin ad, soy, inanç ve kültür bağlarını açık bir kimlik beyanı hâlinde sunduğu tasavvufi şiirdir. Hazreti Ali’yle çıkılan yol Kerbela’nın acısına ve On İki İmam bağlılığına uzanır. Semah ile şiir, Yunus Emre ile söz, dergâh ile cami aynı inanç dünyasında buluşur. Her dörtlükte inanmayanlara yöneltilen çağrı, kimliğin saklanmadan savunulduğunu gösterir.
  temaVeKonu: Ana tema Alevi kimliği ve inanç bağlılığıdır. Şiirin konusu, Ali adını taşıyan kişinin kendisini tarihsel ve manevi bir halkanın son kolu olarak görmesidir. Kerbela kişisel bir yara gibi sahiplenilir; On İki İmam’a bağlılık hayat boyu süren bir sadakat olarak belirtilir. Semah etmek, cümle dizmek, dergâhta sohbet ve camide kelam dinlemek, farklı ibadet mekânlarını dışlamayan bütünlüklü bir iman anlayışı kurar.
  dilVeSoylevis: Dil gururlu, açık ve meydan okuyucudur. “Ben Ali’yim” başlangıcı kimliği tartışmasız biçimde ilan eder. “Bilsinler, sürsünler, görsünler, gelsinler, etsinler” fiilleri topluluğa yönelen çağrı tonunu sürdürür. Yol, halka ve iz kavramları geleneğin devamlılığını anlatır. Kerbela kanı duygusal yoğunluk getirirken semah, Yunus Emre, dergâh ve cami inanç hayatının farklı yüzlerini somutlaştırır.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. Dörtlüklerin sonundaki “varsa inanmayan” kalıbı değişen emirlerle nakarat etkisi yaratır. Yapı önce ad ve soy kimliğini, sonra tarihsel bağlılığı, ardından sanat ile semahı ve son olarak ibadet ile imanı ele alır. Bu sıra kimliği kişisel kökten ortak inanç pratiğine genişletir.
  gelenekVeSonuc: Hazreti Ali, Kerbela, On İki İmam ve semah şiiri Alevi-Bektaşi geleneğine; Yunus Emre ve cümle dizme ise âşık-tasavvuf şiirine bağlar. Dergâh ile caminin birlikte anılması ayrıştırıcı değil birleştirici bir inanç anlayışı taşır. Eserin sonucu, kimliğin iz, hâl, söz ve ibadetle doğrulanabileceği; Allah’a iman eden söyleyicinin inancını açıkça ve özgüvenle savunduğudur.
