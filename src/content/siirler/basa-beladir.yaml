baslik: Başa beladır
aciklama: Mehmet Aykurt’un Başa beladır adlı şiiri; gönül kırmayı, kul hakkını, öfkeyi, kibri ve nefsin esaretini ağır sonuçlarıyla anlatır.
tarih: "2027-02-24"
icerikTuru: Şiir
anaTema: Kul hakkı, kibir ve öfkenin tehlikesi
konu: Gönül kırmaktan, mazlumun ahından, el-dil-bel kusurlarından, öfke, kibir ve nefsin esaretinden sakınma öğüdü
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve tasavvufi öğüt geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Dikkat et aman bir gönül kırma
  Kâbe’ye denk düşer yükü ağırdır
  Mazlumun dilinden intizar alma
  Çektiği ah bile başa beladır

  Vurana elsiz ol sövene dilsiz
  Havale et Mevla'ya budur zahmetsiz
  Görülür hesabı Bir gün habersiz
  Kul hakkına girer başa beladır

  Şikâyet gelmesin şu üç şeyden
  Elinden dilinden bir de belinden
  İnce ol ince yaşa gayetten
  Öfkene sahip çık başa beladır

  Başını eğik tut kibir olmasın
  Kibir şeytandandır sakın duymasın
  Nefsin elinde esir olmasın
  Cehennem ateşi başa beladır

  Gönül alçaldıkça mertebe yükselir
  Terazinin gözünde bu ağır gelir
  Uzak dur Mehmet'ten biraz delidir
  Söylediği sözler başa beladır
degerlendirme:
  genelBakis: “Başa beladır”, gönül kırma, mazlumun ahını alma, kul hakkı, öfke, kibir ve nefsin esareti gibi ahlaki tehlikeleri art arda sıralayan didaktik bir şiirdir. İlk dört dörtlük ciddi uyarılar taşırken son bölüm şairin kendisini “biraz deli” diye anmasıyla mizahi bir dönüş yapar. Buna rağmen sözün ağırlığı korunur; gönül alçaldıkça manevi mertebenin yükseldiği temel hüküm öne çıkar.
  temaVeKonu: Ana tema kul hakkı, kibir ve öfkenin tehlikesidir. Şiirin konusu, gönlün Kâbe kadar değerli olduğunu bilmek, mazlumun bedduasından sakınmak ve kişinin elini, dilini, belini denetlemesidir. Vurana elsiz, sövene dilsiz olma çağrısı karşılığı Allah’a bırakmayı önerir. Kibrin şeytandan geldiği ve nefsin esaretinin cehennem sonucuna uzandığı söylenerek ahlaki sorumluluk manevi hesapla bağlanır.
  dilVeSoylevis: Dil açık, buyurgan ve tasavvufi öğütlerle yüklüdür. “Dikkat et”, “gönül kırma”, “havale et”, “sahip çık” ve “başını eğik tut” emirleri dinleyene doğrudan yönelir. Kâbe, Mevla, kul hakkı, şeytan, nefis ve cehennem kavramları uyarıların dinî çerçevesini kurar. Son dörtlükte şairin kendisini üçüncü kişi gibi anması, sert nasihatin içine öz alay katar.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; uzun dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda yinelenen “başa beladır” redifi ayrı kusurları tek sonuçta birleştirir. Yapı gönül ve mazlumdan kul hakkına, bedensel davranışlara, öfke ve kibre, son olarak şairin sözüne ilerler. Tekrar, nasihatlerin hafızada kalmasını sağlar.
  gelenekVeSonuc: Gönlü Kâbe’ye denk tutmak, vurana elsiz ve sövene dilsiz olmak, nefsi denetlemek ve alçaldıkça yükselmek tasavvufi halk şiirinin temel düşünceleridir. Öğüt ile mizahın birleşmesi âşık söyleyişini canlı tutar. Eserin sonucu, gerçek yüceliğin kibirle değil gönül alçaklığıyla kazanıldığı; kul hakkı ve mazlum ahının insanın karşısına mutlaka ağır bir hesap olarak çıkacağıdır.
