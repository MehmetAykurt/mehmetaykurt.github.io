baslik: Kuldan korkmalı
aciklama: Mehmet Aykurt’un Kuldan korkmalı adlı şiiri; kendi aslını ve kusurunu bilmeyen, kibirli ve ikiyüzlü insandan sakınmayı öğütler.
tarih: "2027-02-18"
icerikTuru: Şiir
anaTema: Kibir ve özbilinç yoksunluğu
konu: Günahsız görünmeye çalışan, kendi kusurunu kabul etmeyen ve aynaya baktığında utanmayan kişinin tehlikeli oluşu
siirTuru: Didaktik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sanırsın arınmış bütün günahtan
  Zemzemle yıkamış sanki yaradan
  Var olduk hepimiz bir damla sudan
  Aslını bilmeyen kuldan korkmalı

  Hiç kusur bulur mu insan kendinde
  Diz boyu çamura batsın isterse
  Bende de vardır elbet deyipte
  Başını eğmeyen kuldan korkmalı

  Uzak olsun aman böyle bir insan
  İstemem vallahi vermesin selam
  Bakınca aynaya birazcık utan
  Astarı dökülmüş kuldan korkmalı
degerlendirme:
  genelBakis: “Kuldan korkmalı”, kendisini günahsız ve kusursuz gösteren kibirli insanın tehlikesini anlatan didaktik bir taşlamadır. Zemzemle yıkanmış gibi davranan kişi, bütün insanların bir damla sudan yaratıldığı gerçeğini unutur. Diz boyu çamura batsa da başını eğmez; aynaya baktığında utanmaz. Şiir, dışarıdaki gösterişten çok insanın aslını bilmemesini ve öz eleştiri yapmamasını korkutucu bulur.
  temaVeKonu: Ana tema kibir ve özbilinç yoksunluğudur. Şiirin konusu, kendi kusurunu görmeyen, günahsızlık görüntüsü veren ve ortak insanlık kökenini unutan kişiden uzak durma gereğidir. Çamura batmak açık kusuru, baş eğmemek ise bunu kabul etmeyen gururu simgeler. Son dörtlükte selamının bile istenmemesi, ahlaki bozulmanın sosyal ilişkiyi imkânsız hâle getirdiğini gösterir.
  dilVeSoylevis: Dil sert, uyarıcı ve halk söyleyişine yakındır. Zemzem, bir damla su, çamur, ayna ve astar imgeleri görünüş ile öz arasındaki farkı kurar. “Kuldan korkmalı” nakaratı her dörtlüğün sonunda kesin bir hüküm verir. “İstemem vallahi” sözü kişisel tepkiyi güçlendirirken “birazcık utan” buyruğu doğrudan yüzleşme çağrısıdır. Astarın dökülmesi, gizlenen gerçek yapının açığa çıkmasını anlatır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her bölümün sonunda yinelenen “kuldan korkmalı” redifi uyarının ağırlığını korur. İlk bölüm yaratılış ve asıl, ikinci bölüm kusur ve kibir, üçüncü bölüm ise yüzleşme ve uzaklaşma üzerinde durur. “İnsan/selam/utan” ses yakınlıkları son bölümün sert kapanışını destekler.
  gelenekVeSonuc: Kul, günah, Zemzem, yaratılış ve baş eğme kavramları halkın dinî-ahlaki söz varlığına dayanır. Kibirli insan tipini somut benzetmelerle yermesi şiiri âşık edebiyatının taşlama geleneğine yaklaştırır. Eserin sonucu, gerçek tehlikenin kusur işlemekten çok kusuru inkâr etmek olduğu düşüncesidir; insan aslını bildikçe alçakgönüllü, bilmedikçe güvenilmez hâle gelir.
