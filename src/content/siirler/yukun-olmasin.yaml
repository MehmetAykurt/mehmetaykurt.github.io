baslik: Yükün Olmasın
aciklama: Mehmet Aykurt’un Yükün olmasın adlı şiiri; şefkatsiz ve faydasız kişinin yola, kola, dile, dünyaya ve aşk sazına yük olmamasını ister.
tarih: "2027-01-28"
icerikTuru: Şiir
anaTema: İnsanın faydalı ve ölçülü olması
konu: Sevgi, şefkat ve güzel söz taşımayan kişinin başkalarına, dünyaya ve aşkın sazına zarar vermemesi için geri durmasının öğütlenmesi
siirTuru: Didaktik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gideceksen eğer gelme boşuna
  Yollara bari yükün olmasın
  Şefkatin yoksa basma bağrına
  Kollara bari yükün olmasın

  Hayatta bilmezsin gönül almayı
  Kusuru yok sayıp iyiyi bulmayı
  Konuşmayı bilmiyorsan dene susmayı
  Diline bari yükün olmasın

  Ne diye yaratmış kulu yaradan
  Ne huzurun var ne de bir faydan
  Nasibini al da kara topraktan
  Dünyaya bari yükün olmasın

  Çalamıyorsun belli ki aşkın sazını
  Dokunma perdeye bırak sapını
  Vurup mızrabı inletme bamı
  Tellere bari yükün olmasın
degerlendirme:
  genelBakis: “Yükün olmasın”, sevgi, şefkat ve fayda üretmeyen kişiyi başkalarının hayatından uzak durmaya çağıran sert bir öğüt şiiridir. Yol, kol, dil, dünya ve saz telleri farklı ilişki alanlarını temsil eder. Söyleyici gönül almayı ve iyi konuşmayı bilmeyene susmayı önerir; aşkın sazını çalamayanın perdeye dokunmaması istenir. Böylece varlık, başkasına zarar vermeme sorumluluğuyla ölçülür.
  temaVeKonu: Ana tema insanın faydalı ve ölçülü olmasıdır. Şiirin konusu, şefkat taşımayan kişinin sarılmaması, iyi söz söyleyemeyenin dilini tutması ve huzur vermeyenin dünyaya yük olmamasıdır. Son dörtlükte ilişki bir saz çalma eylemine benzetilir; beceriksiz dokunuş bam telini incitir. Her bölüm, bir alanda yetersiz olan kişiye geri durma ve zarar vermeme sınırı çizer.
  dilVeSoylevis: Dil doğrudan, eleştirel ve emir ağırlıklıdır. “Gelme”, “basma”, “dene susmayı”, “dokunma” ve “bırak” fiilleri kesin sınırlar koyar. “Bari yükün olmasın” nakaratı, fayda sağlayamayan kişiden en azından zarar vermemesini isteyen acı bir beklentidir. Gönül almak, bağra basmak ve kara topraktan nasip almak halk söyleyişini; perde, sap, mızrap ve bam teli âşık şiirinin saz dünyasını taşır.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; uzun dizelerde ölçü genişler. Her dörtlüğün ikinci ve dördüncü dizelerinde yinelenen “yükün olmasın” kalıbı güçlü bir redif oluşturur. Yapı yoldan kollara, dilden dünyaya ve oradan saz tellerine ilerler. Bu genişleme, bireysel ilişkinin zararını toplumsal varlığa ve sanatsal duyarlığa kadar taşır.
  gelenekVeSonuc: Gönül, bağır, kara toprak ve saz imgeleri şiiri halk ve âşık edebiyatı geleneğine bağlar; kişiyi kusurları üzerinden açıkça eleştirmesi taşlama niteliği kazandırır. Şiir yalnız yetenek eksikliğini değil, bu eksikliğin başkasını incitmesini hedef alır. Sonuçta temel ahlak ölçüsü şudur; iyilik yapamayan, sevemeyen ya da güzel konuşamayan kişi en azından başkasının yoluna ve gönlüne yük olmamalıdır.
sira: 72
