baslik: Azizim
aciklama: Mehmet Aykurt’un Azizim adlı şiiri; tuzaklarla dolu dünyada söze hemen güvenmemeyi, sağlam adımlarla doğru yolda yürümeyi öğütler.
tarih: "2027-02-06"
icerikTuru: Şiir
anaTema: Hayatta tedbirli ve kararlı olmak
konu: Uydurma sözlere ve tuzaklara karşı dikkatli olmak, kalabalığa kapılmadan sağlam adımlarla doğru yolda yürümek ve verilen öğüdü saklamak
siirTuru: Didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Kel başa şimşir tarak
  Uydururlar bak azizim
  Her bir yanın olmuş tuzak
  Düşürürler bak azizim

  Güvenme ha her kelama
  Dil dediğin döner anca
  Adımların pek olmazsa
  Kaydırırlar bak azizim

  Aldırma hiç sağa sola
  Devam et sen düz yoluna
  Yanakların gözyaşıyla
  Yıkatırlar bak azizim

  Koyun kuzu sürüsüyle
  Gider gelir hep birlikte
  Ayrılırsa eğer bir de
  Parçalarlar bak azizim

  Benden sana söylemesi
  Bu öğüdüm sakla emi
  Gün gelir de bir gün belki
  Kullanırsın bak azizim
degerlendirme:
  genelBakis: “Azizim”, tuzaklarla dolu bir çevrede söze hemen güvenmeden, sağlam adımlarla doğru yolda yürümeyi öğütleyen şiirdir. “Kel başa şimşir tarak” sözüyle uygunsuz ve yapay vaatler eleştirilir. Kalabalık içinde güvenli görünen koyun ve kuzunun ayrılınca parçalanması, sürü psikolojisinin kırılganlığını gösterir. Son bölüm, bütün uyarıları gelecekte kullanılmak üzere saklanacak bir hayat tecrübesi sayar.
  temaVeKonu: Ana tema hayatta tedbirli ve kararlı olmaktır. Şiirin konusu, dönen dile, uydurma sözlere ve çevredeki tuzaklara karşı kişinin adımlarını sağlam atmasıdır. Sağa sola aldırmadan düz yolda ilerlemek ahlaki istikrarı temsil eder. Sürüyle hareket etmenin geçici güveni de sorgulanır. Şair, muhatabına öğüdü hemen değilse bile ihtiyaç duyacağı bir günde hatırlaması için emanet eder.
  dilVeSoylevis: Dil samimi, uyarıcı ve deyimlerle zengindir. “Azizim” hitabı her dörtlükte tekrarlanarak sert uyarıları dostça bir tona taşır. “Kel başa şimşir tarak”, “dil döner” ve “sağa sola aldırma” gibi halk söyleyişleri soyut tehlikeyi gündelik ifadelerle anlatır. “Bak” fiili yalnız görmeyi değil, ibret almayı ister. “Emi” sözü finalde öğüdün yakın ve sözlü aktarım niteliğini güçlendirir.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. İkinci ve dördüncü dizelerdeki “bak azizim” kalıbı güçlü bir nakarat oluşturur. İlk bölüm tuzağı, ikinci bölüm sözü ve adımı, üçüncü bölüm doğru yolu, dördüncü bölüm kalabalığı, son bölüm ise öğüdün saklanmasını ele alır. “Uydururlar/düşürürler/kaydırırlar/yıkatırlar/parçalarlar” fiilleri tehlikeyi büyütür.
  gelenekVeSonuc: Deyim ve atasözü tadındaki başlangıç, doğrudan hitap, tekrar ve öğüt verme eseri halk şiirinin nasihat geleneğine bağlar. Şair dünyayı bütünüyle terk etmeyi değil, sözü sınayarak ve yolu şaşırmadan yaşamayı önerir. Sonuçta insanı koruyacak şey körü körüne kalabalığa uymak değil, sağlam adımlar, doğru yön ve gerektiğinde hatırlanacak tecrübedir.
