baslik: Bizi
aciklama: Mehmet Aykurt’un Bizi adlı şiiri; şiir, dua ve türkü olup gönüllerde yaşama, Nevruz ile Hıdır’da umut taşıma ve sonunda toprağa girme arzusunu anlatır.
tarih: "2027-04-25"
icerikTuru: Şiir
anaTema: Sözle kalıcılık, sevgi ve fanilik
konu: Şiir, dua ve türkü biçiminde insanların dilinde yaşamak, Nevruz ile Hıdır’da umut ve baharda çiçek olmak, sevgiyle anılıp sonunda mezara konmak
siirTuru: Lirik ve poetik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir şiir olalım şair elinde
  Bakanlar mısrada görsünler bizi
  Bir dua olalım sofi dilinde
  Her âminde kullar duysunlar bizi

  Bir türkü olalım âşık dilinde
  Kaybolalım sazın sırma telinde
  Söylenip yıllarca dilden dillere
  Gönülden sevenler bulsunlar bizi

  Nevruz'unda ateş olup yanalım
  Hıdır’ın da umut olup dağılalım
  Baharında çiçek olup açalım
  Koklarken ciğere çeksinler bizi

  Bir sevda isterim taaa gönülden
  Usanmasın bir gün olup Mehmet'ten
  Bilirim kurtuluş yoktur ecelden
  Bir mezar içine koysunlar bizi
degerlendirme:
  genelBakis: “Bizi”, şiir, dua ve türkü biçiminde insanların gönlünde ve dilinde yaşama arzusunu anlatan poetik bir şiirdir. Şair elindeki mısra, sofi dilindeki âmin ve âşık sazındaki tel kalıcılığın farklı yollarıdır. Nevruz ateşi, Hıdır umudu ve bahar çiçeği toplumsal-manevi yeniden doğuşu simgeler. Son dörtlükte bütün bu yaşama isteği ecel gerçeğiyle dengelenir ve mezarla tamamlanır.
  temaVeKonu: Ana tema sözle kalıcılık, sevgi ve faniliktir. Şiirin konusu, iki kişinin ya da şair ile sevdanın mısrada görünmesi, duada duyulması ve türküyle dilden dile aktarılmasıdır. Nevruz ile Hıdır kültürel hafızayı, çiçek olup koklanmak duyular aracılığıyla yaşama arzusunu taşır. Ancak ecelden kurtuluş olmadığı bilinir; kalıcı olmak bedenen değil, gönülden sevenlerin hatırlamasında mümkündür.
  dilVeSoylevis: Dil coşkulu, dilek kipleriyle yüklü ve ortak bir “biz” sesi taşır. “Olalım, yanalım, dağılalım, açalım” fiilleri birlikte dönüşme arzusunu gösterir. Şiir, dua, türkü, saz ve tel sanatsal-manevi taşıyıcılardır. “Görsünler, duysunlar, bulsunlar, çeksinler, koysunlar” fiilleri eserin başkalarına ulaşma isteğini kurar. “Taaa gönülden” ifadesi duygunun içtenliğini konuşma diliyle vurgular.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda yinelenen “bizi” redifi ortak kimliği sabit tutar. İlk bölüm şiir ve dua, ikinci bölüm türkü, üçüncü bölüm mevsimsel-kültürel yenilenme, son bölüm sevda ve ölüm üzerindedir. Yapı sözle yükselip toprakla kapanan bir yaşam döngüsü kurar.
  gelenekVeSonuc: Sofi, âşık, saz, Nevruz, Hıdır, bahar ve ecel kavramları halk ile âşık edebiyatının kültürel dünyasını bir araya getirir. Şiir kendi var oluş amacını da anlattığı için poetik nitelik taşır. Eserin sonucu, insan bedeninin mezara gireceği fakat içten bir şiir, dua ya da türkünün dilden dile dolaşarak sevenlerin gönlünde yaşamayı sürdürebileceğidir.
