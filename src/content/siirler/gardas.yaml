baslik: Gardaş
aciklama: Mehmet Aykurt’un Gardaş adlı şiiri; insanlığa güvenmenin doğurduğu kırgınlığı, kul hakkı ve ilahi adalet inancıyla anlatır.
tarih: "2026-12-11"
icerikTuru: Şiir
anaTema: İnsanlardan görülen vefasızlık ve ilahi adalet
konu: İyilik ve sabırla yaşarken haksızlığa uğrayan söyleyicinin insanlara duyduğu güveni yitirmesi ve hakkın ilahi divanda alınacağına inanması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Baharı görmeden kışa eriştik
  Yazımız güzümüz kalmadı gardaş
  Mevla'nın hatırına sabır eyledik
  Eridik tükendik bittik be gardaş

  Sillesini yedik kahpe feleğin
  Düşüşünü gördük halden hallerin
  Hakkına girmedik şükür kimsenin
  Ağzımızdan lokmayı aldılar gardaş

  Su misali akar gözümden yaşım
  Ne kadar yanacak daha bu başım
  İnsanlık uğruna bütün yaptığım
  Öldüğünü sonradan öğrendik gardaş

  Acınacak hale acırken düştüm
  Dünyadaki herkesi ben gibi gördüm
  Kahpelik buymuş sonradan çözdüm
  İş işten geçti nideyim gardaş

  Der Mehmet'im çetindir Hakk’ın divanı
  Kızdırır kul hakkı Yüce Mevla'yı
  Mutlaka alacak haklı hakkını
  Bekleyip görmeli o günü gardaş
degerlendirme:
  genelBakis: “Gardaş”, iyilik, sabır ve insanlık adına yaşarken haksızlığa uğrayan söyleyicinin derin kırgınlığını dile getirir. Mevsimlerin kaybıyla başlayan şiir, feleğin sillesi, elden alınan lokma ve akan yaşlarla somutlaşır. İnsanları kendisi gibi sanmanın yanılgısı kabul edildikten sonra son dörtlükte kul hakkının ilahi divanda karşılık bulacağı inancı, acıya sabır ve adalet umudu kazandırır.
  temaVeKonu: Ana tema insanlardan görülen vefasızlık ile ilahi adalete güvendir. Şiirin konusu, kimsenin hakkına girmediği hâlde ezilen, iyilik yaptıklarının değerini yitirdiğini düşünen kişinin geç de olsa kötülüğü tanımasıdır. Baharı görmeden kışa erişmek, ömrün sevinçten yoksun geçişini anlatır. Son bölüm dünyevi hesabı Hakk’ın divanına taşır ve haklının hakkını mutlaka alacağına bağlar.
  dilVeSoylevis: Dil içten, yakınmalı ve halk söyleyişine uygundur. Her dörtlükte yinelenen “gardaş” hitabı, acının bir sırdaşa anlatıldığı sıcak bir konuşma ortamı kurar. “Eridik tükendik bittik” sıralaması yorgunluğu, “ağzımızdan lokmayı aldılar” sözü haksızlığın ağırlığını artırır. “Der Mehmet’im” tapşırmasıyla kişisel yaşantı, kul hakkı ve ilahi adalet üzerine genel bir hükme dönüşür.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı uzun dizelerde ölçü farklılıkları görülür. Dörtlük sonlarındaki “gardaş” redifi hem ses bütünlüğü hem de duygusal yakınlık sağlar. Mevsim, felek, gözyaşı, insanlık ve Hakk’ın divanı sırasıyla işlenir. Bu ilerleyiş, kişisel yıpranmayı ahlaki muhasebe ve gelecekteki adalet beklentisine taşır.
  gelenekVeSonuc: Felek, mevsim, kul hakkı, Mevla ve divan kavramları halk şiiri ile âşık edebiyatının ortak söz varlığına dayanır. Dertleşme biçimindeki “gardaş” hitabı şiiri sözlü kültürün samimi tonuna yaklaştırır. Eserin sonucu karamsarlıkla sınırlı değildir; insanlar arasında gerçekleşmeyen adaletin ilahi düzende tamamlanacağı düşüncesi, söyleyicinin sabrını ve ahlaki duruşunu korumasını sağlar.
