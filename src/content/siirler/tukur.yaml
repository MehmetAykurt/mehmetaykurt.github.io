baslik: Tükür
aciklama: Mehmet Aykurt’un Tükür adlı şiiri; zulme ve haksızlığa karşı çıkma çağrısını, öfke ile sağduyu arasındaki gerilim içinde işler.
tarih: "2026-11-17"
icerikTuru: Şiir
anaTema: Zulme karşı direnç ve öfkenin denetimi
konu: Haksızlığa boyun eğmeme çağrısının sert bir tepki diliyle kurulması ve sonunda nefsin şerrinden uzaklaşma öğüdüne bağlanması
siirTuru: Taşlama ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Zalimin zulmüne başını eğme
  Tutup yakasından yüzüne tükür
  Haksızlık görürsen eğer bir yerde
  Konuştur ilmini ağzına tükür

  Hayadan anlamaz edep yoksunu
  Allah vermemiş ki yüze nurunu
  Karıştırırsa eğer ehli namusu
  Koyuver kendini çarkına tükür

  Daldaki armut dibine düşer
  Katranı ezsen olur mu şeker
  Taş bile olsa cinsine çeker
  Soyundan başlayıp sopuna tükür

  Der Mehmet'im uyma boş ver nefsine
  Anlaşmaktır en doğrusu güzelce
  Lâ havle çek bırak kendi kendine
  Dönüp git arkanı şerrine tükür
degerlendirme:
  genelBakis: “Tükür”, zulüm ve haksızlık karşısında boyun eğmeme çağrısını sert, kışkırtıcı bir söyleyişle kuran taşlamadır. İlk üç dörtlükte öfke giderek yükselir; tekrar edilen emir, zalime karşı onur ve direnç göstergesine dönüşür. Son dörtlükte ise şair kendi sertliğini frenler, anlaşmayı ve nefsin etkisinden uzaklaşmayı önererek şiirin yönünü dış çatışmadan iç denetime çevirir.
  temaVeKonu: Ana tema zulme karşı dirençtir; buna öfkenin nasıl yönetileceği sorusu eşlik eder. Şiir, haksızlık yapan ve edep sınırını aşan kişiye sert karşılık verilmesini işler. Soy ve yaradılış üzerine atasözü niteliğindeki yargılar öfkeyi büyütür. Ancak “Uyma boş ver nefsine” ve “Anlaşmaktır en doğrusu” dizeleri, nihai çözümün şiddetli tepki değil kötülükten uzaklaşmak olduğunu bildirir.
  dilVeSoylevis: Şiirin dili buyurgan, meydan okuyucu ve konuşma üslubuna yakındır. “Başını eğme”, “konuştur”, “koyuver” ve “dönüp git” fiilleri dinleyene doğrudan seslenir. “Armut dibine düşer”, “katranı ezsen olur mu şeker” ve “cinsine çeker” sözleri halkın atasözü birikimini taşır. Son dörtlükteki “Der Mehmet’im” tapşırması, sert söyleyişi kişisel bir muhasebeye bağlar.
  ahenkVeYapi: Dört dörtlükten oluşan şiir 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün ikinci ve dördüncü dizelerinde yinelenen “tükür” sözü güçlü bir redif ve vurgu noktasıdır. İlk üç bölümde tepki genişlerken son bölüm ani bir dönüş yapar. Bu karşıtlık, şiirin gerilimini yalnız sesle değil düşünce düzeniyle de kurar.
  gelenekVeSonuc: Atasözlerinden yararlanması, haksızlığa karşı açık tavır alması ve tapşırmayla sona yaklaşması eseri âşık şiirinin taşlama geleneğine yerleştirir. Bununla birlikte son bölüm, öfkenin nefsin buyruğuna dönüşmemesi gerektiğini hatırlatan didaktik bir denge sağlar. Şiirin dikkat çekici yanı, çok sert bir nakaratı sonunda kötülüğün şerrinden uzaklaşma anlamına çevirmesidir.
