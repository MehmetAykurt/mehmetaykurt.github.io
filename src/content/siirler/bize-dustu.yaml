baslik: Bize Düştü
aciklama: Mehmet Aykurt’un Bize Düştü adlı şiiri; yönetici ile halk arasındaki eşitsizliği, adalet ve demokrasi kaybını eleştiren bir taşlamadır.
tarih: "2026-11-08"
icerikTuru: Şiir
anaTema: Eşitsizlik, adaletsizlik ve yönetim eleştirisi
konu: Yönetici çevrenin refahına karşı halka sabır, yoksulluk ve baskının düşmesi; adalet ile demokrasinin zayıflaması
siirTuru: Toplumsal ve siyasi taşlama
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Padişahım sarayında
  Gece gündüz sefasında
  Vezirleri etrafında
  Rezilliği bize düştü

  Eksik olmaz masasından
  Balı kaymak sofrasından
  Ona rızık alasından
  Bize sabrı şükrü düştü

  Mühürlendi halkın ağzı
  Katmerlendi ense payı
  Kader deyip etti razı
  İmanımız suya düştü

  Tek adama bağlı millet
  Bu muydu cumhuriyet
  Kalmadı ki hiç adalet
  Demokrasi güme düştü

  Geçilmedi Çanakkale
  Şimdi verdik bak sessizce
  Bir yabancı her köşede
  Yurt dediğin ele düştü

  Fazla uzamasın dilin
  Bağlanır arkaya elin
  Yeter artık kır kalemin
  Hesabımız Hakk'a düştü
degerlendirme:
  genelBakis: “Bize Düştü”, yönetici çevrenin refahı ile halkın payına düşen yoksulluk, sabır ve baskı arasındaki karşıtlığı eleştiren sert bir siyasi taşlamadır. Saray ve sofra görüntüleriyle başlayan eşitsizlik, halkın ağzının mühürlenmesine, adalet ile demokrasinin kaybına ve yurdun elden gittiği düşüncesine uzanır. Son bölümde söz söylemenin bedeli ve hesabın Hakk’a bırakılması öne çıkar.
  temaVeKonu: Ana tema eşitsizlik, adaletsizlik ve yönetim eleştirisidir. Şiirin konusu, yönetenlerin sefa ve bolluk içinde yaşarken halka sabır, şükür, baskı ve yoksunluk düşmesidir. İlk iki dörtlük ekonomik ve sınıfsal karşıtlığı, sonraki bölümler ifade özgürlüğü, tek kişiye bağlılık, demokrasi ve yurt kaygısını işler. Son dörtlük, dünyevi adaletin gerçekleşmediği yerde ilahi hesaba yönelir.
  dilVeSoylevis: Dil doğrudan, sert ve karşıtlıklar üzerine kuruludur. Padişah, saray, vezir, bal ve kaymak bolluğun; mühürlü ağız, ense payı ve bağlı el baskının simgeleridir. “Bize düştü” kalıbı yönetici ile halk arasındaki paylaşımın adaletsizliğini her dörtlükte yeniden duyurur. “Kır kalemin” sözü, şairin kendisine yönelen susma buyruğunu ve eleştirel sözün tehlikesini görünür kılar.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır. Dörtlük sonlarındaki “düştü” sözü redif görevi görerek her alandaki kaybı ve halkın payına düşeni birleştirir. “Sarayında / sefasında / etrafında”, “dilin / elin / kalemin” ve “millet / cumhuriyet / adalet” ses birlikleri ahengi destekler. Eleştiri ekonomik alandan siyasi ve manevi alana doğru genişler.
  gelenekVeSonuc: Yöneticiyi padişah ve saray imgeleriyle eleştirmek, halkın sıkıntısını doğrudan dile getirmek ve sonunda hükmü Hakk’a bırakmak halk şiirindeki taşlama geleneğine dayanır. Şiir güncel yönetim kavramlarını geleneksel iktidar simgeleriyle yan yana getirir. Eserin öne çıkan yönü, her dörtlükte başka bir kaybı “düştü” sözüyle kayda geçirerek eşitsizlik ve baskı eleştirisini güçlü bir bütünlüğe ulaştırmasıdır.
