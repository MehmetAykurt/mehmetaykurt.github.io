baslik: Böyle bir garip tanıdım
aciklama: Mehmet Aykurt’un Böyle bir garip tanıdım adlı şiiri; gurbette yalnız yaşayan, genç yaşta ölen ve kimsesiz toprağa giren bir insanın ağıdını söyler.
tarih: "2027-04-16"
icerikTuru: Şiir
anaTema: Kimsesizlik, gurbet ve ölüm
konu: Dışı gülerken içi dertli olan, ana babasız ve vatansız yaşayan genç bir garibin ölümü, sevenlerinin yası ve yalnız defnedilmesi
siirTuru: Ağıt
gelenek: Halk şiiri ve ağıt geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ağlamış gözleri nemli
  Dışı Güler içi dertli
  Allah'ın bir çaresizi
  Böyle bir garip tanıdım

  Yatar kalkar yaban elde
  Yok mudur vatanı kimse
  Ana baba hak getire
  Böyle bir garip tanıdım

  Daha gencecik bir fidan
  Dalı yaprağı olmayan
  Yaş süzülür yanağından
  Böyle bir garip tanıdım

  Sevenleri Kara yasta
  Haber edin eşe dosta
  Uzatmışlar bir kenara
  Böyle bir garip tanıdım

  Ne yazık ki yalan dünya
  Herkes kendi sefasında
  Yalınız girdi toprağa
  Böyle bir garip tanıdım
degerlendirme:
  genelBakis: “Böyle bir garip tanıdım”, gurbette, ana babasız ve kimsesiz yaşayan genç bir insanın ölümünü anlatan ağıttır. Dışı gülerken içinin dertli olması görünüş ile yaşanan acı arasındaki farkı kurar. Dalı ve yaprağı olmayan fidan, hem gençliği hem dayanaksızlığı simgeler. Sevenleri kara yasa düşse de garibin yalnız toprağa girmesi, dünyanın duyarsızlığına yönelen ağır bir siteme dönüşür.
  temaVeKonu: Ana tema kimsesizlik, gurbet ve ölümdür. Şiirin konusu, yaban elde vatanı ve ailesi bulunmayan bir gencin gözyaşlarıyla sürdürdüğü hayat ve erken ölümüdür. “Allah’ın bir çaresizi” sözü insan desteğinden mahrum kalışı belirtir. Haber eşe dosta ulaşsa ve sevenler yas tutsa bile son yolculuk yalnızdır. Dünyanın herkes kendi sefasındayken bu ölümü seyretmesi, toplumsal vicdanı sorgular.
  dilVeSoylevis: Dil yalın, acıklı ve tanıklık tonundadır. “Garip” sözü yoksulluktan çok kimsesizlik ve gurbet duygusunu taşır. “Dışı güler içi dertli” karşıtlığı saklanan acıyı, “ana baba hak getire” ifadesi aile yokluğunu halk söyleyişiyle anlatır. Fidan, dal ve yaprak imgeleri gençliği somutlaştırır. Her dörtlükte yinelenen başlık dizesi, şairin gördüğü kişiyi unutmadığını bildirir.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde farklılık görülür. Her bölümün sonunda tekrarlanan “Böyle bir garip tanıdım” dizesi ağıt nakaratıdır. Yapı gözlerden gurbet hayatına, gençlik imgesine, ölüm haberine ve toprağa ilerler. “Nemli/dertli”, “yasta/dosta” sesleri bölüm içi ahengi desteklerken tekrar tanıklığı sabit tutar.
  gelenekVeSonuc: Gariplik, yaban el, genç fidan, kara yas, yalan dünya ve toprağa giriş halk ağıtlarının temel söz varlığına dayanır. Belirli bir kişinin adı verilmeden anlatılması, garibi benzer kaderleri yaşayan herkesin simgesine dönüştürür. Eserin sonucu, insanın kalabalık dünya içinde kimsesiz bırakılmasının acı bir toplumsal yara olduğudur; şiir bu unutulmuş kişiye sözle bir hafıza kurar.
