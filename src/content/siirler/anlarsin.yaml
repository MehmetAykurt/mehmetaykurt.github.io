baslik: Anlarsın
aciklama: Mehmet Aykurt’un Anlarsın adlı şiiri; gençliğe güvenen insana yaşlılığı, anne baba kaybını ve ömrün hızla geçişini hatırlatır.
tarih: "2027-02-27"
icerikTuru: Şiir
anaTema: Gençliğin geçiciliği ve yaşlılık
konu: Gençlik gururunun zamanla sona ermesi, anne baba kaybı, bedenin güçten düşmesi ve ömrün değerinin yaş kemale erince anlaşılması
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gel güvenme gencim diye dünyaya
  Günler gelip geçtiğinde anlarsın
  Dediklerim gitmez belki hoşuna
  Yaş kemale erdiğinde anlarsın

  Deli rüzgâr eser şimdi başında
  Keskin kılıç gibi hazır kınında
  Eyvallahı olmaz ana babaya
  Öksüz yetim kaldığında anlarsın

  Gelinlik kız gibi gelir gözüne
  Kanma sakın boyasına süsüne
  Gün gelir ki bir köşede sessizce
  Belin bükük kaldığında anlarsın

  Aklar düşer o simsiyah saçına
  Derman bulup kalkamazsın ayağa
  Bir lokmayı aldığında ağzına
  Yutsam diye uğraşınca anlarsın

  Der Mehmet'im ömür hızla geçiyor
  Bir hafta bir gün gibi geliyor
  Nefis bu ya şimdi kabul etmiyor
  Yaş yetmişe geldiğinde anlarsın
degerlendirme:
  genelBakis: “Anlarsın”, gençliğin gücüne güvenen insana zamanın geçişini, anne baba kaybını ve yaşlılığın bedensel sınırlarını hatırlatan didaktik bir şiirdir. Gençlik deli rüzgâr ve kınındaki keskin kılıçla anlatılır; dünya ise süslü bir gelinlik kız gibi aldatıcıdır. Son bölümlerde ak saç, bükülen bel ve yutulamayan lokma aracılığıyla yaşlılık somutlaşır, öğüdün ancak deneyimle anlaşılacağı söylenir.
  temaVeKonu: Ana tema gençliğin geçiciliği ve yaşlılıktır. Şiirin konusu, genç insanın ana babaya eyvallah etmeyen özgüveninin öksüz kalınca değişmesi, dünyanın süsüne kanmasının zamanla yerini yalnızlığa bırakmasıdır. Beden güçten düştüğünde en basit hareketler bile zorlaşır. Şair yetmiş yaşından konuşarak nefsin gerçeği geç kabul ettiğini ve ömrün hızının ancak sona yaklaşınca fark edildiğini belirtir.
  dilVeSoylevis: Dil öğütleyici, şefkatli ve tecrübeye dayalıdır. “Gencim diye güvenme” çağrısı muhatabı doğrudan uyarır. Rüzgâr, kılıç, gelinlik kız, boya ve süs gençliğin hareketi ile dünyanın aldatıcılığını taşır. Ak saç, bükülen bel ve lokma yaşlılığın gündelik gerçekleridir. Her bölümde yinelenen “anlarsın” sözü, bilginin nasihatle değil yaşanmışlıkla kesinleşeceğini vurgular.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları vardır. İkinci ve dördüncü dizelerde tekrarlanan “anlarsın” redifi geleceğe bırakılan hükmü sürekli yeniler. Yapı gençlikten ana baba kaybına, dünyanın süsünden bedensel yaşlılığa ve şairin yetmiş yaşına ilerler. Bu kronolojik düzen, zaman temasını biçimsel olarak da destekler.
  gelenekVeSonuc: Dünyanın gelinlik kıza benzetilmesi, nefsin aldanışı, yaş kemali ve tapşırma şiiri halk ile âşık edebiyatının nasihat geleneğine bağlar. Şair gençliği küçümsemez; onun kalıcı sanılmasını eleştirir. Eserin sonucu, hayatın, ailenin ve beden gücünün değerinin kaybedilmeden bilinmesi gerektiğidir; çünkü zamanın öğrettiği gerçekler çoğu kez geri dönüş imkânı kalmadığında anlaşılır.
