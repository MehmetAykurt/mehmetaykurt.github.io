baslik: Köyüm
aciklama: Mehmet Aykurt’un Köyüm adlı şiiri; köyün tabiatına, insanına, emeğine ve hatıralarına duyulan güçlü bağlılığı dile getirir.
tarih: "2026-10-06"
icerikTuru: Şiir
anaTema: Köy ve memleket sevgisi
konu: Köyün mevsimleri, tabiatı, insan emeği ve hatıraları karşısında duyulan aidiyet ve fedakâr sevgi
siirTuru: Pastoral ve lirik şiir
gelenek: Halk şiiri geleneği
olcu: 7’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Dağlarına taşına
  Toprağına tozuna
  Baharına yazına
  Kurban olam köyümün

  Nazlı eser yeline
  Tatlı söyler diline
  Gecesine gününe
  Kurban olam köyümün

  Kışın yağan karına
  Ayazına buzuna
  Kıvrım kıvrım yoluna
  Kurban olam köyümün

  Bahar gelir yeşerir
  Çiğdem çiçek derlenir
  Koyun kuzu meleşir
  Kurban olam köyümün

