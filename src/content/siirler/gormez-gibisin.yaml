baslik: Görmez Gibisin
aciklama: Mehmet Aykurt’un Görmez gibisin adlı şiiri; sevgilinin mesafeli tutumu karşısında âşığın yakınlık isteğini ve sitemini işler.
tarih: "2026-08-10"
icerikTuru: Şiir
anaTema: Sevda ve sitem
konu: Sevgilinin uzak ve kırgın tavrı karşısında âşığın konuşma, bağışlanma ve yakınlaşma isteği
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Muhabbet edelim gel yar seninle
  Uzaktan uzağa gelir geçersin
  Nedir bu hallerin deyiver hele
  Bir yana boynunu büker gibisin

  Yok mudur dillerin iki kelam et
  Kusurum var ise bağışla affet
  Küsme de razıyım yeter ki naz et
  Çatılmış kaşların kızar gibisin

  Menzilin neresi söyle bileyim
  Ardına düşüp de ben de geleyim
  Serimi yoluna kurban edeyim
  Perişan halimi görmez gibisin
degerlendirme:
  genelBakis: “Görmez gibisin”, sevgilinin uzak ve kırgın tavrı karşısında âşığın konuşma, anlaşılma ve yakınlaşma isteğini dile getiren lirik bir şiirdir. Âşık, sevgilinin yanından geçip gitmesini, boynunu bükmesini ve kaşlarını çatmasını anlamlandırmaya çalışır. Şiirin genel havasında sevgiyle karışık bir sitem, bağışlanma arzusu ve karşılık bekleyen içten bir yakarış vardır.
  temaVeKonu: Ana tema sevda ve sitemdir. Şiirin konusu, sevgilinin mesafeli davranışı karşısında âşığın kusurunu öğrenmek ve gönlünü yeniden kazanmak istemesidir. İlk dörtlükte iletişim kurma çağrısı yapılır; ikinci dörtlükte olası bir kusur için bağışlanma dilenir. Son dörtlükte sevgilinin ardına düşme ve yoluna canını adama düşüncesiyle bağlılığın derecesi ortaya konur.
  dilVeSoylevis: Şiirin dili sade, konuşma havasında ve halk söyleyişine yakındır. “Deyiver hele”, “iki kelam et”, “bağışla affet” ve “yeter ki naz et” sözleri doğrudan hitabı güçlendirir. Âşığın soruları ve istekleri, duyguyu soyut anlatmak yerine yaşanan bir karşılaşma içinde görünür kılar. “Gibisin” sözü kesin hükümden kaçınan, kırgın ama yumuşak bir söyleyiş oluşturur.
  ahenkVeYapi: Üç dörtlükten oluşan şiir 11’li hece ölçüsüyle kurulmuştur. Dörtlüklerin son dizelerinde yinelenen “gibisin” sözü redif niteliği taşıyarak şiirin sitemli sesini birleştirir. “Seninle / hele”, “kelam et / affet / naz et” ve “bileyim / geleyim / edeyim” ses birlikleri uyak düzenini destekler. Ölçülü ve akıcı yapı, şiire türküye yakın bir ritim kazandırır.
  gelenekVeSonuc: Yar, naz, kaş, menzil, serini yoluna kurban etme ve sevgilinin ardına düşme gibi unsurlar şiiri halk şiiri ile âşık edebiyatının sevda anlayışına bağlar. Âşık, gururunu geri plana bırakarak bağışlanmayı ve sevgilinin yakınlığını ister. Şiirin öne çıkan yönü, yoğun bağlılığı sade bir konuşma diliyle vermesi ve sitemi sertleştirmeden içli bir yakarış hâlinde sürdürmesidir.
sira: 15
