baslik: Haberim olmaz
aciklama: Mehmet Aykurt’un Haberim olmaz adlı şiiri; yazarken kendinden geçen, keskin kalemiyle kibir ve haksızlık karşısında ölçüsünü aşabilen şairi anlatır.
tarih: "2027-05-07"
icerikTuru: Şiir
anaTema: Şairin coşkusu ve haksızlığa tepkisi
konu: Yazmaya başlayınca kendinden geçen şairin keskin kalemle kibri yermesi, kimseye nefret duymasa da haksızlık karşısında rayından çıkması
siirTuru: Poetik şiir ve taşlama
gelenek: Âşık edebiyatı ve taşlama geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Çıkarsam şapkayı koysam yanıma
  İhtiyaç duymam ki kalkan kılıca
  Eğer ki başlarsam bir de yazmaya
  Ağzımdan çıkanı kulağım duymaz

  Kalemim keskindir ucu da sivri
  Yakarsa canını karışmam emi
  Dizmeye başlarsam hele harfleri
  Çıkacak manadan haberim olmaz

  Yüzünde astarı alnında arı
  Kaybetmiş kibirden bütün varını
  Kimseler sıkmasın benim canımı
  Kaybeder kendimden haberim olmaz

  Sözümüz meclisten dışarı elbet
  Kir tutmaz gönlümüz bilmeyiz nefret
  Gel gelelim haksızlık olursa şayet
  Çıkarım rayımdan haberim olmaz
degerlendirme:
  genelBakis: “Haberim olmaz”, yazmaya başlayınca kendinden geçen, kalemini kalkan ve kılıç yerine kullanan şairin poetik taşlamasıdır. Keskin ve sivri kalem, harflerden doğacak mananın kimi inciteceğini önemsemez. Kibirli insan hedef alınırken şair kendi öfkesinin de ölçüsünü kaybedebileceğini kabul eder. Son bölüm temiz gönül ve nefretsizlik iddiasını korur; fakat haksızlık karşısında raydan çıkma ihtimalini açık bırakır.
  temaVeKonu: Ana tema şairin coşkusu ve haksızlığa tepkisidir. Şiirin konusu, yazı anında denetimini yitiren söyleyicinin sözünü güçlü bir savunma ve saldırı aracına dönüştürmesidir. Kibir yüzün astarını ve alnın arını bozan ahlaki kusur olarak taşlanır. Şair normalde nefret bilmediğini söylese de haksızlık olduğunda sakin kalamaz. Böylece şiirsel ilham ile ahlaki öfke aynı kaynaktan beslenir.
  dilVeSoylevis: Dil özgüvenli, mizahi ve meydan okuyucudur. Şapkayı çıkarıp kenara koymak yazı öncesi hazırlık gibi görünür; kalkan ile kılıca ihtiyaç duymamak kalemin gücünü belirtir. “Ağzımdan çıkanı kulağım duymaz”, “kendimden geçmek” ve “raydan çıkmak” deyimleri denetimsiz coşkuyu anlatır. “Emi” ve “meclisten dışarı” ifadeleri sert taşlamayı konuşma dilinin samimiyetiyle dengeler.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda “duymaz/haberim olmaz” ekseninde tekrarlanan olumsuzluk, kendinden geçme hâlini ritmik olarak sürdürür. Yapı yazmaya hazırlıktan kalemin keskinliğine, kibir eleştirisine ve haksızlık karşısındaki son tepkiye ilerler.
  gelenekVeSonuc: Kalemi silah gibi kullanmak, insan kusurlarını açıkça yermek, deyimlerle konuşmak ve haksızlığa tahammül etmemek şiiri âşık edebiyatının taşlama geleneğine bağlar. Aynı zamanda yazma hâlini konu edinmesi poetik nitelik taşır. Eserin sonucu, şair sözünün temiz gönülden doğsa bile adaletsizlik karşısında sertleşebileceği ve yazanın kendisini aşan anlamlar üretebileceğidir.
