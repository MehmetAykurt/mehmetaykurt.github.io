baslik: Hâkim Bey
aciklama: Mehmet Aykurt’un Hâkim Bey adlı şiiri; insanlığın suç sayıldığı tersine dönmüş bir düzeni mahkeme ve ceza imgeleriyle hicveder.
tarih: "2026-11-20"
icerikTuru: Şiir
anaTema: Adalet düzeni karşısında bireyin yabancılaşması
konu: İnsanlığın suç, ölümün ceza sayıldığı ironik bir mahkemede söyleyicinin hâkime meydan okuması ve sonunda beraat istemesi
siirTuru: Taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Mahkemeye gerek yok yazın cezamı
  Üçüne beşine bakma Hâkim Bey
  Savuşturduk zaten nice belayı
  Seninki bana vızdır bire Hâkim Bey

  Suçumuz insanlık cezası idam
  Ölmeyecek miyiz aldırma amaan
  Dar ağacında görmesin bakınca anam
  Oturduğum yerde alın canı Hâkim Bey

  Der Mehmet'im Şaka maka karıştı
  Derken biraz deli gönül bunaldı
  Bu işlerin bir cezası var mıydı
  Yoksa bana beraat verin Hâkim Bey
degerlendirme:
  genelBakis: “Hâkim Bey”, mahkeme sahnesini kullanarak adalet, suç ve ceza kavramlarını ironik biçimde ters yüz eden bir taşlamadır. Söyleyici cezadan korkmadığını ilan ederken “suçumuz insanlık” sözüyle asıl yargılananın ahlaki duruş olduğunu düşündürür. Ölüm tehdidi, ana şefkati ve son bölümdeki beraat isteği bir araya gelerek hem meydan okuyan hem de ince alay taşıyan bir ses oluşturur.
  temaVeKonu: Ana tema, adalet düzeni karşısında bireyin yabancılaşmasıdır. Şiirin konusu, cezayı önceden kabullenmiş bir insanın hâkime seslenerek hayatın belalarını mahkeme hükmünden daha ağır görmesidir. “Suçumuz insanlık cezası idam” dizesi adaletin değerleri cezalandırdığı bir düzen imgesi kurar. Son dörtlükte işin “şaka maka” karışması, kesin hükmü kuşkuya açar ve beraat talebini doğurur.
  dilVeSoylevis: Dil konuşma havasında, alaycı ve meydan okuyucudur. “Üçüne beşine bakma”, “vızdır” ve “şaka maka” gibi gündelik ifadeler mahkemenin resmî ciddiyetini bozar. “Hâkim Bey” hitabı hem saygı kalıbını korur hem de tekrarla ironik bir mesafe yaratır. “Der Mehmet’im” tapşırmasının ardından gönlün bunaldığının söylenmesi, dışarıdaki cesaretin ardında yorulmuş bir iç sesi sezdirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak dayanır; uzun dizelerde ölçü genişler. Dörtlüklerin ikinci ve dördüncü dizelerindeki “Hâkim Bey” redifi seslenişi sürekli canlı tutar. İlk bölüm meydan okuma, ikinci bölüm ölüm cezası, üçüncü bölüm ise kuşku ve beraat sırasıyla ilerler. Bu kısa dramatik akış, şiire küçük bir mahkeme konuşması görünümü verir.
  gelenekVeSonuc: Otoriteye doğrudan seslenme, mizah yoluyla eleştiri ve tapşırma kullanımı, eseri halk şiirinin taşlama çizgisine yaklaştırır. Şair resmî adalet dilini gündelik söyleyişle karşı karşıya getirerek hükmün mutlaklığını sarsar. Şiirin öne çıkan yönü, “insanlık” değerini suç gibi gösteren çarpıcı tersinleme ve ölüm karşısında bile alayı bırakmayan dirençli söyleyiştir.
