baslik: Sılanın Ötesi Gurbettir Bize
aciklama: Mehmet Aykurt’un Sılanın ötesi gurbettir bize adlı şiiri; gurbet, sıla özlemi ve yersiz yurtsuz kalma duygusunu işler.
tarih: "2026-10-15"
icerikTuru: Şiir
anaTema: Gurbet ve sıla özlemi
konu: Köyünden ve ailesinden uzakta yaşayan insanın iki yer arasında kalması, aidiyetini ve ömrünü yollarda yitirmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sılanın ötesi gurbettir bize
  İsterse olsun birkaç metre
  Bakınca köyüm görülmez ise
  Ruhumda sızılar başlıyor gardaş

  Geldi de geçiyor ömrüm yollarda
  Gurbetle sılanın kaldım arada
  Ne burada oldum ne de orada
  Yerimi yurdumu şaşırdım gardaş

  Boğazımda düğüm düğüm sözcükler
  İçerimde dinmek bilmeyen sesler
  Duyguma tercüman çalan türküler
  Dinlerken damlalar akıyor gardaş

  Anadan babadan bacıdan ayrı
  Çekilir mi böyle gurbetin kahrı
  Ne güzünü gördüm ne de yazını
  Hayatım böyle bitiyor gardaş
degerlendirme:
  genelBakis: “Sılanın ötesi gurbettir bize”, uzaklığı metreyle değil, köyün gözden kaybolması ve gönülde başlayan sızıyla ölçen içli bir gurbet şiiridir. Anlatıcı ömrünü yollarda geçirirken ne gurbete ne de sılaya bütünüyle ait olabilir. Boğazında düğümlenen sözlere türküler tercüman olur; aileden ve mevsimlerden ayrı geçen hayat, bitmeyen bir gurbet kahrına dönüşür.
  temaVeKonu: Ana tema gurbet ve sıla özlemidir. Şiirin konusu, köyünden uzak yaşayan insanın iki yer arasında kalarak aidiyetini yitirmesidir. İlk dörtlükte gurbetin fiziksel uzaklıktan çok görememekle başladığı belirtilir. Sonraki bölümlerde yollarda geçen ömür, yersiz yurtsuz kalma, türkü dinlerken dökülen yaşlar ve aileden ayrılık işlenir. Gurbet, hayatın tamamını kuşatan bir yazgı olur.
  dilVeSoylevis: Dil sade, samimi ve konuşma havasındadır. Her dörtlüğün sonunda kullanılan “gardaş” hitabı, anlatıcının acısını yakın bir dosta açtığını hissettirir. “Gurbetle sılanın arasında kalmak”, “boğazda düğümlenen sözcükler” ve “türkülerin duyguya tercüman olması” özlemi somutlaştırır. Ana, baba ve bacının birlikte anılması, ayrılığın aile boyutunu güçlü biçimde duyurur.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde hece farklılıkları görülür. Dörtlük sonlarındaki “gardaş” sözü redif ve hitap işlevini birlikte taşır. “Yollarda / arada / orada”, “sözcükler / sesler / türküler” ve “ayrı / kahrı / yazını” ses yakınlıkları ahengi destekler. Yapı, uzaklıktan aidiyet kaybına ve aile özlemine ilerler.
  gelenekVeSonuc: Gurbet, sıla, yollarda geçen ömür, aile hasreti, türkü ve dosta dert anlatma halk şiirinin köklü duygu alanlarındandır. Şiir, gurbete özgün bir ölçü getirerek onu köyün görünmez olduğu yerde başlatır. Eserin öne çıkan yönü, coğrafi uzaklığı ruhsal bir sınır olarak ele alması ve iki mekân arasında kalan insanın yersiz yurtsuzluk duygusunu samimi bir “gardaş” söyleyişiyle aktarmasıdır.
sira: 37
