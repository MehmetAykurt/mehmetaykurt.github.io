baslik: Yaylada Bir Güzel Gördüm
aciklama: Mehmet Aykurt’un Yaylada Bir Güzel Gördüm adlı şiiri; güzellik ve aşk temasını yayla ve tabiat imgeleriyle işleyen lirik bir güzellemedir.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Güzellik ve aşk
konu: Yaylada görülen güzelin tabiat unsurlarıyla ve ideal güzellik imgeleriyle anlatılması
siirTuru: Lirik şiir ve güzelleme
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü
siirMetni: |-
  Yaylada Bir Güzel Gördüm
  Sanki yüzü aya benzer
  Bülbül gibi şakır dili
  Sanki kaymak bala benzer

  Karıştırdım lale ile
  Mor sümbüllü menekşeyle
  Kıyıp dokunamaz kimse
  Sandım ki fidana benzer

  Gelir salına salına
  Zülüfleri omuzunda
  Kurban olam edasına
  Sandım ki ceylana benzer

  Mevla çekmiş sürmesini
  Kime nasip etmiş seni
  Bu dünyadan değil belli
  Sandım ki huriye benzer

  Kına yakmış ellerine
  Can dayanmaz gözlerine
  Bak Mehmet'in hallerine
  Sandım ki aşığa benzer
degerlendirme:
  genelBakis: “Yaylada Bir Güzel Gördüm” adlı şiir, halk şiirindeki güzelleme geleneğine yakın duran, sade ve içten bir aşk şiiridir. Şiirde karşılaşılan güzel, doğadan ve geleneksel güzellik anlayışından alınan benzetmelerle anlatılır. Okuyucuda hayranlık, saflık ve gönül çarpıntısı duygusu bırakır.
  temaVeKonu: Şiirin ana teması güzellik ve aşktır. Konu, yaylada görülen bir güzelin âşık üzerindeki etkisidir. Güzelin yüzü aya, dili bülbüle, tatlılığı kaymakla bala, yürüyüşü ceylana, güzelliği ise huriye benzetilir. Bu benzetmeler, sevgiliyi sıradan bir insan olmaktan çıkarıp ulaşılması güç, neredeyse masalsı bir varlık hâline getirir.
  dilVeSoylevis: Şiirin dili oldukça sade, akıcı ve halk söyleyişine yakındır. “Kurban olam edasına” gibi ifadeler, şiire samimi ve yöresel bir sıcaklık kazandırır. Söyleyiş, doğrudan hayranlık duygusu üzerine kuruludur. Şair, gördüğü güzeli abartılı ama içten benzetmelerle anlatır. Bu yönüyle şiirde coşkulu ve sevgi dolu bir anlatım tonu vardır.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüyle yazılmıştır. “Benzer” sözcüğünün dörtlük sonlarında tekrar edilmesi şiire belirgin bir ahenk kazandırır. “Sandım ki” ifadesinin yinelenmesi de şiirin ritmini güçlendirir. Benzetmelerin art arda sıralanması, şiire hem ezgili bir akış hem de halk türkülerini andıran bir söyleyiş verir.
  gelenekVeSonuc: Şiir, Türk halk şiirindeki güzelleme türüyle güçlü bir bağ kurar. Yayla, bülbül, lale, sümbül, menekşe, fidan ve ceylan gibi imgeler, halk şiirinde sıkça kullanılan güzellik unsurlarıdır. Son dörtlükte “Mehmet” adının geçmesi, âşık edebiyatındaki mahlas söyleyişini hatırlatır. Genel olarak şiir, sevgilinin güzelliğini tabiatla iç içe veren, yalın dili ve ahenkli yapısıyla geleneksel halk şiiri çizgisinde başarılı bir güzellemedir.
