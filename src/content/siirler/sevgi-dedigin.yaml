baslik: Sevgi Dediğin
aciklama: Mehmet Aykurt’un Sevgi Dediğin adlı şiiri; sevginin gözyaşından türküye ve toprağa uzanan derin yönünü halk şiiri diliyle anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Sevgi
konu: Sevginin gözyaşından türküye, efsanevi aşklardan toprağa kadar uzanan derin ve tarif edilemez yönü
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Gün olur süzülür gelir gözlerden
  Söz olur dökülür ince dillerden
  Kırmızı güllere rengini veren
  Bülbülün kanıdır sevgi dediğin

  Peşinden Mecnun'u çöle düşüren
  Ferhat'a uğrunda dağı deldiren
  Kerem'i narıyla küle çeviren
  Gönülde ateştir sevgi dediğin

  Gece vakti vuran ayın şavkında
  Söylenen türküdür yıllar boyunca
  Bazen Dadaloğlu olur bazen Karaca
  Aşığın varıdır sevgi dediğin

  Ne sayarsan say koca muamma
  Ne tarife girer ne de kalıba
  Sanma ki mahsustur yalnız canlıya
  Bir avuç topraktır sevgi dediğin
degerlendirme:
  genelBakis: “Sevgi Dediğin” adlı şiir, sevgiyi hem bireysel hem de kültürel yönleriyle ele alan güçlü bir şiirdir. Şiirde sevgi; gözyaşı, söz, gül, bülbül, ateş, türkü ve toprak gibi imgelerle anlatılır. Genel hava, sevginin insanı yakan, dönüştüren, yaşatan ve var oluşa anlam katan büyük bir değer olduğu düşüncesi üzerine kuruludur.
  temaVeKonu: Şiirin ana teması sevgidir. Konu, sevginin tek bir tanıma sığmayan çok yönlü yapısıdır. İlk dörtlükte sevgi, gözlerden süzülen yaş ve dilden dökülen söz olarak verilir. İkinci dörtlükte Mecnun, Ferhat ve Kerem gibi halk anlatılarının kahramanları üzerinden sevginin fedakârlık ve yanış yönü vurgulanır. Üçüncü dörtlükte sevgi, türkü ve âşıklık geleneğiyle ilişkilendirilir. Son dörtlükte ise sevginin yalnızca canlılara özgü olmadığı, bir avuç toprağa bile yönelen derin bir bağlılık olduğu belirtilir.
  dilVeSoylevis: Şiirin dili sade, anlaşılır ve halk söyleyişine yakındır. “Sevgi dediğin” ifadesinin tekrarı, şiire hem konuşma havası hem de güçlü bir vurgu kazandırır. Söyleyiş yer yer öğüt verici, yer yer lirik bir nitelik taşır. Mecnun, Ferhat, Kerem, Dadaloğlu ve Karaca gibi adların kullanılması şiire kültürel bir derinlik katar.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüyle yazılmıştır. Her dörtlüğün sonunda yinelenen “sevgi dediğin” ifadesi, şiirin ana düşüncesini pekiştiren bir redif görevi görür. “Gözlerden / dillerden / veren”, “düşüren / deldiren / çeviren” gibi ses benzerlikleri şiirin ahengini güçlendirir. Düzenli dörtlük yapısı ve tekrarlar, şiire türkü havasına yakın bir ritim kazandırır.
  gelenekVeSonuc: Şiir, halk şiiri ve âşık edebiyatı geleneğiyle güçlü bir bağ kurar. Mecnun, Ferhat ve Kerem gibi aşk kahramanlarının anılması, sevginin halk anlatılarındaki fedakârlık ve yanış yönünü öne çıkarır. Dadaloğlu ve Karaca göndermeleri ise şiiri doğrudan âşıklık geleneğine bağlar. Genel olarak şiir, sevgiyi yalnızca aşk duygusu olarak değil; türküye, toprağa ve insanın varlık anlayışına uzanan geniş bir değer olarak işler.
sira: 7
