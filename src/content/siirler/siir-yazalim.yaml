baslik: Şiir yazalım
aciklama: Mehmet Aykurt’un Şiir yazalım adlı şiiri; sevilen kişiyle ortak bir şiir kurmayı, aşk ile acıyı ve hayat ile ölümü paylaşmayı anlatır.
tarih: "2027-04-28"
icerikTuru: Şiir
anaTema: Aşkı ve şiiri birlikte kurmak
konu: Kalemden başlığa, bakıştan gözyaşına, Şirin ile Ferhat’tan mezar kazısına kadar sevdanın bütün yönlerini iki kişi arasında paylaşmak
siirTuru: Lirik ve poetik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir şiir yazalım gel yar seninle
  Kalemini sen tut ucunu da ben
  Kocaman bir başlık hemen üstüne
  Yarısını sen yaz yarısını ben

  Sevda olsun hasret olsun içinde
  Leyla olsun Mecnun olsun özünde
  İz bıraksın okuyanın gönlünde
  Aşkını sen yazda dramını ben

  Ben bilmem ki tutmak nedir ellerden
  Hiç duymadım sevilmeyi dillerden
  Okuyamadım mutluluğu gözlerden
  Bakışını sen yaz yaşını da ben

  Nereye varacak bilinmez sonu
  Bu derde düşenin çetindir yolu
  Sevdanın tarihi acıyla dolu
  Şirin’ini sen yaz Ferhat’ını ben

  Kimi zaman kapılalım umuda
  Kimi zaman sığınalım Mevla'ya
  En sonunda düşsek kara toprağa
  Kazmasını sen tut küreğini ben
degerlendirme:
  genelBakis: “Şiir yazalım”, sevilen kişiyle yalnız bir metni değil aşkın bütün sevincini, acısını ve sonunu ortaklaşa kurma isteğidir. Kalem, başlık ve dizeler iki kişi arasında paylaştırılır; Leyla-Mecnun ve Şirin-Ferhat anlatıları ortak şiirin özüne yerleşir. Bakış ile gözyaşı, umut ile Mevla’ya sığınma yan yana gelir. Son dörtlükte paylaşım kara toprağa ve mezar kazısına kadar sürer.
  temaVeKonu: Ana tema aşkı ve şiiri birlikte kurmaktır. Şiirin konusu, sevgilinin aşkı, bakışı ve Şirin’i; söyleyicinin dramı, gözyaşı ve Ferhat’ı yazmasıdır. Bu dağılım, sevdanın aydınlık ve karanlık yüzlerini iki sese böler. Okurun gönlünde iz bırakma arzusu şiirin sanat amacını gösterir. Sonun bilinmemesi ve yolun çetinliği, ortak üretimi ortak kader düşüncesine dönüştürür.
  dilVeSoylevis: Dil oyunlu, samimi ve sürekli karşılıklı paylaşım kurar. “Sen ... ben” yapısı her dörtlüğün sonunda yinelenerek sevgililer arasında görev ve duygu dağıtır. Kalem, başlık, yazmak ve okumak sözcükleri şiirin kendi oluşumunu konu edinir. Leyla, Mecnun, Şirin ve Ferhat geleneksel aşk hafızasını taşır. Son dizedeki kazma-kürek paylaşımı, romantik söyleyişi kara mizaha yaklaşan çarpıcı bir finalle kapatır.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Dörtlük sonlarındaki “sen ... ben” paralelliği temel ritmik yapıdır. İlk bölüm şiirin biçimini, ikinci bölüm temasını, üçüncü bölüm kişisel eksikliği, dördüncü bölüm aşk geleneğini, son bölüm umut ve ölümü işler. Böylece şiirin yazılışından hayatın kapanışına uzanan bir bütünlük oluşur.
  gelenekVeSonuc: Leyla-Mecnun ve Şirin-Ferhat göndermeleri, yar hitabı, Mevla ve kara toprak şiiri âşık edebiyatı geleneğine bağlar. Aynı zamanda şiirin nasıl yazılacağını şiir içinde anlatması poetik bir özellik kazandırır. Eserin sonucu, sevdanın yalnız mutluluğu değil dramı, gözyaşını ve ölümü de paylaşmak olduğu; gerçek ortaklığın kalem ucundan mezar toprağına kadar sürdüğüdür.
