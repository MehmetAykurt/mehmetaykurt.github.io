baslik: Yaş
aciklama: Mehmet Aykurt’un Yaş adlı şiiri; insanın yaşı, ruhu ve bedeni arasındaki çelişkiyi mizahi bir halk şiiri söyleyişiyle işler.
tarih: "2026-09-09"
icerikTuru: Şiir
anaTema: Yaş, benlik ve zaman
konu: İnsanın doğum tarihini ve yaşını hesaplamaya çalışırken ruhu, bedeni ve benliği arasında yaşadığı mizahi karışıklık
siirTuru: Mizahi ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bilmem ki arkadaş kaç yaşındayım
  Anamdan doğalı yaşıyorum ben
  Dur hele şöyle hesap yapayım
  Parmağımla tek tek sayıyorum ben

  Anam bilir dedim doğum yılımı
  Bakın hele cevaba yazın ortası
  Var mı acep diye açtım kitabı
  Gelmişten geçmişten okuyorum ben

  Ruhuma bakarsan daha küçüğüm
  Bedenim diyor ki altmış üçlüyüm
  Benliğim karışmış ama güçlüyüm
  Sanırım birazcık karışığım ben

  Üç beş güne söylerim sana
  O zamana kadar bulurum anca
  Acele ettirip beni şaşırtma
  Tekrardan başa dönüyorum ben

  Ortada ne gün var ne de tarihi
  E ne yapayım canım suç benim mi
  Birazcık düşünsek buluruz belki
  Yıllardır kafamı kaşıyorum ben
degerlendirme:
  genelBakis: “Yaş”, insanın kaç yaşında olduğunu hesaplamaya çalışırken ruhu, bedeni ve benliği arasında yaşadığı karışıklığı mizahi bir dille anlatır. Şair basit görünen bir soruyu parmakla sayma, anaya sorma, kitaba bakma ve yeniden başa dönme gibi aşamalarla büyütür. Şiirin genel havasında kendisiyle eğlenen, yaşlanmayı ağırlaştırmadan karşılayan sıcak ve nükteli bir anlatım vardır.
  temaVeKonu: Ana tema yaş, benlik ve zamandır. Şiirin konusu, doğum tarihi belirsizliği üzerinden kişinin gerçek yaşıyla ruhsal yaşı arasındaki uyumsuzluktur. Ruh kendini küçük hissederken beden altmış üçü söyler; benlik ise bu iki bilgi arasında karışır. Hesap her defasında ertelenir ve sonuç bulunamaz. Böylece takvim yaşı ile insanın kendini hissettiği yaş arasındaki fark öne çıkar.
  dilVeSoylevis: Dil gündelik konuşmaya yakın, samimi ve mizah yüklüdür. “Dur hele”, “acep”, “üç beş güne söylerim”, “suç benim mi” ve “kafamı kaşıyorum” sözleri anlatıcıyı okurla sohbet eden canlı bir kişiye dönüştürür. Sorular, ertelemeler ve küçük bahaneler mizahi etkiyi besler. Şair kendi şaşkınlığını saklamaz; onu şiirin temel gülümseme kaynağı hâline getirir.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; birkaç dizede hece farklılığı görülür. Dörtlüklerin sonunda sıkça yinelenen “ben” sözü anlatıcının kendisiyle hesaplaşmasını vurgular. “Küçüğüm / üçlüyüm / güçlüyüm” ve “sana / anca / şaşırtma” ses birlikleri ahengi destekler. Hesabın tekrar başa dönmesi yapıya döngüsel bir nitelik kazandırır.
  gelenekVeSonuc: Gündelik bir meseleyi nükteli bir dille ele almak, dinleyiciye doğrudan seslenmek ve kişisel hâllerden genel bir insanlık durumu çıkarmak halk şiirinin mizahi damarına uygundur. Şiir yaşlanma konusunu kaygı ya da yakınma yerine kendine dönük ince bir alayla işler. Eserin öne çıkan yönü, yaş hesabındaki belirsizliği ruh ile beden arasındaki canlı ve sevecen bir çatışmaya dönüştürmesidir.
sira: 25
