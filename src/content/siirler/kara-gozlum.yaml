baslik: Kara Gözlüm
aciklama: Mehmet Aykurt’un Kara gözlüm adlı şiiri; hasret ve çaresizlik içindeki âşığın sevgiliden yardım ve kavuşma isteğini anlatır.
tarih: "2026-08-13"
icerikTuru: Şiir
anaTema: Hasret ve çaresizlik
konu: Ayrılığın kuşattığı âşığın sevgiliden yardım, derman ve kavuşma beklemesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Uçurumlar sarmış dört bir yanımı
  Uzattım elimi tut kara gözlüm
  Kime arz eyleyim ben bu halımı
  Himmet eyle bana gel kara gözlüm

  Gecelerim gündüzüme ek oldu
  Akar yaşım yanağımda sel oldu
  Her nefesim içerime dert oldu
  Dermanım sendedir gel kara gözlüm

  Der Mehmet’im şu hasretlik bitmiyor
  Gelem dedim buna gücüm yetmiyor
  Çaresizlik bana ruhsat vermiyor
  Feryadım sanadır duy Kara Gözlüm
degerlendirme:
  genelBakis: “Kara gözlüm”, ayrılık ve çaresizlik içinde kalan âşığın sevgiliden yardım, derman ve kavuşma bekleyişini anlatan içli bir şiirdir. Uçurumlarla kuşatılmış olma duygusu, daha ilk dizede çıkışsızlığı belirginleştirir. Gecenin gündüze eklenmesi, gözyaşının sele ve nefesin derde dönüşmesiyle hasret büyür; şiir sevgiliye yöneltilen bir feryatla sona erer.
  temaVeKonu: Şiirin ana teması hasret ve çaresizliktir. Konu, sevdiğine ulaşamayan âşığın her yönden kuşatılmış hissederek ondan el, himmet ve derman beklemesidir. İlk dörtlükte yardım çağrısı, ikinci dörtlükte ayrılığın gündelik hayata ve iç dünyaya yayılması işlenir. Son dörtlükte kavuşma isteğine rağmen gücün yetmemesi, çaresizliği şiirin temel düğümü hâline getirir.
  dilVeSoylevis: Dil sade, yoğun ve doğrudan bir hitap üzerine kuruludur. “Kara gözlüm” sözü hem sevgiliyi adlandırır hem de her dörtlükte yinelenerek yakarışın yönünü belirler. “Arz eylemek”, “himmet”, “derman”, “ruhsat” ve “feryat” kelimeleri şiire geleneksel ve içli bir ton kazandırır. Emir biçimindeki “tut”, “gel” ve “duy” sözleri, âşığın acil yardım isteğini güçlendirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle düzenli biçimde kurulmuştur. “Kara gözlüm” sözü dörtlük sonlarında redif niteliği kazanır. “Yanımı / halımı”, “oldu / oldu / oldu” ve “bitmiyor / yetmiyor / vermiyor” ses tekrarları şiirin ahengini kuvvetlendirir. Özellikle ikinci dörtlükteki “oldu” yinelemesi, derdin giderek büyüdüğü hissini ritimle destekler.
  gelenekVeSonuc: Kara gözlü sevgili, hasret, gözyaşı, derman, feryat ve âşığın adını söylemesi, şiiri halk şiiri ile âşık edebiyatı geleneğine bağlar. “Der Mehmet’im” ifadesi mahlas söyleyişini hatırlatırken sevgiliden himmet beklenmesi onu yalnız sevilen kişi değil, kurtuluş umudu hâline getirir. Şiirin gücü, ayrılık acısını yalın fakat etkili imgeler ve düzenli bir türkü ritmiyle aktarmasındadır.
sira: 16
