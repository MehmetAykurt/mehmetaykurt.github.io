baslik: Deli Gönül Gel Kapılma
aciklama: Mehmet Aykurt’un Deli gönül gel kapılma adlı şiiri; yaralı gönlü yeni bir sevdanın yükünden ve karşılıksız vermekten sakındırır.
tarih: "2027-01-07"
icerikTuru: Şiir
anaTema: Gönlü karşılıksız sevgiden koruma
konu: Geçmiş yaraları ve hayat yükü ağır olan gönlün yeni bir aşka kapılmaması, her güzeli kendine ait sanmaması ve yalnız vermenin insana göre olmadığı
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Deli gönül gel kapılma
  Ceyhan suyu hızlı akar
  Bunca yük var omuzunda
  Dayanamaz dibe batar

  Sürüklenme sağa sola
  Tutan olmaz yıkılınca
  Her güzeli benim sanma
  Gider başka eli sarar

  Yaraların dizi dizi
  Senin derdin sana yetti
  Bir dert daha açma emi
  Hayatında tadı kaçar

  Tatmayınca sevilmeyi
  Doğru sandın hep sevmeyi
  Almadan yalnız vermeyi
  Kudret-i ilahi yapar
degerlendirme:
  genelBakis: “Deli gönül gel kapılma”, geçmiş yaraları ve omuzundaki yükler ağırlaşmış gönlü yeni bir sevdanın akıntısından korumaya çalışan içli bir öğüt şiiridir. Ceyhan suyunun hızlı akışı, duygunun insanı sürükleyip dibe çekme tehlikesini somutlaştırır. Son bölümde yalnız sevmek ve sürekli vermek sorgulanır; karşılık almadan sınırsız bağışlamanın insani gücü aşan, ilahi bir kudret olduğu söylenir.
  temaVeKonu: Ana tema gönlü karşılıksız sevgiden korumaktır. Şiirin konusu, zaten yaraları bulunan kişinin her güzeli kendisine ait sanmaması ve yeni bir dert açmamasıdır. Yıkıldığında tutacak kimsenin bulunmayacağı uyarısı yalnızlık duygusunu büyütür. Sevilmeyi tatmamış gönlün yalnız sevmeyi doğru sayması, sevgi anlayışındaki dengesizliğin kaynağı olarak gösterilir ve karşılıklılık ihtiyacı vurgulanır.
  dilVeSoylevis: Dil şefkatli, uyarıcı ve gönülle doğrudan konuşan bir yapıdadır. “Kapılma”, “sürüklenme”, “sanma” ve “açma” emirleri sert görünse de gönlü koruma kaygısı taşır. Ceyhan suyu, yük, batmak ve yaralar aynı tehlikeyi farklı yönlerden anlatır. “Emi” sözü öğüdü samimileştirir. Son dizedeki “kudreti ilahi” ifadesi, insan sevgisinin sınırlarını dinî bir ölçüyle belirler.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. Dörtlük sonlarındaki “batar, sarar, kaçar, yapar” uyakları düzenli bir ses akışı sağlar. İlk bölüm su ve yük imgesiyle tehlikeyi kurar, ikinci bölüm kaybı, üçüncü bölüm geçmiş yaraları, son bölüm ise sevmenin ahlaki ölçüsünü ele alır. Böylece somut uyarıdan düşünsel sonuca ilerleyen bir yapı oluşur.
  gelenekVeSonuc: Gönülle söyleşme, nehir ve yara imgeleri, emir biçimindeki öğütler şiiri halk ve âşık edebiyatı geleneğine yaklaştırır. Ceyhan’ın yerel bir tabiat unsuru olarak kullanılması duyguyu belirli bir coğrafyayla buluşturur. Eserin sonucu sevgiyi reddetmek değildir; sürekli veren fakat sevilmeyen insanın tükenmesini önlemek ve sevginin insani ilişkide karşılıklı bir değer taşıması gerektiğini hatırlatmaktır.
sira: 65
