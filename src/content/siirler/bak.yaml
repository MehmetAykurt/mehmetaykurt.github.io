baslik: Bak
aciklama: Mehmet Aykurt’un Bak adlı şiiri; insanı görünüşüyle değil özü, davranışı, gönlü, sözü ve sanatıyla değerlendirmeyi öğütler.
tarih: "2026-12-26"
icerikTuru: Şiir
anaTema: İnsanı doğru tanıma ve öze bakma
konu: Dış güzelliğe ve iddiaya aldanmadan kişinin kökenini, elini, dilini, gönlünü, sözünü ve sanatındaki yeterliliğini inceleme öğüdü
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ne deniz ol ne gökyüzü
  Neyse odur insanın özü
  Dikene benzetme kırmızı gülü
  Kokusuna bak rengine bak

  Bulut mu ol dediler sana
  Yağmur olup düş toprağa
  Okyanus benzer mi çaya
  Taşına bak kumuna bak

  Kavun değil koklayarak bilinmez
  Karpuz değil tıklayarak seçilmez
  İnsanoğlu ne olduğu bilinmez
  Soyuna bak sopuna bak

  Belli olmaz para kimde din kimde
  İşin ehli belli etmez kimseye
  Eğer biraz şüphe varsa içinde
  Eline bak diline bak

  Güzelliği katma sakın hesaba
  Eser kalmaz yaş altmışa varınca
  Âşık olup yanacaksan bir kıza
  Gönlüne bak sözüne bak

  Der Mehmet'im bağlıyım der halkıma
  Kendini benzetir Pir'im Sultan'a
  Ben ozanım diye söylerse sana
  Sazına bak teline bak
degerlendirme:
  genelBakis: “Bak”, insanı ve çevresini yüzeysel belirtilerle değil, özünü açığa çıkaran işaretlerle değerlendirmeyi öğütleyen didaktik bir şiirdir. Tabiat, meyve, para, din, güzellik ve ozanlık üzerinden art arda ölçüler sunulur. Kişinin iddiasına değil eline, diline, gönlüne, sözüne ve yaptığı işe bakılması istenir. Böylece şiir, görünüş ile hakikat arasındaki mesafeyi sorgular.
  temaVeKonu: Ana tema insanı doğru tanımak ve öze bakmaktır. Şiirin konusu, dış güzelliğe, söze, unvana ya da benzetmeye kolayca inanmadan davranış ve yetkinlik üzerinden hüküm vermektir. Kavun ve karpuz örnekleri insanın basit yöntemlerle seçilemeyeceğini anlatır. Sevilecek kişide gönül ve söz, ozan olduğunu söyleyende ise saz ve tel ölçü alınarak her iddianın somut karşılığının aranması öğütlenir.
  dilVeSoylevis: Dil öğütleyici, benzetmelerle zengin ve halk söyleyişine yakındır. Deniz, gökyüzü, bulut, yağmur, okyanus ve çay imgeleri büyük görünme arzusuna karşı doğal özü hatırlatır. Kavun ile karpuzdan hareket eden gündelik örnekler soyut düşünceyi somutlaştırır. Dörtlük sonlarındaki “bak” buyruğu dinleyeni edilgen yargıdan etkin gözleme çağırır; tapşırma şairlik iddiasını da aynı ölçüye bağlar.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı kısa dizelerde ölçü farklılıkları vardır. Her bölümün son dizesinde ikili biçimde yinelenen “bak” sözü güçlü bir redif oluşturur. Şiir tabiatın görünüşünden insanın kökenine, davranışına, sevgisine ve sanatına doğru ilerler. Bu basamaklı yapı, öğüdün alanını giderek genişletir ve son dörtlükte ozanlığa ulaşır.
  gelenekVeSonuc: Tabiattan ve gündelik hayattan alınan örnekler, emir biçimindeki öğütler ve “Der Mehmet’im” tapşırması şiiri âşık edebiyatının didaktik çizgisine yerleştirir. Son bölümde ozanın sözü kadar sazının ve telinin de sınanması, sanatçıyı eleştirinin dışında bırakmaz. Eserin sonucu, insanın ne söylediğinden çok özüyle uyumlu davranış ve üretimlerinin güvenilir ölçü olduğudur.
