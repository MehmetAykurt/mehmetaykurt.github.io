baslik: Tek Taraflı Olmaz
aciklama: Mehmet Aykurt’un Tek taraflı olmaz adlı şiiri; kusurun iki tarafta aranmasını, gönül kırınca özür ve helallik dilenmesini öğütler.
tarih: "2027-01-22"
icerikTuru: Şiir
anaTema: Özeleştiri ve karşılıklı sorumluluk
konu: Başarısızlıkta yalnız bir tarafı suçlamamak, el ve dil kusurlarını kabul etmek, kırılan gönlü onarıp helallik almadan huzur beklememek
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Attığın hedefi bulmuyorsa eğer
  Yayda da var okta da var
  Kusurun sahibi olmazmış meğer
  Sende de var bende de var

  Tek taraflı olmaz kusur dediğin
  Senin de mutlaka vardır ettiğin
  Ben haklıyım deme her yerde daim
  Elde de var dilde de var

  El öpmekle dudak aşınır sanma
  Kırdığın gönlü öyle bırakma
  Helallik almadan huzura varma
  Cenneti var cehennemi var
degerlendirme:
  genelBakis: “Tek taraflı olmaz”, anlaşmazlık ve başarısızlıklarda bütün kusuru karşı tarafa yüklemek yerine kişinin kendi payını görmesini isteyen didaktik bir şiirdir. Hedefi bulmayan ok örneğinde hata hem yayda hem okta aranır. El ve dil davranışın araçları olarak sorumluluğu somutlaştırır. Son dörtlükte kırılan gönlü onarmak ve helallik almak, dünyevi huzurun yanı sıra manevi hesabın da şartı sayılır.
  temaVeKonu: Ana tema özeleştiri ve karşılıklı sorumluluktur. Şiirin konusu, kusurun tek kişiye ait olmadığını kabul etmek, “ben haklıyım” ısrarından vazgeçmek ve yapılan yanlışı telafi etmektir. Yay ile ok arasındaki ilişki, sonucun ortak nedenlerden doğduğunu anlatır. Gönül kırmanın cennet ve cehennemle ilişkilendirilmesi, sıradan görünen bir davranışın ahlaki ve dinî ağırlığını vurgular.
  dilVeSoylevis: Dil yalın, öğütleyici ve atasözü niteliğindeki benzetmelere dayanır. “Yayda da var okta da var”, “sende de var bende de var”, “elde de var dilde de var” paralellikleri hem denge düşüncesini hem de ses uyumunu kurar. “El öpmekle dudak aşınır sanma” ifadesi özür dilemenin kişiyi küçültmeyeceğini halk söyleyişiyle anlatır. Emirler doğrudan bir ahlak çağrısı oluşturur.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; kısa nakarat dizelerinde ölçü farklılıkları vardır. İlk iki dörtlüğün sonunda “var” tekrarı kusurun dağılımını ritmik biçimde gösterir. Son bölümde aynı yapı “Cenneti var cehennemi var” hükmüne yükselir. Ok ve yaydan el ile dile, oradan gönül ve ahirete doğru genişleyen düzen dikkat çekicidir.
  gelenekVeSonuc: Ok-yay benzetmesi, el öpme ve helallik kültürü, doğrudan öğüt ve tekrarlar şiiri halk şiirinin didaktik geleneğine bağlar. Eser haklı çıkmayı değil, gönül onarmayı üstün tutar. Sonuçta huzurun yolu kusuru paylaşabilmekten, özür dilemekten ve kırılan kişiden helallik almaktan geçer; dünyevi ilişkilerle manevi sorumluluk birbirinden ayrı görülmez.
sira: 70
