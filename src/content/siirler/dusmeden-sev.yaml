baslik: Düşmeden Sev
aciklama: Mehmet Aykurt’un Düşmeden sev adlı şiiri; sevdayı Mecnun, Ferhat, Kerem, Kamber ve Tahir’in acılarına düşmeden yaşamayı öğütler.
tarih: "2027-01-10"
icerikTuru: Şiir
anaTema: Kendini tüketmeden sevmek
konu: Klasik aşk kahramanlarının çektiği acılar hatırlatılarak sevginin eziyete, yoksunluğa ve kendini yok etmeye dönüşmeden yaşanması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sevdasız olmaz ya gönül dediğin
  Mecnun olup çöle düşmeden sev
  Yerini bulsun vaat ettiğin
  Ferhat olup dağı delmeden sev

  Eziyet olmasın aşkın gönlüne
  Mutluluğu her daim hisset içinde
  Nasipte kavuşmak olmasa bile
  Kerem gibi yanıp kül olmadan sev

  Her saniye her dakika dilinde
  Seviyorum diye diye gezinme
  Varını yoğunu kaybedip de
  Kamber gibi avuç açmadan sev

  Dinmiyorsa eğer gözünün yaşı
  Sevda olamaz bu zulmün adı
  Pazardan almadın sen bu canını
  Tahir gibi zehir yutmadan sev
degerlendirme:
  genelBakis: “Düşmeden sev”, sevginin vazgeçilmezliğini kabul ederken aşk uğruna kendini tüketmeme çağrısı yapan lirik ve didaktik bir şiirdir. Mecnun, Ferhat, Kerem, Kamber ve Tahir gibi geleneksel aşk kahramanları örnek gösterilir; onların çöl, dağ, ateş, yoksulluk ve zehirle simgelenen acıları yeniden yaşanmaması gereken sınırlar olur. Şiir, sevdayı mutlulukla ve öz değerini koruyarak yaşamayı savunur.
  temaVeKonu: Ana tema kendini tüketmeden sevmektir. Şiirin konusu, gönlün sevdasız kalamayacağını bilerek aşkın eziyete, yoksunluğa ve ölüme dönüşmesini önlemektir. Kavuşma nasip olmasa bile içte mutluluğun korunması istenir. Dinmeyen gözyaşıyla yaşanan ilişkinin sevda değil zulüm olabileceği söylenir; insan canının değeri, aşk adına yapılan sınırsız fedakârlığın önüne geçirilir.
  dilVeSoylevis: Dil öğütleyici, sıcak ve halk aşk hikâyelerinin ortak hafızasına dayalıdır. Her dörtlükte bir ya da iki aşk kahramanı anılarak dinleyene tanıdık ibret örnekleri sunulur. “Düşmeden, delmeden, kül olmadan, avuç açmadan, zehir yutmadan” ifadeleri olumsuz zarf-fiillerle sınır çizer. Sürekli tekrarlanan “sev” buyruğu ise bütün sakındırmalara rağmen sevginin reddedilmediğini vurgular.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları vardır. Dörtlüklerin ikinci ve dördüncü dizelerinde “-madan sev” kalıbı nakarat etkisi yaratır. Her bölüm başka bir efsanevi acıyı ele alırken yapı çölden dağa, ateşten yoksulluğa ve zehre ilerler. Tekrarlanan emir, farklı örnekleri ortak bir yaşam öğüdünde birleştirir.
  gelenekVeSonuc: Halk hikâyelerinin ünlü âşıklarına yapılan göndermeler, gönle seslenme ve ölçülü tekrarlar şiiri âşık edebiyatı geleneğine bağlar. Ancak eser, acıyı aşkın zorunlu kanıtı sayan anlayışı sorgulayarak geleneksel örneklere çağdaş bir öz koruma düşüncesi ekler. Sonuçta sevgi yüceltilir; fakat insanın canını, onurunu ve iç huzurunu yok eden ilişkinin sevda değil zulüm olduğu belirtilir.
