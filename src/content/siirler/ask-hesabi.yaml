baslik: Aşk Hesabı
aciklama: Mehmet Aykurt’un Aşk Hesabı adlı şiiri; aşkın hesaba sığmayan yönünü matematik kavramlarıyla anlatan lirik ve didaktik bir halk şiiri örneğidir.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Aşkın hesaba sığmaması
konu: Sevdanın akıl, mantık ve matematikle açıklanamayacak bir kader oluşu
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Bir gönlü bir gönülle toplarsın
  Çıkan sonuç sevda olur aşk olur
  Özlemini hasret ile çarparsın
  Damla damla gözden gelen yaş olur

  Bilinmezlik varsa eğer bu işte
  Denklem kursan fayda etmez kimseye
  İster Y koy ister X koy birine
  Çıkan sonuç her dem ahu zar olur

  Bölünerek çoğalırım zannetme
  Bölündükçe payın kalmaz kendine
  Sonra dönüp baktığında geçmişe
  Yaramayan sıfırların bol olur

  Gelip bana kendini mi sorarsın
  Kaybettin de ruhunu mu ararsın
  Her gülene düşünmeden kanarsın
  Gün gelir ki pişmanlığın çok olur

  Der Mehmet'im hesap uymaz sevdaya
  Aşka düşen gerek duymaz ki akla
  İster çarp ister böl istersen topla
  En sonunda kısmet neyse o olur
degerlendirme:
  genelBakis: “Aşk Hesabı” adlı şiir, aşkı matematik terimleri üzerinden anlatan, hem duygusal hem de öğüt verici yönü bulunan bir şiirdir. Şiirde toplama, çıkarma, çarpma, bölme, denklem, bilinmezlik ve sıfır gibi kavramlar sevda hâllerini açıklamak için kullanılır. Genel havasında aşkın akılla çözülemeyen, insanı bazen çoğaltan bazen de eksilten güçlü bir duygu olduğu düşüncesi öne çıkar.
  temaVeKonu: "Şiirin ana teması aşkın hesaba sığmamasıdır. Konu, insanın aşkı akıl ve mantıkla çözmeye çalışsa da sonunda kaderin ve kısmetin belirleyici olmasıdır. İlk dörtlükte iki gönlün birleşmesiyle sevdanın doğduğu anlatılır. Sonraki bölümlerde aşkın bilinmezlikler taşıdığı, denklemle çözülemeyeceği, bölündükçe insanı eksiltebileceği ve yanlış seçimlerin pişmanlık getireceği vurgulanır. Son dörtlükte ise şiirin ana düşüncesi açıkça verilir: Aşk, hesaba değil kısmete bağlıdır."
  dilVeSoylevis: Şiirin dili sade, anlaşılır ve halk söyleyişine yakındır. Matematik terimlerinin günlük aşk diliyle birleştirilmesi şiire farklı ve dikkat çekici bir anlatım kazandırır. “İster çarp ister böl istersen topla” dizesi, şiirin hem konuşma diline yakınlığını hem de temel düşüncesini güçlü biçimde yansıtır. Son dörtlükte “Mehmet’im” ifadesinin kullanılması, âşık edebiyatındaki mahlas söyleyişini hatırlatır.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüyle yazılmıştır. Dörtlük yapısı düzenlidir. “Olur” sözcüğünün dörtlük sonlarında tekrarlanması şiire güçlü bir ahenk kazandırır. “Toplarsın / çarparsın”, “sorarsın / ararsın / kanarsın” gibi ses benzerlikleri ritmi destekler. Matematik kavramlarının art arda kullanılması, şiirin anlam örgüsünü güçlendirdiği gibi söyleyişe de düzenli bir akış verir.
  gelenekVeSonuc: Şiir, biçim ve söyleyiş bakımından halk şiiri ve âşık edebiyatı geleneğiyle ilişkilidir. Dörtlük düzeni, hece ölçüsü, sade dil, mahlas kullanımı ve sevda üzerine öğüt verici tavır bu bağlantıyı güçlendirir. Şiirin öne çıkan yönü, aşkı matematik diliyle anlatmasıdır. Bu yönüyle şiir, geleneksel sevda temasına farklı bir söyleyiş kazandırır ve sonunda aşkın hiçbir hesaba uymayan, kısmetle tamamlanan bir duygu olduğunu vurgular.
sira: 6
