baslik: Zamanı Geldi
aciklama: Mehmet Aykurt’un Zamanı geldi adlı şiiri; gurbetten sılaya dönüşü, dünya yükünden arınmayı ve huzura ulaşma isteğini işler.
tarih: "2026-10-21"
icerikTuru: Şiir
anaTema: Dönüş, arınma ve huzur
konu: Gurbet ve dünya yüküyle geçen ömrün ardından sılaya, vuslata ve sakin bir hayata kavuşma arzusu
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Yıllardır yaşarım gurbet elinde
  Sılaya dönmenin zamanı geldi
  Yaşımız eriyor artık kemâle
  Vuslata ermenin zamanı geldi

  Kurtulmalı artık dünya yükünden
  Yorulmak bilmeyen nefis elinden
  Bütün kaygıları atıp üstümden
  Rahata ermenin zamanı geldi

  Varıp yerleşmeli güzel bir köşke
  İçini döşetmeli yeşil ipekle
  Çıkıp bahçeye kendi hâlimce
  Huzura ermenin zamanı geldi
degerlendirme:
  genelBakis: “Zamanı geldi”, gurbetle geçen ömrün ardından sılaya dönme, dünya yükünden arınma ve huzura kavuşma isteğini anlatan lirik ve düşündürücü bir şiirdir. Yaşın kemale ermesi, dönüş arzusunu geçici bir heves olmaktan çıkarır. Nefis ile kaygılardan kurtulma isteği, sılaya dönüşü yalnız coğrafi değil, içsel ve manevi bir vuslat olarak da yorumlamaya imkân verir.
  temaVeKonu: Ana tema dönüş, arınma ve huzurdur. Şiirin konusu, yıllarca gurbette yaşayan insanın ömrün olgunluk çağında sılaya ve vuslata yönelmesidir. İlk dörtlük dönüş kararını, ikinci bölüm dünya yükü ve nefsin baskısından kurtulmayı, son dörtlük ise sakin bir köşk ve bahçede huzur bulmayı anlatır. Her aşama, yaşamın karmaşasından dinginliğe doğru ilerleyen bir bırakış niteliğindedir.
  dilVeSoylevis: Dil sade, kararlı ve dilek bildiren fiiller üzerine kuruludur. “Dönmenin, ermenin, kurtulmalı, atıp, yerleşmeli” sözleri anlatıcının artık karar aşamasına geldiğini gösterir. Gurbet, sıla, vuslat, nefis ve huzur kelimeleri hem dünyevi hem manevi çağrışımlar taşır. “Zamanı geldi” tekrarı, ertelenmiş arzuların olgunlaşarak kaçınılmaz bir karara dönüşmesini güçlü biçimde duyurur.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; birkaç dizede hece farklılığı vardır. Dörtlüklerin ikinci ve dördüncü dizelerinde yinelenen “zamanı geldi” sözü nakarat ve redif görevi görür. “Elinde / kemâle”, “yükünden / elinden / üstümden” ve “köşke / ipekle / hâlimce” ses yakınlıkları ahengi destekler. Yapı dönüşten arınmaya, oradan huzura ilerler.
  gelenekVeSonuc: Gurbetten sılaya dönüş, yaşın kemale ermesi, nefsin yükünden kurtulma ve vuslata ulaşma, halk şiiri ile tasavvufi düşüncenin ortak kavramlarıdır. Şiir, bu kavramları sakin bir köşk ve bahçe hayaliyle somutlaştırır. Eserin öne çıkan yönü, dış dünyadaki eve dönüş isteğiyle iç dünyadaki huzur arayışını aynı “zamanı geldi” hükmü çevresinde birleştirmesidir.
