baslik: Gariplik
aciklama: Mehmet Aykurt’un Gariplik adlı şiiri; insanın sebebini açıklayamadığı iç sıkıntısını, yabancılaşmayı ve huzursuzluğu dile getirir.
tarih: "2026-09-06"
icerikTuru: Şiir
anaTema: İç sıkıntısı ve yabancılaşma
konu: Sebebi bilinmeyen bir ruhsal daralmanın insanı dünyaya, çevresine ve kendisine yabancılaştırması
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bugün bir gariplik çöktü üstüme
  Şu koca dünyaya sığamıyorum
  Ferahlık versem de kendi kendime
  Oturduğum yerde duramıyorum

  Hayra çıkar inşallah sonu
  Anlatsam anlamaz yarıdan çoğu
  Şaşırdım sanki bildiğim yolu
  Ehlini bulup da soramıyorum

  Bilmem ki arkadaş ne desem sana
  Bazen olur böyle aldırma bana
  Şöyle bir dalsam derin uykuya
  Gözlerimi bile yumamıyorum
degerlendirme:
  genelBakis: “Gariplik”, insanın sebebini tam olarak adlandıramadığı bir iç sıkıntısını ve kendi varlığına sığamama hâlini anlatan lirik bir şiirdir. Dünya geniş olsa da âşığın içi daralır; oturduğu yerde duramaz, bildiği yolu şaşırır ve uyumak istese bile gözlerini kapatamaz. Şiirin havasına huzursuzluk, yalnızlık ve anlaşılmama korkusuyla karışık bir iç konuşma hâkimdir.
  temaVeKonu: Ana tema iç sıkıntısı ve yabancılaşmadır. Şiirin konusu, ansızın çöken ruhsal daralmanın kişinin dünyayla, çevresiyle ve kendisiyle kurduğu düzeni bozmasıdır. Kendi kendine ferahlık vermeye çalışması sonuçsuz kalır; yaşadığını herkesin anlamayacağını düşünür. Ehil birine danışma ve derin uykuya sığınma isteği de gerçekleşmeyince huzursuzluk süreklilik kazanır.
  dilVeSoylevis: Dil samimi, konuşma havasında ve iç dökmeye yakındır. “Bilmem ki arkadaş ne desem sana” dizesi okuru sırdaş konumuna getirir. “Koca dünyaya sığamamak”, “bildiği yolu şaşırmak” ve “gözlerini yumamamak” sözleri ruhsal sıkışmayı gündelik ifadelerle görünür kılar. “Hayra çıkar inşallah” sözü, belirsizlik içindeki kişinin umuda tutunma çabasını yansıtır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde hece farklılıkları vardır. Dörtlük sonlarında yinelenen “-amıyorum” yapısı, kişinin yapmak istediği hâlde başaramadığı eylemleri art arda duyurur. “Üstüme / kendime”, “sonu / çoğu / yolu” ve “sana / bana / uykuya” ses yakınlıkları şiirin akışını destekler.
  gelenekVeSonuc: Gariplik, dünyaya sığamama, derdini anlayacak ehil kişi arama ve içini bir dosta açma, halk şiirindeki yalnızlık ve gurbet duygusunun iç dünyaya yönelmiş biçimleridir. Şiir dışarıdaki bir ayrılıktan çok insanın kendisiyle yaşadığı yabancılaşmayı konu edinir. Eserin gücü, adı konulamayan ruhsal sıkıntıyı sade bir konuşma dili ve sürekli başarısızlık bildiren fiillerle duyurmasıdır.
