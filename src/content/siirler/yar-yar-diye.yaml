baslik: Yar Yar Diye
aciklama: Mehmet Aykurt’un Yar yar diye adlı şiiri; ayrılık ve hasreti gül, bülbül, gözyaşı ve kor imgeleriyle türkü söyleyişinde anlatır.
tarih: "2026-08-19"
icerikTuru: Şiir
anaTema: Ayrılık ve hasret
konu: Sevgiliden ayrı kalan âşığın haber bekleyişi, gözyaşı ve giderek büyüyen ayrılık acısı
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Kurudu bağımda gülüm
  Bülbül ağlar yar yar diye
  Yardan ayrı geçer günüm
  Gönlüm ağlar yar yar diye

  Haber gelmeyince yârden
  Bir şey gelmez oldu elden
  Seller gibi gözlerimden
  Yaşlar akar yar yar diye

  Der Mehmet'im ayrılık zor
  Hiçbir derde benzemiyor
  Gün geçtikçe içime kor
  Yanar oldum yar yar diye
degerlendirme:
  genelBakis: “Yar yar diye”, sevgiliden ayrı kalmanın doğurduğu hasreti ve çaresiz bekleyişi türkü sıcaklığında anlatan lirik bir şiirdir. Bağdaki gülün kuruması ve bülbülün ağlamasıyla başlayan hüzün, haber alamama ve gözyaşına dönüşür. Son dörtlükte ayrılık, başka hiçbir derde benzemeyen ve gün geçtikçe içte büyüyen bir kor olarak belirginleşir.
  temaVeKonu: Şiirin ana teması ayrılık ve hasrettir. Âşık, sevgiliden ayrı geçen günlerini kuruyan gül ve ağlayan bülbül üzerinden anlatır. Yârdan haber gelmemesi elini kolunu bağlar; gözlerinden akan yaşlar sele benzetilir. Zaman acıyı azaltmak yerine artırır ve ayrılık içte yanan bir kora dönüşür. Böylece bekleyiş, çaresizlik ve yanış aynı duygu çizgisinde birleşir.
  dilVeSoylevis: Dil sade, içten ve halk türkülerinin doğrudan söyleyişine yakındır. “Yar yar diye” tekrarı hem sevgiliye seslenişi hem de sürekli yinelenen bir feryadı karşılar. Gül, bülbül, sel ve kor imgeleri duyguyu kolay anlaşılır fakat güçlü çağrışımlarla taşır. “Der Mehmet’im” sözü şairin kendi adını anarak ayrılık tecrübesini kişisel bir tanıklığa dönüştürür.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüyle düzenli biçimde kurulmuştur. Her dörtlüğün ikinci ve dördüncü dizelerinde yinelenen “yar yar diye” sözü güçlü bir nakarat etkisi oluşturur. “Gülüm / günüm”, “yârden / elden / gözlerimden” ve “zor / kor” ses yakınlıkları ahengi destekler. Kısa dizeler ve tekrarlar şiire ezgili, akıcı bir yapı kazandırır.
  gelenekVeSonuc: Gül ile bülbülün ayrılığı, yârdan haber bekleme, gözyaşı ve içte kor taşıma, halk şiiri ile âşık edebiyatının temel sevda unsurlarıdır. Şiirin nakaratlı yapısı onu türkü geleneğine yaklaştırır. Ayrılık acısı süslü bir anlatımdan çok yalın imgelerle verilir. Eserin belirgin gücü, “yar yar diye” tekrarını hem ahengin hem de duygusal feryadın merkezine yerleştirmesidir.
