baslik: Gel Aldanma Boşa Yalan Dünyaya
aciklama: Mehmet Aykurt’un Gel aldanma boşa yalan dünyaya adlı şiiri; ölümün kaçınılmazlığını, malın ve ömrün geçiciliğini anlatır.
tarih: "2027-03-29"
icerikTuru: Şiir
anaTema: Ölüm ve dünyanın faniliği
konu: Bütün canlıların toprağa döneceği, mal ve evladın imtihan olduğu, mezarın iki metreye sığdığı ve uzun ömrün bile ölümü yenemediği
siirTuru: Dinî ve didaktik şiir
gelenek: Halk şiiri ve tasavvufi şiir geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Her canlı ölümü mutlak tadacak
  Kurdu da kuşu da toprak olacak
  Ondan geldi yine ona varacak
  Gel aldanma boşa yalan dünyaya

  Malın da canın da sana imtihan
  İki metre bezdir nasibin olan
  Ölüm hakikattir gerisi yalan
  Gel aldanma boşa yalan dünyaya

  İster oğlun olsun isterse kızın
  İster evin olsun ister sarayın
  İki metre olur anca mezarın
  Gel aldanma boşa yalan dünyaya

  Dokuz yüz elli yıl Hazreti Nuh'a
  Ömür verildi de ne oldu sonra
  Yine de girdi kara toprağa
  Gel aldanma boşa yalan dünyaya
degerlendirme:
  genelBakis: “Gel aldanma boşa yalan dünyaya”, ölümün bütün canlılar için kaçınılmaz olduğunu ve dünyevi sahipliklerin insanla kalmayacağını anlatan didaktik bir fanilik şiiridir. Kurt ile kuş, mal ile can, oğul ile kız, ev ile saray aynı son karşısında eşitlenir. Hazreti Nuh’un dokuz yüz elli yıllık ömrü bile kara toprakta biter. Nakarat, her örneği dünyaya aldanmama çağrısına bağlar.
  temaVeKonu: Ana tema ölüm ve dünyanın faniliğidir. Şiirin konusu, insanın Allah’tan gelip yine O’na döneceği, malı ve canıyla sınandığı ve sonunda yalnız iki metre bez ile mezara sahip olacağı gerçeğidir. Aile ve saray gibi değerli görülen varlıklar ölüm karşısında kalıcı değildir. Hazreti Nuh örneği, çok uzun ömrün bile sonu değiştirmediğini göstererek fanilik düşüncesini tarihsel bir kıssayla pekiştirir.
  dilVeSoylevis: Dil açık, kesin ve öğütleyicidir. “Mutlak”, “hakikat” ve “yalan” kelimeleri ölüm karşısında tartışmasız bir hüküm kurar. “Kurdu da kuşu da” sözü canlılar dünyasını genişletirken “oğlun/kızın” ve “evin/sarayın” çiftleri insani bağlılıkları sıralar. “İki metre” ölçüsünün bez ve mezar için tekrarı, geniş dünya arzusunu dar ve somut bir sonla karşılaştırır.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonundaki başlık dizesi güçlü bir nakarat oluşturur. İlk bölüm bütün canlıları, ikinci bölüm imtihanı, üçüncü bölüm aile ve mülkü, son bölüm uzun ömrü ele alır. “Tadacak/olacak/varacak” gelecek zaman uyakları kaçınılmaz son duygusunu güçlendirir.
  gelenekVeSonuc: Yalan dünya, kara toprak, iki metre bez, mezar ve Hazreti Nuh kıssası halkın dinî-fanilik şiiri geleneğinde sık kullanılan unsurlardır. Tekrar edilen nasihat dizesi eseri nefes ve ilahi söyleyişine yaklaştırır. Şiirin sonucu, dünya nimetlerini bütünüyle reddetmekten çok onların imtihan ve geçici emanet olduğunu bilmektir; ölüm hakikat, kalıcılık iddiası ise aldanıştır.
sira: 92
