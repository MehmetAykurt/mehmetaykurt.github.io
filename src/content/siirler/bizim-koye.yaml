baslik: Bizim köye
aciklama: Mehmet Aykurt’un Bizim köye adlı şiiri; baharın köy tabiatını canlandırmasını papatya, bülbül, yağmur ve Kızılırmak imgeleriyle anlatır.
tarih: "2026-10-03"
icerikTuru: Şiir
anaTema: Bahar ve köy tabiatı
konu: Baharın gelişiyle köyde toprağın, bitkilerin, hayvanların, derelerin ve Kızılırmak’ın yeniden canlanması
siirTuru: Pastoral ve lirik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Papatyalar açar olmuş
  Bahar gelmiş bizim köye
  Gül dalına bülbül konmuş
  Bahar gelmiş bizim köye

  Kara toprak canlanıyor
  Börtü böcek uyanıyor
  Dört bir yan mis kokuyor
  Bahar gelmiş bizim köye

  Yağmur yağar seller akar
  Derelerden sular çağlar
  Kızılırmak gayri coşar
  Bahar gelmiş bizim köye
degerlendirme:
  genelBakis: “Bizim köye”, baharın gelişiyle köy tabiatında başlayan uyanışı canlı, sıcak ve ezgili bir söyleyişle anlatan pastoral bir şiirdir. Papatyanın açması ve bülbülün gül dalına konmasıyla başlayan hareket, kara toprağın, böceklerin, derelerin ve Kızılırmak’ın canlanmasıyla genişler. Şiirin genel havasına yenilenme, bereket, memleket sevgisi ve sevinç hâkimdir.
  temaVeKonu: Ana tema bahar ve köy tabiatıdır. Şiirin konusu, kışın ardından köye gelen baharın bütün canlıları ve doğal unsurları uyandırmasıdır. İlk dörtlükte çiçek ve bülbül, ikinci dörtlükte toprak, böcekler ve koku, son dörtlükte yağmur, dere ve Kızılırmak öne çıkar. Böylece baharın etkisi küçük bir çiçekten büyük bir ırmağa kadar genişleyen canlı bir çevre içinde gösterilir.
  dilVeSoylevis: Dil yalın, coşkulu ve halk söyleyişine yakındır. “Bizim köye” sözü, anlatılan mekânı yalnız coğrafi bir yer olmaktan çıkarıp aidiyet duyulan ortak bir yurt hâline getirir. “Börtü böcek” ve “gayri” gibi ifadeler yerel konuşma sıcaklığı taşır. Papatya, gül, bülbül, kara toprak ve Kızılırmak adları şiire hem somutluk hem de Anadolu’ya özgü bir tabiat duygusu kazandırır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır. Her dörtlüğün ikinci ve dördüncü dizelerinde yinelenen “Bahar gelmiş bizim köye” dizesi nakarat görevi görür. “Canlanıyor / uyanıyor / kokuyor” ve “akar / çağlar / coşar” fiillerindeki ses benzerlikleri ahengi güçlendirir. Tekrarlar şiire kolay söylenen, türküye uygun bir ritim verir.
  gelenekVeSonuc: Baharın gelişi, gül ile bülbül, toprağın canlanması, yağmurun bereketi ve coşan ırmak halk şiirinin tabiat ve memleket anlatısıyla uyumludur. Şiir köy hayatını doğrudan insan üzerinden değil, çevrenin uyanışı üzerinden duyurur. Eserin öne çıkan yönü, baharı bütün köye yayılan ortak bir sevinç olarak işlemesi ve Kızılırmak adıyla bu sevinci belirli bir Anadolu coğrafyasına yerleştirmesidir.
