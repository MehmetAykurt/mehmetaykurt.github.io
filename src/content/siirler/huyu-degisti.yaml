baslik: Huyu değişti
aciklama: Mehmet Aykurt’un Huyu değişti adlı şiiri; övgü ve çıkarla şımartılan kişinin minnetini, ölçüsünü ve insanlığını yitirmesini taşlar.
tarih: "2027-02-09"
icerikTuru: Şiir
anaTema: Övgü ve çıkarın insanı bozması
konu: Değersiz kişiyi aşırı övgüyle yüceltmenin onu kibirli hâle getirmesi, şairlik iddiasına sürüklemesi ve insani ölçülerini kaybettirmesi
siirTuru: Taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Eşeye vurduk altından pala
  Kendini benzetti Arap atına
  Bakar mı bir daha karnı doyunca
  Kalmadı minneti huyu değişti

  Fazla mı şişirdik bilmem ki nedir
  Her yazdığı metne dedik ki şiir
  O da kendini sandı ki şair
  Sıvazladık sırtını huyu değişti

  Bir türlü dengeyi tutturamadık
  Doğruyu yanlışı ayıramadık
  Hatır gönül derken biz yaya kaldık
  Kalmadı insanlık huyu değişti
degerlendirme:
  genelBakis: “Huyu değişti”, hak etmediği hâlde övülen ve çıkarı karşılanan kişinin zamanla kibirlenmesini anlatan keskin bir taşlamadır. Eşeğin altın palanla kendini Arap atı sanması, dışarıdan verilen değerin özde bir değişim yaratmadığını gösterir. Her yazdığı metne şiir denilen kişinin şairlik iddiası da aynı yanılsamanın başka yüzüdür. Son bölümde kaybedilen yalnız minnet değil, insanlıktır.
  temaVeKonu: Ana tema övgü ve çıkarın insanı bozmasıdır. Şiirin konusu, karnı doyurulan ve sırtı sıvazlanan kişinin geçmişte gördüğü desteği unutması, kendisini olduğundan üstün görmesi ve doğruyla yanlışı ayırt edemeyen çevrenin de bu değişimde pay sahibi olmasıdır. “Hatır gönül” uğruna gerçek ölçünün terk edilmesi, sonunda hem destek verenleri yaya bırakır hem de kişideki insanlık duygusunu aşındırır.
  dilVeSoylevis: Dil alaycı, açık ve halk mizahına dayanır. Eşek, altın palan ve Arap atı karşıtlığı, sonradan kazanılmış gösterişle gerçek nitelik arasındaki farkı çarpıcı biçimde kurar. “Şişirdik” ve “sıvazladık” fiilleri çevrenin yapay övgüsünü anlatır. “Biz” dili, şairin yalnız karşı tarafı suçlamadığını; bu kibrin oluşmasına yardım eden topluluğu da eleştirdiğini gösterir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda yinelenen “huyu değişti” sözü sonuç bildiren bir rediftir. İlk bölüm maddi doyumu, ikinci bölüm sanatçı kibrini, üçüncü bölüm toplu yanılgıyı işler. “Tutturamadık/ayıramadık/yaya kaldık” dizileri finalde ortak sorumluluğun ritmini güçlendirir.
  gelenekVeSonuc: Hayvan benzetmesi, alay, gündelik deyimler ve tekrarlanan hüküm şiiri âşık edebiyatının taşlama geleneğine yerleştirir. Şair sahte sanatçılığı eleştirirken yanlış övgü dağıtan çevreyi de hesaba katar. Eserin sonucu, değersiz kişiyi gösterişle yüceltmenin onu gerçekten değerli yapmayacağı; aksine minnet, ölçü ve insanlık duygusunu bozabileceği yönündedir.
