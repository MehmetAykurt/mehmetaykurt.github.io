baslik: Doğar Elbet
aciklama: Mehmet Aykurt’un Doğar elbet adlı şiiri; karanlığın ardından güneşin doğacağını, sabreden kişiye Mevla’nın yardım edeceğini anlatır.
tarih: "2027-03-26"
icerikTuru: Şiir
anaTema: Sabır, umut ve ilahi yardım
konu: Gamlanıp baş eğmemek, gönüldeki murat için sabretmek, Eyüp’ün çilesini hatırlamak ve Mevla’nın görüp yardım edeceğine inanmak
siirTuru: Dinî ve lirik şiir
gelenek: Halk şiiri ve tasavvufi öğüt geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Hiç gamlanma battı diye
  Yine güneş doğar elbet
  Yaş değmesin kirpiğine
  Mevla kerem eyler elbet

  Kısma ceylan bakışını
  Eğme sakın hiç başını
  Gönüldeki muradını
  Mevla bir gün verir elbet

  Hani binbir cefa çeken
  Eyyûb’a denk midir çilen
  Kazanacak sabreden
  Mevla yardım eder elbet

  Derdin dolup taşsa bile
  Sen yine de sabır eyle
  Demesen bile kimseye
  Mevla görür bilir elbet

  Uzat bana ellerini
  Hiç yormadan dillerini
  Ayırt etme senden beni
  Mevla bire sayar elbet
degerlendirme:
  genelBakis: “Doğar elbet”, karanlık ve keder içindeki kişiye güneşin yeniden doğacağını söyleyen umut şiiridir. Baş eğmemek, gözyaşına teslim olmamak ve gönüldeki murat için sabretmek öğütlenir. Eyüp peygamberin çilesi daha büyük bir sabır örneği olarak anılır. Son dörtlükte insani yakınlık isteği ilahi birlik düşüncesiyle birleşir; Mevla’nın iki kişiyi bir sayacağına duyulan güven dile getirilir.
  temaVeKonu: Ana tema sabır, umut ve ilahi yardımdır. Şiirin konusu, derdi dolup taşsa bile kişinin muradından vazgeçmemesi ve Mevla’nın söylenmeyen acıyı da görüp bildiğine inanmasıdır. Batan güneş geçici karanlığı, yeniden doğuş umudu ise geleceği simgeler. Eyüp kıssası çilenin ölçüsünü büyütür. Uzatılan el, sabrın yalnız bireysel değil sevgi ve dayanışmayla paylaşılan bir tutum olduğunu gösterir.
  dilVeSoylevis: Dil teselli edici, şefkatli ve kesin inanç ifadeleriyle kuruludur. “Gamlanma”, “eğme”, “sabır eyle” emirleri muhatabı ayağa kaldırmayı amaçlar. “Ceylan bakışı” sevilen kişinin inceliğini ve kırılganlığını taşır. Her dörtlükte yinelenen “Mevla ... elbet” kalıbı ilahi yardımın kesinliğini vurgular. “Görür bilir” paralelliği, söze dökülmeyen derdin bile Allah’tan gizli kalmadığını anlatır.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. İkinci ve dördüncü dizelerdeki “elbet” redifi umutlu hükmü sürekli yeniler. Yapı güneşten murada, Eyüp sabrına, görülüp bilinmeye ve el ele birliğe ilerler. “Dile/bile/eyle/kimseye” ses yakınlıkları dördüncü bölümde akışı destekler.
  gelenekVeSonuc: Güneş, ceylan, murat, Eyüp sabrı ve Mevla’nın keremi halk şiiri ile tasavvufi öğüt geleneğinin ortak unsurlarıdır. Tekrar edilen kesinlik sözü şiire nefes havası verir. Eserin sonucu, karanlığın kalıcı olmadığı ve sabreden kişinin ilahi yardımdan mahrum kalmayacağıdır. Sevgiyle uzatılan el de bu umudu dünya içinde somutlaştıran bir yakınlık işareti olur.
