baslik: Paşam
aciklama: Mehmet Aykurt’un Paşam adlı şiiri; asker kayıpları karşısındaki öfkeyi, yönetime yöneltilen sert bir hesap sorma çağrısıyla dile getirir.
tarih: "2026-11-23"
icerikTuru: Şiir
anaTema: Vatan savunması ve yönetime tepki
konu: Asker kayıpları karşısında sabrı tükenen halkın yöneticiden kararlı davranmasını istemesi ve Çanakkale hafızasıyla direniş çağrısı yapması
siirTuru: Epik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Tenhaya çekilmiş bizim yiğitler
  Meydana dökülür gayri şu itler
  Kılıcım kınından sıyrılmak ister
  Sabrımız kalmadı bilesin paşam

  Sabır sabır diye millete telkin
  Vermeyi bırakıp bir şeyler edin
  Telef olup gider dağda askerim
  Sabrımız kalmadı bilesin paşam

  Gücün mü yetmiyor iki köpeğe
  Dilesen bir günde getirin dize
  Bakmayı bırakın elin diline
  Sabrımız kalmadı bilesin paşam

  Düşün hele paşam Çanakkale'yi
  Etten duvar ördük püskürttük geri
  İki çapulcuya ezdirme bizi
  Sabrımız kalmadı bilesin paşam

  Der Mehmet'im dalgalansın bayrağım
  Gerekirse koparılsın şu başım
  Halktan değil haktan bari utanın
  Sabrımız kalmadı bilesin paşam
degerlendirme:
  genelBakis: “Paşam”, dağda hayatını kaybeden askerler karşısında duyulan öfkeyi yönetime seslenen yüksek perdeli bir söyleyişle dile getirir. Sabır çağrılarına karşı eylem talebi öne çıkar; Çanakkale hafızası bugünkü direniş isteğine dayanak yapılır. Bayrak ve can verme imgeleri şiirin epik tonunu güçlendirirken tekrar edilen nakarat, halk adına yükselen toplu bir hesap sorma sesine dönüşür.
  temaVeKonu: Ana tema vatan savunması ve yönetime duyulan tepkidir. Şiirin konusu, asker kayıpları sürerken yalnız sabır öğütleyen yöneticinin kararlı davranmaya çağrılmasıdır. İlk bölümlerde sabrın tükenişi ve düşmana duyulan öfke anlatılır. Çanakkale’de “etten duvar” örülmesi geçmişin ölçüsü olarak sunulur; son dörtlükte bayrağın dalgalanması uğruna can verme kararlılığı ahlaki hesap çağrısıyla birleşir.
  dilVeSoylevis: Dil sert, hitabetçi ve doğrudan hesap soran bir niteliktedir. “Paşam” hitabı yöneticiyi şiirin karşısına alır; “bilesin” sözü uyarının kesinliğini artırır. Kılıç, asker, bayrak ve Çanakkale imgeleri millî hafızaya seslenir. “Der Mehmet’im” tapşırmasından sonra “halktan değil haktan bari utanın” denmesi, siyasi eleştiriyi dünyevi otoritenin ötesinde vicdani ve dinî bir sorumluluğa bağlar.
  ahenkVeYapi: Beş dörtlükten oluşan şiir 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde hece farklılıkları vardır. Her dörtlüğün sonunda yinelenen “Sabrımız kalmadı bilesin paşam” dizesi güçlü bir nakarat kurar. Çoğul kişi eki, bireysel öfkeyi ortak bir sese dönüştürür. Yiğitlerden askere, Çanakkale’den bayrağa uzanan yapı, gerilimi aşama aşama yükseltir.
  gelenekVeSonuc: Yiğitlik, bayrak, kılıç ve tarihî savaş hatırası çevresinde kurulan anlatım, halk şiirinin koçaklama geleneğiyle birleşir; yöneticiye yöneltilen eleştiri ise taşlama özelliği taşır. Şair, geçmişteki fedakârlığı bugünün sorumluluk ölçüsü yapar. Eserin belirgin yanı, epik coşkuyu siyasal hesap sorma diliyle birleştirerek sabrın tükendiği duygusunu nakarat üzerinden sürekli canlı tutmasıdır.
