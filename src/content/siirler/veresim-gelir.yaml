baslik: Veresim Gelir
aciklama: Mehmet Aykurt’un Veresim gelir adlı şiiri; sevgiliye duyulan hayranlığı ve kendinden vazgeçecek ölçüde büyüyen aşkı işler.
tarih: "2026-08-04"
icerikTuru: Şiir
anaTema: Aşk ve güzellik
konu: Sevgilinin güzelliği karşısında duyulan hayranlık, kendini adama isteği ve hayale sığınan sevda
siirTuru: Lirik şiir ve güzelleme
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Benim gözümle bakarsan yâre
  Cemali benzer aya güneşe
  Mevla'nın verdiği böyle güzele
  Vallahi canımı veresim gelir

  Kaşları yay gibi gözleri ela
  Özenmiş bezenmiş yaratmış Hüda
  Kirpiği ok gibi bakışı nâra
  Vallahi kül olup yanasım gelir

  Bıraksa zülfünü deli rüzgâra
  Bir telini koparıp savursa bana
  Gece gündüz avcumda bakıp da ona
  Vallahi kendimden geçesim gelir

  Ayın şavkı vurur gece yüzüne
  Gerek yok doğmasın güneşe bile
  Bir kez eli değse elime
  Vallahi ömrümü veresim gelir

  Der Mehmet’im yıllar yılı aradım
  Kendi güzelimi kendim yarattım
  Böyle geldi geçti işte hayatım
  Ara sıra hayale dalasım gelir
degerlendirme:
  genelBakis: “Veresim gelir”, sevgilinin güzelliği karşısında büyüyen hayranlığı, yanma ve kendinden geçme isteğine kadar taşıyan lirik bir güzellemedir. Şiirin ilk dört dörtlüğünde sevgili ideal bir güzellik içinde anlatılır; son dörtlükte ise bu güzelin yıllar süren bir arayışın ve hayalin ürünü olduğu sezdirilir. Böylece coşkun sevdaya hüzünlü bir iç dönüş eklenir.
  temaVeKonu: Ana tema aşk ve güzelliktir. Sevgilinin yüzü ay ve güneşle, kaşları yayla, kirpiği okla ve bakışı narla ilişkilendirilir. Âşık, bu güzellik karşısında canını ve ömrünü vermeyi, yanmayı ve kendinden geçmeyi ister. Son bölümde “Kendi güzelimi kendim yarattım” sözü, anlatılan sevgilinin gerçeklik ile hayal arasında kurulan ideal bir suret olabileceğini düşündürür.
  dilVeSoylevis: Şiirde sade halk dili, geleneksel güzelleme söz varlığıyla birleşir. “Yâre”, “cemal”, “Hüda”, “zülf”, “ayın şavkı” ve “nâr” gibi kelimeler klasik sevda söyleyişini taşır. Her dörtlükte yinelenen “Vallahi” sözü duygunun samimiyetini ve kararlılığını artırır. İstek bildiren “veresim, yanasım, geçesim, dalasım” yapıları şiire içten bir yöneliş kazandırır.
  ahenkVeYapi: Beş dörtlükten oluşan şiir, 11’li hece ölçüsüne ağırlıklı olarak dayanır; bazı dizelerde hece farklılıkları görülür. “Gelir” sözcüğü dörtlük sonlarında yinelenerek redif niteliği kazanır. “Yâre / güneşe / güzele”, “ela / Hüda / nâra” ve “aradım / yarattım / hayatım” ses yakınlıkları uyumu besler. Tekrarlanan istek kipleri şiirin ritmik omurgasını kurar.
  gelenekVeSonuc: Ay, güneş, yay kaş, ok kirpik, zülüf, nâr ve Hüda gibi unsurlar şiiri halk şiiri ile âşık edebiyatındaki güzelleme geleneğine bağlar. Âşığın sevgili uğruna yanmayı ve can vermeyi göze alması, geleneksel sevda anlayışının güçlü bir yansımasıdır. Şiir, ideal güzelliği överken son dörtlükte hayale yönelerek anlatıya kişisel ve hüzünlü bir derinlik kazandırır.
sira: 13
taslak: false
