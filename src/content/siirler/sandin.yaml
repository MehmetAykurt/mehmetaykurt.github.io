baslik: Sandın
aciklama: Mehmet Aykurt’un Sandın adlı şiiri; geri dönmeyen birini beklemeyi ve karşılıksız acıyı sevda sanmayı sorgular.
tarih: "2027-01-19"
icerikTuru: Şiir
anaTema: Karşılıksız sevdanın sorgulanması
konu: Giden kişiyi bekleyip ağlayan gönlün çektiği eziyetin sevgi değil zulüm olduğunun söylenmesi ve önceki uyarılara kulak vermemesinin eleştirilmesi
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gözlerin yollarda kimi beklersin
  Gideni geri gelir mi sandın
  Gece gündüz öyle feryat edersin
  Halini hissedip bilir mi sandın

  Eğip de başını düşünme boşa
  Yazık değil midir gözün yaşına
  Hele biraz düşün Allah aşkına
  Sevene bu zulüm reva mı sandın

  Elbette zulümdür senin çektiğin
  Ağlıyorsa insan budur bildiğim
  Gönül eziyeti benim dediğim
  Sen bunun adını sevda mı sandın

  Der Mehmet'im kalmayasın kusura
  Kulak verseydin keşke lafıma
  Güvenme dedim olur olmaza
  Sen benim sözümü şaka mı sandın
degerlendirme:
  genelBakis: “Sandın”, gideni bekleyen ve gözyaşını sevdanın doğal bedeli sayan kişiye yöneltilmiş sorgulayıcı bir şiirdir. Söyleyici, geri dönmeyen insanın hâlden anlamayacağını ve sevene yaşatılan eziyetin aşk diye adlandırılamayacağını belirtir. Son dörtlükte daha önce verilen uyarının dinlenmediği anlaşılır; böylece şiir yalnız bir teselli değil, gerçekleşmiş bir öngörünün ardından gelen sitem olur.
  temaVeKonu: Ana tema karşılıksız sevdanın sorgulanmasıdır. Şiirin konusu, yollara bakıp feryat eden kişinin acısını sevgi sanması ve kendisine değer vermeyen birini beklemeyi sürdürmesidir. “Sevene bu zulüm reva mı” sorusu ilişkinin ahlaki ölçüsünü kurar. Gözyaşı ve gönül eziyeti, aşkın kanıtı değil, dengesizliğin sonucu sayılır. Son bölümde “olur olmaza” güvenmenin bedeli hatırlatılır.
  dilVeSoylevis: Dil doğrudan, sitemli ve öğütleyicidir. “Sandın” sözü her dörtlükte yinelenerek yanlış inancı açığa çıkaran bir sorgu işlevi görür. “Allah aşkına” ifadesi muhatabı durup düşünmeye çağıran samimi bir vurgu taşır. Yol, gözyaşı ve feryat imgeleri ayrılık duygusunu somutlaştırır. “Der Mehmet’im” tapşırmasıyla şair kendi önceki sözünü hatırlatır ve konuşmanın kişisel yönünü belirginleştirir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları vardır. İkinci ve dördüncü dizelerdeki “mı sandın” kalıbı düzenli bir nakarat oluşturur. İlk dörtlük bekleyişi, ikinci bölüm zulüm sorusunu, üçüncü bölüm bunun hükmünü, son bölüm ise dinlenmeyen öğüdü ele alır. Soru dizisi giderek kesinleşen bir sonuca ulaşır.
  gelenekVeSonuc: Yola bakma, feryat, gözyaşı, gönül eziyeti ve tapşırma unsurları şiiri âşık edebiyatının ayrılık ve öğüt damarına bağlar. Ancak eser acı çekmeyi sevdanın yüceliği sayan anlayışı reddeder. Vardığı sonuç açıktır; karşı tarafın duymadığı, bilmediği ve sürekli gözyaşı üreten ilişki sevgi değil zulümdür; gönül, olmayacak kişiye güvenmekten vazgeçmelidir.
