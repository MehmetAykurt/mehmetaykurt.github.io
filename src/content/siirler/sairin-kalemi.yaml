baslik: Şairin kalemi
aciklama: Mehmet Aykurt’un Şairin kalemi adlı şiiri; geceleri konuşan kalemi, yalnızlığı, gözyaşını ve aşk şarabıyla sarhoş olan şair ruhunu anlatır.
tarih: "2027-05-04"
icerikTuru: Şiir
anaTema: Şairin yalnızlığı ve yaratma hâli
konu: Geceleri yazan, mısralarda kendini gösteren, yalnızlık ve sessizlik içinde gözyaşıyla konuşan şairin aşk ilhamıyla sarhoş olması
siirTuru: Poetik ve lirik şiir
gelenek: Âşık edebiyatı ve modern lirik şiir geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Şairin kalemi gece konuşur
  Mısralar içinde görmeli beni
  Buğulanır gözleri yaşla buluşur
  Her akan damladan sormalı beni

  Çöker yalnızlığı kalır öylece
  Kendini konuşur kendi kendiyle
  İhtiyaç duymaz ki başka kimseye
  Sessizlik içinde duymalı beni

  Sarhoş eder beni aşkın şarabı
  Dolaşır kanımda içtikçe hazzı
  Sakiye gerek yok kurma masayı
  Issız bir köşede bulmalı beni
degerlendirme:
  genelBakis: “Şairin kalemi”, gecenin sessizliğinde yazan, gözyaşı ve yalnızlıkla kendi içine dönen şairin yaratma hâlini anlatan poetik bir şiirdir. Şair doğrudan görünmek yerine mısralarda, akan damlalarda ve sessizlikte aranmak ister. Son dörtlükte aşk şarabı ilhamın sarhoşluğuna dönüşür; saki ve masa gereksizdir. Şairin asıl mekânı, kendi kanında dolaşan hazla baş başa kaldığı ıssız köşedir.
  temaVeKonu: Ana tema şairin yalnızlığı ve yaratma hâlidir. Şiirin konusu, kalemin gece konuşması, şairin kendi kendisiyle yaptığı iç konuşmayı dizelere aktarması ve başkasına ihtiyaç duymadan sessizlikte sesini bulmasıdır. Gözyaşı yalnız acı değil, şairi tanıtan bir izdir. Aşk şarabı dışarıdan sunulan bir içki değil, bedende dolaşan ilham ve coşku olarak yorumlanır.
  dilVeSoylevis: Dil içe dönük, romantik ve şiirin kendi oluşumunu anlatan bir yapıdadır. Kalemin konuşması ve gözlerin buğulanması kişileştirme ile duygu yoğunluğu yaratır. “Görmeli, sormalı, duymalı, bulmalı beni” dizeleri okura şairi nerede araması gerektiğini söyler. Saki, şarap ve sarhoşluk geleneksel aşk mecazlarını taşırken “masa kurma” sözü bu mecazı gündelik bir yalınlıkla dönüştürür.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır. Dörtlüklerin ikinci ve dördüncü dizelerinde yinelenen “beni” redifi şairin görünme ve anlaşılma arzusunu merkezde tutar. İlk bölüm kalem ve gözyaşı, ikinci bölüm yalnızlık ve sessizlik, üçüncü bölüm aşk şarabı ile ıssız köşe üzerinde durur. Dış dünyadan içe doğru daralan yapı yaratma ânını yoğunlaştırır.
  gelenekVeSonuc: Kalem, mısra, aşk şarabı ve saki imgeleri klasik-tasavvufi şiir mirasını; yalnızlık ve kendi kendine konuşma modern lirik şair duyarlığını taşır. Eser bu iki alanı birleştirir. Sonuçta şairi toplumsal görünüşte değil yazdığı mısrada, gözyaşında ve sessizliğinde aramak gerekir; gerçek sesi kalabalıkta değil yalnızlığın üretken köşesinde duyulur.
