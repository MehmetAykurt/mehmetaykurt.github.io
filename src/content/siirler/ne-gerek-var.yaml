baslik: Ne Gerek Var
aciklama: Mehmet Aykurt’un Ne gerek var adlı şiiri; olmayana boyun eğmemeyi, iki çocukla sağlam durup rızkı kuldan değil Hak’tan bilmeyi öğütler.
tarih: "2027-03-02"
icerikTuru: Şiir
anaTema: Zulme boyun eğmeme ve özsaygı
konu: Yürümeyen bir ilişkiyi zorlamamak, zulmü kader sanmamak, iki çocuğun sorumluluğuyla insana el açmadan sağlam durmak
siirTuru: Didaktik ve lirik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ne gerek var zorlamaya
  Olmayınca olmayana
  Bunun adı kader değil
  Boyun eğme zulümkâra

  Bir fidansın iki dallı
  Daha küçük yaprakları
  Hak'tan gelir rızıkları
  Avuç açma kul olana

  Ayakların sağlam bassın
  Karşı duran şaşıp kalsın
  Unutma ki sen insansın
  Yazık etme şu canına
degerlendirme:
  genelBakis: “Ne gerek var”, olmayacak bir ilişkiyi zorlamamayı ve zulmü kader diye kabullenmemeyi öğütleyen kısa fakat kararlı bir şiirdir. Muhatap iki küçük dalı olan bir fidana benzetilir; bu imge hem kırılganlığı hem de çocuklarına karşı taşıdığı sorumluluğu anlatır. Rızkın Hak’tan geldiği söylenerek kula el açmaması, ayaklarını sağlam basması ve kendi canının değerini koruması istenir.
  temaVeKonu: Ana tema zulme boyun eğmeme ve özsaygıdır. Şiirin konusu, yürümeyen durumu kader sayıp zorlamaktan vazgeçmek, iki çocuğun bakımını üstlenirken insana minnet etmeden yaşamak ve karşı duranlara rağmen sağlam kalmaktır. “Bir fidansın iki dallı” sözü muhatabın hayatını çocuklarıyla birlikte düşünür. Son dizede insanın kendi canına yazık etmemesi, bütün öğütlerin ahlaki merkezidir.
  dilVeSoylevis: Dil doğrudan, destekleyici ve emirlerle kuruludur. “Boyun eğme”, “avuç açma”, “unutma” ve “yazık etme” fiilleri muhatabı edilgenlikten çıkarmayı amaçlar. Fidan, dal ve yaprak benzetmesi aileyi tabiat görüntüsüyle yumuşak biçimde anlatır. Buna karşı zulüm ve sağlam basan ayaklar direnç duygusunu güçlendirir. “Hak’tan gelir rızıkları” sözü güveni insanlardan ilahi kaynağa yöneltir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. İlk bölüm reddedişi, ikinci bölüm sorumluluk ve inancı, üçüncü bölüm ise öz güveni kurar. “Zorlamaya/olmayana”, “dallı/yaprakları/rızıkları” ve “bassın/kalsın” ses yakınlıkları bölümleri bağlar. Kısa yapı, öğütlerin doğrudan ve hatırlanabilir olmasını sağlar.
  gelenekVeSonuc: Fidan ve dal benzetmesi, kader ile Hak kavramları ve doğrudan nasihat şiiri halk geleneğine yaklaştırır. Eser kaderciliği reddeder; zulme boyun eğmenin kader olmadığını açıkça söyler. Sonuçta insanın değeri, başkasına bağımlı kalmadan kendi ayakları üzerinde durması ve sorumluluğunu taşıdığı canlarla birlikte yaşamını korumasıdır.
