baslik: Olasım Var
aciklama: Mehmet Aykurt’un Olasım var adlı şiiri; sevgiliyle bedensel ve ruhsal bütünleşme arzusunu tabiat imgeleriyle anlatır.
tarih: "2026-08-07"
icerikTuru: Şiir
anaTema: Aşk ve bütünleşme arzusu
konu: Sevgiliye yaklaşma, onun güzelliğinde erime ve sonunda ruhsal birliğe ulaşma isteği
siirTuru: Lirik şiir ve güzelleme
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Tutup da elini çeksem yanıma
  Sımsıkı sarılıp bassam bağrıma
  Yanacak da olsam aşkın narına
  Dokunup tenine kül olasım var

  Şeker kaymak baldan tatlı dudağı
  Utancından al al olmuş yanağı
  El değmedik bir tomurcuk goncası
  Ak göğsün üstünde ben olasım var

  Lale mi sümbül mü bilmem menekşe
  Kokusu benziyor miski ambere
  Açan bir çiğdemsin gönül bahçemde
  Tutunup köküne dal olasım var

  Dalgalı dalgalı saçlarında tel
  Titreye titreye uzattığın el
  Yağmur gibi akan gözlerinde sel
  Süzülüp yanaktan yaş olasım var

  Yaşımız eriyor artık kemale
  Geldik gidiyoruz her şey bahane
  İhtiyaç kalmadı artık bedene
  Kaybolup ruhunda sen olasım var
degerlendirme:
  genelBakis: “Olasım var”, sevgiliye yakınlaşma arzusunu bedensel hayranlıktan ruhsal bütünleşmeye doğru ilerleten lirik bir şiirdir. İlk dörtlüklerde dokunma, sarılma ve sevgilinin güzelliğinde yer edinme isteği öne çıkar. Son dörtlükte bedenin geçiciliği vurgulanarak duygu daha derin bir düzleme taşınır ve âşığın sevgilinin ruhunda kaybolma isteğiyle tamamlanır.
  temaVeKonu: Şiirin ana teması aşk ve bütünleşme arzusudur. Sevgilinin dudağı, yanağı, göğsü, kokusu, saçı ve gözyaşı çevresinde gelişen anlatım, âşığın ona dokunma ve onun varlığının bir parçası olma isteğini gösterir. Dal, tel ve yaş olma arzuları sevilen kişide erime düşüncesini büyütür. Yaşın kemale ermesiyle bedenden ruha yönelen sevda, şiirin anlam çizgisini tamamlar.
  dilVeSoylevis: Dil yalın, duygu yüklü ve doğrudan bir seslenişe sahiptir. Şeker, kaymak, bal, tomurcuk, gonca, lale, sümbül, menekşe ve çiğdem gibi imgeler sevgilinin güzelliğini duyular üzerinden görünür kılar. “Olasım var” tekrarları, âşığın her dörtlükte başka bir biçime bürünme arzusunu öne çıkarır. Söyleyiş, güzelleme ile içli bir teslimiyet arasında ilerler.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüyle düzenli bir yapı gösterir. Her dörtlüğün sonunda yinelenen “olasım var” sözü güçlü bir redif oluşturarak şiirin istek duygusunu pekiştirir. “Yanıma / bağrıma / narına”, “dudağı / yanağı / goncası” ve “kemale / bahane / bedene” ses yakınlıkları ahengi destekler. Dize akışı türkü söyleyişine uygundur.
  gelenekVeSonuc: Şiir, halk şiirinin güzelleme geleneğinden beslenir. Sevgilinin güzelliğinin çiçek, bal, gonca ve amber kokusuyla anlatılması; aşkın nârında yanma ve kül olma düşüncesi geleneksel sevda dilini yansıtır. Bununla birlikte son dörtlükte bedenin aşılması ve sevgilinin ruhunda kaybolma isteği, şiiri yalnızca dış güzelliği öven bir metin olmaktan çıkararak manevi birleşme arzusuna ulaştırır.
sira: 14
