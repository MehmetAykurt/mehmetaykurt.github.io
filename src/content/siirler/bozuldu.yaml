baslik: Bozuldu
aciklama: Mehmet Aykurt’un Bozuldu adlı şiiri; insanlık tarihindeki kırılmaları merhamet, aile, ümmet, sevgi ve tabiatın bozulması üzerinden işler.
tarih: "2026-11-11"
icerikTuru: Şiir
anaTema: Ahlaki ve toplumsal bozulma
konu: İnsanlığın ilk cinayetten aile ve ümmet ayrılıklarına, sevginin anlam kaybından mevsim düzeninin bozulmasına uzanan çözülüşü
siirTuru: Didaktik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Dönüyorken dünya kendi hâlince
  Yaratıldı insan kondu içine
  Daha o gün başladı her şey bence
  Kalmadı tadı rengi bozuldu

  Kabil'in taşı Hâbil'e değdi
  İlk defa katillik gömleği giyildi
  Koydu toprağa rahata erdi
  Kalmadı merhamet vicdan bozuldu

  Ağladı Yakup'um Yusuf'um diye
  Sevindi kardeşler Kurtulduk diye
  Bîçare beklerken kuyu dibinde
  Kalmadı bağlar aile bozuldu

  Yayıldı İslam tamama erdi
  Ümmetim diye diye canını verdi
  Şaşırdı sahabe birbirine girdi
  Kalmadı ümmet iman bozuldu

  Seviyorum demek kolaydır dile
  Seven de söyler sevmeyen de
  Leyla'sı Mecnun'u Ferhat'ı nerede
  Kalmadı Aslı Kerem bozuldu

  Der Mehmet'im Artık gafletten uyan
  Ahire eriştik geliyor zaman
  Ne yazından tat aldık ne de kışından
  Kalmadı baharı güzü bozuldu
degerlendirme:
  genelBakis: “Bozuldu”, insanlığın yaratılışından günümüze uzanan ahlaki ve toplumsal çözülmeyi dinî kıssalar, aşk anlatıları ve tabiat üzerinden ele alan didaktik bir taşlamadır. Kabil ile Hâbil’den Yakup ile Yusuf’a, ümmet ayrılığından Leyla, Mecnun, Ferhat, Aslı ve Kerem’e uzanan göndermeler, merhamet, aile, iman ve sevginin giderek zayıfladığı düşüncesini destekler.
  temaVeKonu: Ana tema ahlaki ve toplumsal bozulmadır. Şiirin konusu, ilk cinayetle başlayan merhamet kaybının aile bağları, dinî birlik, sevgi anlayışı ve tabiat düzeninde sürmesidir. Her dörtlük başka bir tarihî veya kültürel kırılma seçer. Son bölümde şair gafletten uyanma çağrısı yapar; yaz ile kıştan tat alınmaması, bozulmanın yalnız insana değil mevsim algısına kadar yayıldığını gösterir.
  dilVeSoylevis: Dil açık, hüküm veren ve öğütleyici bir yapıdadır. Kabil-Hâbil ve Yakup-Yusuf kıssalarıyla Leyla-Mecnun, Ferhat, Aslı-Kerem anlatıları ortak kültürel hafızaya seslenir. “Kalmadı” ve “bozuldu” sözleri her dörtlükte kaybın kesinliğini vurgular. “Der Mehmet’im” ifadesinin ardından gelen “gafletten uyan” çağrısı, şairi yalnız gözlemleyen değil, toplumu uyaran bir söyleyici konumuna getirir.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; dizelerde hece farklılıkları görülür. Dörtlük sonlarındaki “bozuldu” sözü redif görevi görerek farklı tarih ve değer alanlarını aynı sonuçta birleştirir. “Hâlince / içine / bence”, “diye / diye”, “uyan / zaman” ses yakınlıkları ahengi destekler. Zaman çizgisi ilk insandan çağın sonuna doğru ilerler.
  gelenekVeSonuc: Dinî kıssalardan, halk aşk hikâyelerinden ve şairin öğüt veren sesinden yararlanmak halk şiiri ile âşık edebiyatının didaktik damarına uygundur. Şiir geçmişteki ibret örneklerini bugünün ahlaki kaygılarıyla bir araya getirir. Eserin öne çıkan yönü, merhamet, aile, ümmet, sevgi ve tabiat gibi geniş bir değer dizisini “bozuldu” hükmü çevresinde tarihsel bir anlatıya dönüştürmesidir.
