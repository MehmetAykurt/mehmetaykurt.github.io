baslik: Sağ Olsun
aciklama: Mehmet Aykurt’un Sağ olsun adlı şiiri; ölümünü, salasını, kefenini, köyündeki mezarını ve ardından dua edecek insanları şükranla tasarlar.
tarih: "2027-04-22"
icerikTuru: Şiir
anaTema: Ölümü kabulleniş ve geride kalanlara dua
konu: Kaderle gelen ölümün ardından sade bir cenaze, köyde mezar, dost eliyle defin, Fatiha ve dünyada adsız kalma isteği
siirTuru: Dinî ve lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Belli olmaz bugün yarın dünyadan
  Ben giderim kalan canlar sağ olsun
  Kaderimi böyle yazmış Yaradan
  Kalem tutan kâtipleri sağ olsun

  Ecel bu geliverir ansızın
  İşte o gün geçen ömre yanarsın
  Belki bir gün bir salada duyarsın
  Merhum diyen müezzinim sağ olsun

  Haber verme sağa sola kimseye
  Benim olan bilir zaten benimse
  Bir köşede kefenleyin sessizce
  Omuzlayıp götürenler sağ olsun

  Cenazemi iletsinler köyüme
  Mezarımı derin kazın iyice
  Sıra sıra tabutumun önünde
  Saf tutan cemaatim sağ olsun

  Mümkün ise dostlar koysun kabre
  Üç beş kürek toprak atın üstüme
  Ellerini kaldırıp da göklere
  Bir Fatiha okuyanım sağ olsun

  Garip yazın mezarımın taşına
  Adım sanım hiç kalmasın dünyada
  Gün gelince karışırız toprağa
  Tozumuzu savuranlar sağ olsun

  Der Mehmet'im sakın ola güvenme
  Yalan dünya baki kalmaz kimseye
  Biz doğarken talip olduk ölüme
  Böyle bilip sabredenler sağ olsun
degerlendirme:
  genelBakis: “Sağ olsun”, söyleyicinin kendi ölümünü, salasını, kefenini, köyüne götürülen cenazesini ve defin sonrasını ayrıntılarıyla tasarladığı uzun bir kabulleniş şiiridir. Her aşamada geride kalanlara teşekkür edilir. Gösterişli tören yerine sessizlik, dost eli, birkaç kürek toprak ve Fatiha yeterli görülür. Son bölüm yalan dünyanın kimseye kalmadığını ve insanın doğarken ölüme talip olduğunu söyler.
  temaVeKonu: Ana tema ölümü kabulleniş ve geride kalanlara duadır. Şiirin konusu, ansızın gelecek ecel karşısında sade bir cenaze istemek, köy toprağına gömülmek ve dostların duasıyla uğurlanmaktır. Ad ile sanın dünyada kalmaması, mezar taşına yalnız “garip” yazılması istenir. Kaderi yazan kâtipten müezzine, tabutu taşıyandan toprağı atana kadar herkes şükranla anılır.
  dilVeSoylevis: Dil sakin, içten ve ölüm töreninin gündelik ayrıntılarıyla doludur. “Sağ olsun” nakaratı ölümü korku ya da öfkeyle değil teşekkürle karşılar. Sala, merhum, kefen, tabut, saf, kabir ve Fatiha kelimeleri cenaze geleneğini adım adım görünür kılar. “Benim olan bilir zaten benimse” sözü gerçek yakınlığın duyuruya ihtiyaç duymayacağını belirtir. Tapşırma finalde öğüdü kişiselleştirir.
  ahenkVeYapi: Şiir yedi dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonundaki “sağ olsun” redifi uzun şiiri bir arada tutar. Yapı kader ve ecelden salaya, kefene, köye, kabre, mezar taşına ve genel fanilik hükmüne ilerler. Bu kronolojik düzen, ölüm öncesinden toprağa karışmaya uzanan bütün bir tören akışı kurar.
  gelenekVeSonuc: Yalan dünya, kader, ecel, sala, köy mezarı, Fatiha, gariplik ve tapşırma halk şiirinin ölüm geleneğine dayanır. Şair kendi cenazesini anlatırken geride kalanları kutsayan bir hayır duası kurar. Eserin sonucu, ad ve şöhretin değil sade bir uğurlanışın, dost elinin ve duanın değerli olduğudur; ölümü bilerek sabredenler şükranla anılır.
