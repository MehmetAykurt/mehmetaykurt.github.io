baslik: Bu dünyayı
aciklama: Mehmet Aykurt’un Bu dünyayı adlı şiiri; çocukluktan yaşlılığa dünyanın güzel, tatlı, cennet, yalan, lanet ve hiç olarak değişen algısını anlatır.
tarih: "2027-04-01"
icerikTuru: Şiir
anaTema: Hayat deneyimiyle değişen dünya algısı
konu: Çocukluk, gençlik, yaşlanma ve ölümle yüzleşme aşamalarında dünyanın önce güzel ve tatlı, sonra yalan, zalim ve değersiz görülmesi
siirTuru: Düşünsel ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Masum gözle baktık şöyle
  Güzel sandık bu dünyayı
  Gezerken şeker elde
  Tatlı sandık bu dünyayı

  Top peşinde koşar iken
  Güzele göz kırpar iken
  Bahar yeli eser iken
  Cennet sandık bu dünyayı

  Ağır ağır durdu rüzgâr
  Gazel oldu tüm yapraklar
  Başımıza yağınca kar
  Yalan saydık bu dünyayı

  Süt kokulu bebeleri
  Küçük yaşta ölenleri
  Gördükçe o zalimleri
  Lanet saydık bu dünyayı

  Şükür akıl geldi başa
  Yazık ettik onca yıla
  Bakıp şöyle sağa sola
  Hiçe saydık bu dünyayı
degerlendirme:
  genelBakis: “Bu dünyayı”, insanın çocukluktan yaşlılığa ilerlerken dünyaya verdiği anlamın nasıl değiştiğini anlatır. Masum göz dünyayı güzel ve şeker gibi tatlı görür; oyun, sevda ve bahar onu cennete dönüştürür. Rüzgâr durup yapraklar gazel olduğunda, başa kar yağdığında bu görüntü yalanlaşır. Erken ölümler ve zalimlik görüldükçe dünya lanetlenir, sonunda bütün geçmiş hiçlik duygusuyla değerlendirilir.
  temaVeKonu: Ana tema hayat deneyimiyle değişen dünya algısıdır. Şiirin konusu, çocukluk neşesi, gençlik sevdası, yaşlılık belirtileri ve ölüm gerçeği üzerinden dünyanın farklı adlar almasıdır. İlk iki dörtlük iyimserlik, üçüncü bölüm mevsimsel çözülüş, dördüncü bölüm toplumsal acı, son bölüm ise geç kalmış bilinçlenme taşır. Süt kokulu bebeklerin ölümü, kişisel yaşlanmadan daha ağır bir ahlaki kırılma yaratır.
  dilVeSoylevis: Dil yalın, kronolojik ve güçlü karşıtlıklarla kuruludur. Şeker, top, güzel ve bahar yeli çocukluk ile gençliği; duran rüzgâr, gazel yaprak ve başa yağan kar yaşlılığı simgeler. “Sandık” ve “saydık” fiilleri geçmişteki yargıların değişkenliğini gösterir. Her dörtlüğün sonunda “bu dünyayı” redifi korunurken önündeki “güzel, tatlı, cennet, yalan, lanet, hiç” hükümleri dönüşür.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde hece farklılıkları görülür. Dörtlük sonlarındaki “bu dünyayı” redifi yaşam evrelerini aynı nesne çevresinde tutar. İlk dörtlükte iki hüküm yer aldığı için dünyanın adı toplam altı kez değişir. Yapı masum bakıştan tecrübeye, bireysel yaşlanmadan toplumsal vicdana ve nihai hiçlik değerlendirmesine ilerler.
  gelenekVeSonuc: Bahar-güz-kış döngüsü, gazel yaprak, başa yağan kar ve yalan dünya düşüncesi halk şiirinin fanilik geleneğine dayanır. Şiir soyut felsefeyi gündelik çocukluk görüntüleriyle erişilebilir kılar. Eserin sonucu, dünyanın kendisinden çok ona bakan insanın yaşı ve tecrübesinin değiştiğidir; masumiyet kayboldukça güzellik algısı yerini fanilik ve adaletsizlik bilincine bırakır.
