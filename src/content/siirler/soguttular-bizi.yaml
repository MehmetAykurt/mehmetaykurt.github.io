baslik: Soğuttular bizi
aciklama: Mehmet Aykurt’un Soğuttular bizi adlı şiiri; korku ve güvensizlik telkinlerinin insanları iyilikten ve sevgiden uzaklaştırmasını işler.
tarih: "2026-11-14"
icerikTuru: Şiir
anaTema: Toplumsal güvensizlik ve yabancılaşma
konu: Sürekli kuşku ve korku aşılayan öğütlerin insanları birbirinden, iyilikten ve merhametten uzaklaştırması
siirTuru: Toplumsal şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  İyilikten maraz doğar
  Diye soğuttular bizi
  Mutlak altta bir şey yatar
  Diye korkuttular bizi

  Korkar olduk yaklaşmaya
  Yetim başı okşamaya
  Uzak Durun insanlara
  Diye ayırdılar bizi

  Selam verme yabancıya
  Verse bile dönüp bakma
  Herkeslere el uzatma
  Diye körelttiler bizi

  Güven olmaz hiç kimseye
  Doğru mudur bilmem niye
  Yer kalmadı hiç sevgiye
  Taşa çevirdiler bizi
degerlendirme:
  genelBakis: “Soğuttular bizi”, insana yaklaşmayı tehlike sayan toplumsal telkinlerin merhamet ve güven duygusunu nasıl aşındırdığını anlatan eleştirel bir şiirdir. Yetimin başını okşamak, yabancıya selam vermek ve el uzatmak gibi gündelik iyilikler kuşku altında bırakılır. Böylece şiir, korunma kaygısıyla başlayan uzaklaşmanın insanı insana karşı duyarsızlaştırdığı sonucuna ulaşır.
  temaVeKonu: Ana tema toplumsal güvensizlik ve yabancılaşmadır. Şiirin konusu, “iyilikten maraz doğar” düşüncesinden hareketle insanlara sürekli mesafe koymayı öğreten sözlerin bireyi korkutması, ayırması ve köreltmesidir. Dörtlükler iyilik, temas, selam ve güven basamaklarını izler; son bölümde sevginin yerini taşlaşmış bir ruh hâlinin alması, bu sürecin en ağır sonucu olarak sunulur.
  dilVeSoylevis: Dil yalın, doğrudan ve halk söyleyişine yakındır. Emir biçimindeki “uzak durun”, “selam verme”, “dönüp bakma” ve “el uzatma” sözleri, kişiye dışarıdan dayatılan korku dilini görünür kılar. “Diye” bağlacı her dörtlükte gerekçe ile sonucu birbirine bağlar. “Soğuttular, korkuttular, ayırdılar, körelttiler, çevirdiler” fiilleri edilgenleşmenin aşamalarını güçlü biçimde sıralar.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır. İlk üç dize düşünceyi ya da buyruğu kurarken son dize bunun insanlar üzerindeki etkisini bildirir. “Bizi” redifi ortak mağduriyet duygusu yaratır; “-ttular” ve “-diler” ekleri de ses tekrarını güçlendirir. Her bölümde biraz daha sertleşen sonuç fiilleri, şiire düzenli ve ilerleyen bir yapı kazandırır.
  gelenekVeSonuc: Öğüt kalıplarını tersinden sorgulaması, tekrarlarla ilerlemesi ve toplum adına konuşan “biz” sesi, şiiri âşık edebiyatının eleştirel damarına yaklaştırır. Eser, insanı koruma iddiasındaki korku kültürünün merhameti ortadan kaldırabileceğini gösterir. En belirgin başarısı, büyük bir toplumsal yabancılaşmayı selam vermek ve yetim başı okşamak gibi somut davranışlar üzerinden anlatmasıdır.
sira: 47
