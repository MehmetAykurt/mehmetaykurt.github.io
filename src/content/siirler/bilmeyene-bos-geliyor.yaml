baslik: Bilmeyene Boş Geliyor
aciklama: Mehmet Aykurt’un Bilmeyene Boş Geliyor adlı şiiri; sevgi, tabiat, saygı ve dünyanın faniliğini anlamayan kişinin yüzeysel bakışını işler.
tarih: "2027-01-31"
icerikTuru: Şiir
anaTema: Bilinçsizlik ve değerlerin anlamı
konu: Gülün dikeni, bülbülün fedakârlığı, mevsimlerin dönüşümü, saygı ve sevginin kaybı ile dünyanın geçiciliğinin anlayana ve bilmeyene farklı görünmesi
siirTuru: Didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gülü seven dikenine
  Katlanırmış düşün niye
  Hatır gönül var bu işte
  Bilmeyene boş geliyor

  Bülbülün sevdası güle
  Hatır için dikenine
  Katlanıyor batsa bile
  Bilmeyene düş geliyor

  Toprak baharda canlanır
  Yaz gelir yanar harlanır
  Kışın beyaza bulanır
  Bilmeyene kar geliyor

  Saygı sevgi bir hiç oldu
  Geldi insanlığın sonu
  Öldü mezarına kondu
  Bilmeyene yoz geliyor

  Şu dünyanın güzelliği
  Kapılır gider nicesi
  Kimseye değil ki baki
  Bilmeyene hoş geliyor
degerlendirme:
  genelBakis: “Bilmeyene Boş Geliyor”, sevgi, fedakârlık, tabiatın döngüsü, değer kaybı ve dünyanın faniliği üzerine düşünmeyen kişinin yüzeysel bakışını eleştirir. Gül için dikene katlanan bülbül, aşkın bedelini; mevsimler değişimin düzenini gösterir. Son bölümlerde saygı ve sevginin ölümü ile dünyanın geçiciliği karşı karşıya gelir. Bilmeyen, yozlaşmayı ve faniliği bile hoş görebilir.
  temaVeKonu: Ana tema bilinçsizlik ile değerlerin gerçek anlamı arasındaki ayrımdır. Şiirin konusu, gülün dikenine katlanmanın hatır ve gönül gerektirdiğini, tabiatın her mevsimde başka bir yüz gösterdiğini ve dünyanın kimseye kalmayacağını anlatmaktır. Bilgiden yoksun kişi bu işaretleri boş, düş, kar, yoz ya da hoş gibi eksik adlarla yorumlar. Şiir, görünene değil ardındaki manaya bakmayı ister.
  dilVeSoylevis: Dil yalın, sembolik ve öğütleyicidir. Gül, diken ve bülbül halk şiirinin geleneksel aşk üçlüsünü oluşturur. Toprak, bahar, yaz ve kış hayatın değişimini somutlaştırır. “Bilmeyene” sözü her dörtlüğün sonunda tekrarlanarak asıl eleştiri hedefini belirler. “Boş, düş, kar, yoz, hoş” kelimeleri kısa ses yakınlıkları kurarken anlamın bilgisiz bakışta nasıl daraldığını gösterir.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. Dörtlüklerin sonundaki “Bilmeyene ... geliyor” kalıbı değişken bir nakarat oluşturur. İlk iki bölüm aşkı, üçüncü bölüm tabiatı, dördüncü bölüm toplumsal değerleri, son bölüm dünyanın geçiciliğini işler. Bu yapı özel bir sevda hâlinden insanlığın ve dünyanın genel durumuna doğru genişler.
  gelenekVeSonuc: Gül-bülbül anlatısı, mevsim imgeleri, fanilik düşüncesi ve tekrarlar eseri âşık edebiyatının didaktik geleneğine bağlar. Şiir bilgi kavramını yalnız zihinsel öğrenme değil, hatır, gönül, saygı ve sevgiyle anlamlandırma yeteneği olarak ele alır. Sonuçta dünyanın güzelliğine kapılıp kalmak da yozlaşmayı normal görmek de aynı bilinç eksikliğinin ürünüdür; anlam, görünenin ardını düşünebilene açılır.
