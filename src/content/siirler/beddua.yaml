baslik: Beddua
aciklama: Mehmet Aykurt’un Beddua adlı şiiri; mazlumların ahını alan kişilere yöneltilen sert lanetleri, ilahi adalet inancıyla dile getirir.
tarih: "2026-12-20"
icerikTuru: Şiir
anaTema: Mazlumun ahı ve ilahi adalet
konu: Utanmaz ve zalim kişilerin ağır biçimde cezalandırılmasının dilenmesi, herkesin sonunda kendi ektiğini biçeceğinin söylenmesi
siirTuru: Beddua ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir dileğim vardır Yüce Mevla'dan
  Gözlerinden yaşlar dinmesin bir gün
  Utanmaz insandan korkmaz Allah'tan
  Taş kesilip öyle kalasın bir gün

  Havada karada yürürken yolda
  Kanların saçılsın ulu ortaya
  Koysan kabul etmez seni toprağa
  Sellere karışıp gidesin bir gün

  Gözlerin görmesin gücün yetmesin
  Dilerim Allah'tan yüzün gülmesin
  Hafızan kaybolup aklın ermesin
  Delice ortada dönesin bir gün

  Ahını alırsın onca mazlumun
  Belanı mutlaka bir gün bulursun
  Kırılsın kökünden kanadın kolun
  Kıpırdar halin kalmasın bir gün

  Dilin lal olsun kulağın sağır
  Can verirken kıvran hep çağır bağır
  Hayatın boyunca çekesin kahır
  Gün görecek halin kalmasın bir gün

  Der Mehmet'im alınma sen sözüme
  Paylaştırdım yeter birkaç kişiye
  Biz dururken kırılmayız kimseye
  Herkes ektiğini biçecek bir gün
degerlendirme:
  genelBakis: “Beddua”, mazlumların ahını alan kişilere karşı duyulan yoğun öfkeyi, bedensel ve ruhsal cezalar dileyen sert bir söyleyişle dışa vurur. Gözyaşından toprağın kabul etmemesine, aklın yitmesinden kolun kanadın kırılmasına uzanan dilekler aşama aşama ağırlaşır. Son dörtlükte hedefin tek kişi olmadığı belirtilir ve bütün beddualar “herkes ektiğini biçecek” adalet hükmünde toplanır.
  temaVeKonu: Ana tema mazlumun ahı ve ilahi adalettir. Şiirin konusu, utanmayan ve Allah’tan korkmayan zalimlerin dünyada ağır karşılıklarla yüzleşmesinin dilenmesidir. Her dörtlük yeni bir ceza alanı kurar; beden, akıl, toplum ve ölüm bu hesaplaşmaya dâhil olur. “Ahını alırsın onca mazlumun” dizesi öfkenin kişisel kapristen değil, haksızlığa uğrayanlar adına konuşma iddiasından doğduğunu gösterir.
  dilVeSoylevis: Dil son derece sert, doğrudan ve lanetleyicidir. “Dinmesin”, “kalasın”, “gidesin”, “gülmesin” ve “çekesin” fiilleri dilek kipini beddua işlevinde sürekli yineler. Taş kesilmek, toprağın kabul etmemesi ve kolun kanadın kırılması halk anlatılarındaki güçlü ceza imgelerini çağrıştırır. Son bölümdeki “alınma sen sözüme” sözü, ağır söyleyişin içine kara mizaha yaklaşan kısa bir mesafe koyar.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde ölçü farklılıkları görülür. İlk beş dörtlüğün sonunda yinelenen “bir gün” redifi, cezanın gecikse de geleceği düşüncesini pekiştirir. Son dörtlükte aynı ifade “biçecek bir gün” hükmüne bağlanır. Art arda sıralanan olumsuz dilekler ritmi yükseltir ve finalde genel bir adalet ilkesine ulaşır.
  gelenekVeSonuc: Beddua kalıpları, mazlumun ahı inancı, tapşırma ve ekme-biçme benzetmesi şiiri halk edebiyatının sözlü gelenekleriyle buluşturur. Taşlama yönü zalimin ahlaki kusurunu açıkça hedef alır. Eserin sonucu yalnız intikam isteği değildir; kötülüğün kendi karşılığını doğuracağı düşüncesidir. Böylece ağır lanetler, ilahi adaletin er ya da geç işleyeceğine duyulan inançla temellendirilir.
