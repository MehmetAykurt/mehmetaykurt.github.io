baslik: Ne Güzel Uymuş
aciklama: Mehmet Aykurt’un Ne Güzel Uymuş adlı şiiri; sevgilinin fiziksel güzelliğini hayranlıkla anlatan lirik bir halk şiiri güzellemesidir.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Güzellik ve aşk
konu: Sevgilinin fiziksel güzelliğinin hayranlık duygusuyla anlatılması
siirTuru: Lirik şiir ve güzelleme
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Kaşları yay gibi kömür karası
  Kirpiği gözüne ne güzel uymuş
  Gülünce güneşe benzer siması
  Gamzesi yanağa ne güzel uymuş

  Omzuna dökülür siyah saçları
  Kokusu andırır sanki baharı
  Şeker mi şerbet mi baldan da tatlı
  Dili dudağına ne güzel uymuş

  İncecik boyu sanırsın fidan
  Dünyada onmasın dalını kıran
  Özel mi yarattı seni nurundan
  Elifi kemale ne güzel uymuş
degerlendirme:
  genelBakis: “Ne Güzel Uymuş” adlı şiir, sevgilinin güzelliğini öven, hayranlık duygusu üzerine kurulmuş lirik bir şiirdir. Şiirde kaş, kirpik, göz, gamze, saç, dil, dudak ve boy gibi güzellik unsurları tek tek ele alınır. Genel hava, sevilen kişiye duyulan hayranlık ve onun yaratılışındaki uyuma duyulan şaşkınlık üzerine kuruludur.
  temaVeKonu: Şiirin ana teması güzellik ve aşktır. Konu, sevgilinin dış görünüşündeki ahenkli güzelliğin anlatılmasıdır. Kaşların yaya, saçların siyahlığa, kokunun bahara, boyun fidana benzetilmesi geleneksel güzellik anlayışını yansıtır. Şair, sevgilinin her bir özelliğini başka bir güzellik unsuru ile ilişkilendirerek onun kusursuzluğunu vurgular.
  dilVeSoylevis: Şiirin dili sade, anlaşılır ve halk söyleyişine yakındır. “Ne Güzel Uymuş” ifadesi, hem hayranlığı hem de şaşkınlığı içten bir biçimde dile getirir. Söyleyişte abartılı fakat samimi bir sevgi tonu vardır. “Şeker mi şerbet mi baldan da tatlı” dizesi, halk şiirindeki tatlılık ve güzellik anlatımına uygun bir söyleyiş taşır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle yazılmıştır. Her dörtlüğün sonunda tekrar edilen “ne güzel uymuş” ifadesi şiire güçlü bir ahenk kazandırır. “Karası / siması”, “saçları / baharı”, “fidan / kıran” gibi ses benzerlikleri şiirin uyak düzenini destekler. Mısralardaki düzenli akış, şiire türkü ve güzelleme havası verir.
  gelenekVeSonuc: Şiir, Türk halk şiirindeki güzelleme geleneğiyle güçlü bir bağ kurar. Sevgilinin kaşı, gözü, saçı, gamzesi ve boyu üzerinden anlatılması âşık edebiyatında sık görülen bir özelliktir. “Yay kaş”, “kömür karası”, “fidan boy” gibi imgeler geleneksel halk şiiri söyleyişini hatırlatır. Şiirin öne çıkan yönü, sevgilinin güzelliğini sade, ahenkli ve içten bir dille anlatmasıdır.
