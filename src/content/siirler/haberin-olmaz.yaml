baslik: Haberin Olmaz
aciklama: Mehmet Aykurt’un Haberin Olmaz adlı şiiri; sevdanın insanı fark ettirmeden esir alan yönünü halk şiiri geleneğine yakın lirik bir söyleyişle anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Sevda
konu: Sevdanın insanı fark ettirmeden esir alması, aklı ve duyguları kuşatması
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
siirMetni: |-
  Sevdanın tarifi sığmaz kaleme
  Ne cümleye girer ne de ölçüye
  Dolaşır bedende inceden ince
  Karışır kanına haberin olmaz

  Düşersin eline olursun esir
  Kalmaz kullanacak akılla fikir
  Sultanın kapısında bekleyen vezir
  Girersin emrine haberin olmaz

  Diken olur bazen yakar canını
  Bazı günler döker gözden yaşını
  Uyurum diyerek koyma başını
  Geceden gündüzden haberin olmaz

  Mutlu olan yok mu diye sorarsan
  Elbette vardır eğer ararsan
  Üçte biri belki araştırırsan
  Girersin ikiye haberin olmaz
degerlendirme:
  genelBakis: “Haberin Olmaz” adlı şiir, sevdanın insan üzerindeki güçlü ve fark ettirmeden ilerleyen etkisini anlatan içten bir lirik şiirdir. Şiirin genel havasında hem hayranlık hem de çaresizlik duygusu öne çıkar. Sevda, burada yalnızca güzel bir duygu olarak değil; insanın aklını, bedenini, gecesini ve gündüzünü ele geçiren kuvvetli bir hâl olarak işlenmiştir.
  temaVeKonu: Şiirin ana teması sevdadır. Konu ise sevdanın kişiyi farkına varmadan kuşatmasıdır. İlk dörtlükte sevdanın tarif edilemezliği vurgulanır. Sonraki dörtlüklerde sevdanın insanı esir etmesi, aklı devreden çıkarması, acı ve gözyaşı getirmesi anlatılır. Son dörtlükte ise sevdada mutluluğun da mümkün olduğu, ancak bunun herkese nasip olmadığı sezdirilir.
  dilVeSoylevis: Şiirin dili sade, anlaşılır ve halk söyleyişine yakındır. “Haberin Olmaz” tekrarının her dörtlüğün sonunda kullanılması, şiire öğüt verici ve konuşma havası taşıyan bir söyleyiş kazandırır. Şair, okura doğrudan seslenen bir tavır içindedir. Bu yönüyle şiir, samimi ve içten bir anlatıma sahiptir.
  ahenkVeYapi: Şiir dörtlükler hâlinde kurulmuştur ve 11’li hece ölçüsüyle yazılmıştır. Bu ölçü, Türk halk şiirinde sıkça kullanılan geleneksel bir yapıdır. “Haberin Olmaz” ifadesinin tekrar edilmesi şiire güçlü bir ahenk kazandırır. Özellikle ikinci dörtlükteki “esir / fikir / vezir” uyumu ve üçüncü dörtlükteki “canını / yaşını / başını” ses benzerliği şiirin ritmini destekler.
  gelenekVeSonuc: Şiir, biçim ve söyleyiş bakımından halk şiiri ve âşık edebiyatı geleneğiyle bağlantılıdır. Dörtlük yapısı, hece ölçüsü, sade dil ve sevda teması bu geleneği güçlendirir. Şiirin en belirgin yönü, sevdanın insanı yavaş yavaş içine alan etkisini yalın ama etkili bir söyleyişle anlatmasıdır. “Haberin Olmaz” tekrarı, şiirin hem anlam merkezini hem de ahenk gücünü oluşturur.
sira: 1
