baslik: Gördün mü
aciklama: Mehmet Aykurt’un Gördün mü adlı şiiri; tersine dönen dünyayı, toplumsal çelişkileri ve anlatıcının uydurmalarını mizahi taşlamayla işler.
tarih: "2026-10-24"
icerikTuru: Şiir
anaTema: Toplumsal çelişki ve mizah
konu: Dünyanın düzeninin tersine dönmesini gerçek dışı görüntülerle anlatıp toplumsal değişimi mizahi biçimde sorgulamak
siirTuru: Mizahi şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Bak sonunda dünya döndü tersine
  Armut yerde karpuz dalda gördün mü
  Cinsiyeti fark etmiyor kimseye
  Pantol kızda etek kimde gördün mü

  Omzuna dökülmüş uzun saçları
  Rengini sormayın ala bulalı
  Boncukluydu bak vallahi kaşları
  Dilinde de bir şey vardı gördün mü

  Kedi köpek kardeş olmuş sonunda
  Kurtla kuzu geziyordu yan yana
  Tavuk konmuş bir ağacın dalına
  Horoz bile uçuyordu gördün mü

  Ördek artık yüzmez olmuş derede
  Gece gündüz oturuyor kümeste
  Bir balığın su dışında işi ne
  Orda burda geziyordu gördün mü

  Duyulmasın sakın ola kimseye
  Güvenip de söylüyorum sizlere
  Hafta sonu bizim imam gizlice
  Tatil diye çekiyormuş gördün mü

  Der Mehmet'im daha fazla uydurma
  Gerçek gibi aklımızı bunaltma
  Tüm bunları ben yazmadım boşuna
  Kalem bile yanlış yazmış gördün mü
degerlendirme:
  genelBakis: “Gördün mü”, dünyanın tersine döndüğü düşüncesini gerçek dışı, şaşırtıcı ve gülünç görüntülerle anlatan mizahi bir taşlamadır. Armut ile karpuzdan kurt ile kuzuya, tavuk, horoz, ördek ve balığa kadar alışılmış düzen bozulur. Son dörtlükte anlatıcı kendi uydurmalarını açıkça kabul eder; böylece şiir, gerçeklik iddiasından çok toplumsal çelişkileri abartıyla düşündüren bir oyun kurar.
  temaVeKonu: Ana tema toplumsal çelişki ve mizahtır. Şiirin konusu, yerleşik düzenin tersine çevrilmesi yoluyla değişen davranış ve değerlerin sorgulanmasıdır. İlk dörtlüklerde insan görünüşleri ile hayvanların alışılmadık hareketleri yan yana getirilir. İmamla ilgili gizli söylenti, taşlamayı toplumsal role yöneltir. Son bölüm, bütün anlatılanları kalemin yanlışlığına bağlayarak hicvi kendine dönük bir mizahla kapatır.
  dilVeSoylevis: Dil konuşma havasında, abartılı ve dinleyiciyle sürekli ilişki kuran bir yapıdadır. “Gördün mü” sorusu her dörtlüğün sonunda muhatabı şaşkınlığa ortak eder. “Duyulmasın”, “güvenip söylüyorum” ve “vallahi” gibi sözler dedikodu anlatısını taklit ederek mizahı güçlendirir. Son dörtlükte “uydurma” ve “kalem bile yanlış yazmış” ifadeleri, anlatıcının güvenilmezliğini bilinçli bir gülme unsuruna dönüştürür.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 11’li hece ölçüsüyle düzenli biçimde kurulmuştur. Her dörtlüğün sonundaki “gördün mü” sözü nakarat ve redif görevi görür. “Tersine / kimseye”, “sonunda / yanında / dalına” ve “uydurma / bunaltma / boşuna” ses yakınlıkları ahengi destekler. Her dörtlük yeni bir terslik örneği sunar; son bölüm bu örnekleri açıklayan mizahi bir sonuç oluşturur.
  gelenekVeSonuc: Toplumdaki aksaklıkları abartı, tersine çevirme, hayvan benzetmeleri ve doğrudan hitapla eleştirmek halk şiirindeki taşlama geleneğine uygundur. Şairin “Der Mehmet’im” sözüyle kendisini anması da âşık söyleyişini sürdürür. Eserin öne çıkan yönü, eleştiriyi kesin hükümler yerine bilinçli uydurma ve saçmalıklar üzerinden kurması; okuru güldürürken düzenin gerçekten tersine dönüp dönmediğini düşündürmesidir.
