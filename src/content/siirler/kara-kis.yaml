baslik: Kara kış
aciklama: Mehmet Aykurt’un Kara kış adlı şiiri; köyü kuşatan yoğun karı, tipi ve gündelik hayatın güçleşmesini halk söyleyişiyle anlatır.
tarih: "2026-10-12"
icerikTuru: Şiir
anaTema: Kışın zorluğu ve köy hayatı
konu: Yoğun kar, sis, tipi ve boran yüzünden köyde ulaşımın ve günlük hayatın güçleşmesi
siirTuru: Pastoral ve mizahi şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir kar yağdı bizim köye
  Bazı yerler bir metre
  Mecal ister yürümeye
  Bu kış bir gün biter mi ola

  Dışarıya çıkılmıyor
  Soğuk nefesi kesiyor
  Sisten bir yer görülmüyor
  Bu kış bir gün biter mi ola

  Bir tipi bir boran
  Sandım ki kıyamet kopan
  Dedim gayri aman aman
  Bu kış bir gün biter mi ola

  Bir çığır açtım yürümeye
  Geri doldu ben dönmeye
  Böyle bir kar görülmeye
  Bu kış bir gün biter mi ola
degerlendirme:
  genelBakis: “Kara kış”, yoğun karın köy hayatını kuşatmasını, yürümeyi ve dışarı çıkmayı güçleştirmesini canlı bir halk söyleyişiyle anlatır. Bir metreyi bulan kar, nefes kesen soğuk, sis, tipi ve boran gündelik hayatı neredeyse durdurur. Açılan çığırın hemen dolması çaresizliği büyütürken sürekli yinelenen soru, şikâyetle birlikte ince bir mizah ve sabırsızlık duygusu taşır.
  temaVeKonu: Ana tema kışın zorluğu ve köy hayatıdır. Şiirin konusu, aşırı kar yağışı yüzünden ulaşımın kesilmesi ve insanın tabiat karşısında güçsüz kalmasıdır. İlk dörtlük karın büyüklüğünü, ikinci bölüm soğuk ve sisi, üçüncü dörtlük tipi ile boranın korkutucu etkisini anlatır. Son bölümde yol açma çabasının boşa çıkması, kışın ne zaman biteceğine ilişkin çaresiz soruyu haklılaştırır.
  dilVeSoylevis: Dil yalın, yerel ve konuşma havasındadır. “Bizim köye”, “mecal ister”, “gayri” ve “aman aman” ifadeleri yaşanan olayı doğrudan anlatan bir köy sakininin sesini duyurur. Tipinin kıyamete benzetilmesi zorluğu büyütürken abartıya dayalı mizahi bir etki de oluşturur. “Biter mi ola” sözü kesin bir yakınmadan çok, sabırla karışık halk ağzı sorusu niteliğindedir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; dizeler ile nakarat arasında hece farklılıkları görülür. Her dörtlüğün sonunda tekrarlanan “Bu kış bir gün biter mi ola” dizesi güçlü bir nakarat oluşturur. “Çıkılmıyor / kesiyor / görülmüyor” ve “yürümeye / dönmeye / görülmeye” ses birlikleri ahengi destekler. Tekrar şiire türkü havası verir.
  gelenekVeSonuc: Kar, tipi, boran, kapanan yol ve tabiatla mücadele, Anadolu köy yaşamını konu alan halk şiirinin belirgin unsurlarıdır. Şiir büyük bir felaket söylemi kurmak yerine yaşanan güçlüğü gündelik dil ve hafif mizahla aktarır. Eserin öne çıkan yönü, kışın ağırlığını kolay hatırlanan bir nakarat çevresinde toplaması ve köy insanının tabiat karşısındaki çaresizliğini samimi biçimde duyurmasıdır.
