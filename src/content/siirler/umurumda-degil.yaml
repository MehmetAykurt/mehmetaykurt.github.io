baslik: Umurumda Değil
aciklama: Mehmet Aykurt’un Umurumda değil adlı şiiri; yalnızlık, tükenmişlik ve dünyaya karşı kayıtsızlaşmayı karanlık imgelerle anlatır.
tarih: "2026-09-27"
icerikTuru: Şiir
anaTema: Yalnızlık, tükenmişlik ve kayıtsızlık
konu: Karanlık ve yalnızlık içinde kalan kişinin zamana, yanmaya ve dünya zevklerine karşı ilgisini yitirmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Battı güneş çöktü karanlık
  Ne ay umurumda ne yıldız umurumda
  Geriye kalan koca yalnızlık
  Ne dün umurumda ne yarın umurumda

  Bir sigara bir de çakmak
  Öyle ağır ağır yanmak
  Dumanında kayıp olmak
  Ne kor umurumda ne kül umurumda

  Sarhoşluk var üzerimde
  Gerek duymam hiç içmeye
  Divanelik var ya serde
  Ne bal umurumda ne mey umurumda
degerlendirme:
  genelBakis: “Umurumda değil”, güneşin batışıyla başlayan karanlığı insanın iç dünyasındaki yalnızlık, tükenmişlik ve kayıtsızlıkla birleştirir. Geçmiş ile gelecek, ay ile yıldız, kor ile kül ve bal ile mey anlatıcı için anlamını yitirir. Sigara dumanında kaybolma ve içmeden sarhoş olma hâlleri, dünyayla bağları zayıflayan kişinin ağır ve divane ruh durumunu görünür kılar.
  temaVeKonu: Ana tema yalnızlık, tükenmişlik ve kayıtsızlıktır. Şiirin konusu, karanlıkta yalnız kalan kişinin zamanın iki yönüne, yanmanın sonucuna ve hayatın tatlarına karşı ilgisini yitirmesidir. İlk dörtlükte dünya ve zaman, ikinci bölümde yanış ve yok oluş, son dörtlükte sarhoşluk ile divanelik öne çıkar. Tekrarlanan umursamazlık, aslında derin bir kırgınlığın savunma biçimi olarak belirir.
  dilVeSoylevis: Dil kısa, doğrudan ve tekrarların etkisine dayalıdır. “Umurumda” sözcüğünün ikili kullanımı, her dörtlükte yeni bir değer alanının reddedildiğini gösterir. Ay-yıldız, dün-yarın, kor-kül ve bal-mey karşıtlıkları hayatın bütününü kapsayan bir kayıtsızlık kurar. Sigara, çakmak ve duman gibi gündelik imgeler, soyut tükenmişlik duygusunu somut ve karanlık bir sahneye taşır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; uzun nakarat dizeleriyle farklı hece sayıları oluşur. “Umurumda” tekrarı belirgin bir nakarat ve redif etkisi yaratır. “Çakmak / yanmak / olmak” uyakları ikinci dörtlüğün akışını güçlendirirken “üzerimde / içmeye / serde” ses yakınlıkları son bölümde ritmi sürdürür. Yapı, karanlıktan divaneliğe ilerler.
  gelenekVeSonuc: Divanelik, yanmak, kor, kül, bal ve mey sözleri halk şiirinin sevda ve dünya algısıyla bağlantılıdır. Şiir bu geleneksel unsurları sigara ve duman gibi gündelik görüntülerle yan yana getirerek içe kapanmış çağdaş bir yalnızlık kurar. Eserin gücü, “umurumda değil” sözüyle dışarıya kayıtsızlık gösterirken alt katmanda büyük bir kırgınlık ve tükeniş duygusunu sezdirme biçimindedir.
