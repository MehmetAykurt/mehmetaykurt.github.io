baslik: Yanar Gibiyim
aciklama: Mehmet Aykurt’un Yanar gibiyim adlı şiiri; sevgilinin varlığında bile dinmeyen özlemi Kerem ile Mecnun çağrışımlarıyla anlatır.
tarih: "2026-09-15"
icerikTuru: Şiir
anaTema: Tutkulu sevda ve özlem
konu: Sevgili yanındayken bile ayrılıktan korkan âşığın hayale esir olup benliğini kaybetmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Özledim sevdiğim sendeyken seni
  Bir anlık ayrılık öldürür beni
  Öyle bir sevda ki Kerem misali
  Varlığında bile yanar gibiyim

  Bir an bile elin gitse elimden
  Hasretliğin dem vuruyor içimden
  Korkar oldum ben de benim halimden
  Çöllere düşmüş Mecnun gibiyim

  Tamamen hayale olmuşum esir
  Deme ki bu kadar olur mu tesir
  Ne akıl var bende ne de bir fikir
  Kaybetmiş kendini deli gibiyim
degerlendirme:
  genelBakis: “Yanar gibiyim”, sevgili yanındayken bile dinmeyen özlemi ve ayrılık korkusunu yoğun bir sevda hâli içinde anlatır. Âşık, bir anlık uzaklığı ölümle eş tutar; sevgilinin eli elinden ayrıldığında hasretin sesini içinde duyar. Hayale esir oldukça akıl ve fikirden uzaklaşır, kendi benliğini yitirir. Şiire tutku, kaygı ve deliliğe yaklaşan bir teslimiyet hâkimdir.
  temaVeKonu: Ana tema tutkulu sevda ve özlemdir. Şiirin konusu, kavuşmanın âşığı rahatlatmaması, aksine ayrılık ihtimalini daha korkutucu hâle getirmesidir. İlk dörtlükte sevgilinin varlığında yanma, ikinci dörtlükte elini kaybetme korkusu işlenir. Son bölümde sevdanın tesiri aklı ortadan kaldırır ve âşığı hayalin esiri yapar. Böylece sevgi, benliği kuşatan sürekli bir hâle dönüşür.
  dilVeSoylevis: Dil sade, doğrudan ve yüksek duygulu bir söyleyiş taşır. “Sendeyken seni özlemek” ve “varlığında yanmak” ifadeleri şiirin temel karşıtlığını kurar. Kerem ile Mecnun adları, âşığın kendi hâlini bilinen sevda kahramanlarıyla ölçmesini sağlar. “Gibiyim” tekrarları anlatıcının kendisini yanan, çöle düşen ve benliğini kaybeden âşıklarla özdeşleştirmesini güçlendirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. Dörtlük sonlarında yinelenen “gibiyim” sözü redif niteliği taşır. “Seni / beni / misali”, “elimden / içimden / halimden” ve “esir / tesir / fikir” ses birlikleri belirgin bir ahenk kurar. Her dörtlükte artan duygusal yoğunluk, özlemden korkuya ve oradan benlik kaybına doğru ilerler.
  gelenekVeSonuc: Kerem ile Mecnun’un anılması, aşk uğruna yanma, çöle düşme ve aklını yitirme düşünceleri halk anlatıları ile âşık edebiyatının sevda anlayışına dayanır. Şiir bu geleneksel örnekleri kişisel ayrılık korkusuyla birleştirir. Eserin öne çıkan yönü, sevgilinin varlığını bile özlemi sona erdirmeyen bir hâl olarak sunması ve aşkı kavuşmayla dinmeyen derin bir tutku biçiminde işlemesidir.
