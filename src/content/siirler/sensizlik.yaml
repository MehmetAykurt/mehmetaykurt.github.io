baslik: Sensizlik
aciklama: Mehmet Aykurt’un Sensizlik adlı şiiri; sevgilinin yokluğunun zamanı, yönleri ve mevsimleri kuşatan etkisini lirik bir dille anlatır.
tarih: "2026-08-25"
icerikTuru: Şiir
anaTema: Yokluk ve ayrılık
konu: Sevgilinin yokluğunun âşığın zaman algısını, günlük hayatını ve bütün mevsimlerini kuşatması
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ne yanımı dönsem hiç fark etmiyor
  Sağımda sensizlik solumda sensizlik
  Dünya dönüyor ya zaman geçmiyor
  Dakikam sensizlik saat sensizlik

  Bakıyorum güneş yeni doğmakta
  İnsanlar diyor ki akşam olmakta
  Kapanmış gözler dalmış uykuya
  Gecem sensizlik günüm sensizlik

  Bahar yeli ılık ılık eserken
  Tohumlar canlanıp çiçek verirken
  Sevenler el ele sefa sürerken
  Yazım sensizlik kışım sensizlik
degerlendirme:
  genelBakis: “Sensizlik”, sevgilinin yokluğunu yalnız bir ayrılık hâli olarak değil, âşığın bütün yönlerini, zamanını ve mevsimlerini kuşatan bir varoluş biçimi olarak anlatır. Dünya dönse de zaman ilerlemez; güneş doğsa da günün vakti anlamını yitirir. Baharın canlılığı ve başkalarının mutluluğu karşısında bile değişmeyen sensizlik, şiirin ağır ve sürekli duygusunu oluşturur.
  temaVeKonu: Ana tema yokluk ve ayrılıktır. Şiirin konusu, sevgilinin bulunmayışının âşığın çevre ve zaman algısını bütünüyle değiştirmesidir. Sağ ile sol, dakika ile saat, gece ile gündüz ve yaz ile kış karşıtlıkları sensizlikte eşitlenir. Dış dünya hareketli, canlı ve mutluyken âşığın iç dünyası aynı noktada kalır. Böylece yokluk, bütün zamanlara yayılan kesintisiz bir hâle dönüşür.
  dilVeSoylevis: Dil sade ve tekrarların gücüne dayalıdır. “Sensizlik” sözcüğü her dörtlüğün sonunda iki kez kullanılarak yokluğun kaçınılmazlığını duyurur. Sağ-sol, dakika-saat, gece-gündüz ve yaz-kış ikilikleri, hayatın bütün alanlarını kapsayan dengeli bir söyleyiş kurar. “Dünya dönüyor ya zaman geçmiyor” dizesindeki karşıtlık, öznel zamanın duruşunu yalın ve etkili biçimde anlatır.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. “Sensizlik” tekrarları belirgin bir redif ve nakarat etkisi oluşturur. “Etmiyor / geçmiyor”, “doğmakta / olmakta” ve “eserken / verirken / sürerken” ses birlikleri dörtlük içindeki akışı güçlendirir. Karşıt kavramların ikili düzeni, şiirin hem anlam hem ritim bakımından temel yapısını oluşturur.
  gelenekVeSonuc: Ayrılık, zamanın geçmemesi, baharın sevince dönüşememesi ve mevsimlerin anlamını yitirmesi halk şiirindeki hasret duygusuyla bağlantılıdır. Şiir geleneksel dörtlük yapısını çağdaş ve yalın bir “sensizlik” kavramı çevresinde kurar. Eserin öne çıkan yönü, sevgilinin yokluğunu tek bir ana değil, yönlerden mevsimlere kadar hayatın tamamına yayılan kuşatıcı bir duygu olarak vermesidir.
