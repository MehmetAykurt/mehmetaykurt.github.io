baslik: Bilmez gönül
aciklama: Mehmet Aykurt’un Bilmez gönül adlı şiiri; coşkun ve söz dinlemez gönlün mevsim, acı, mantık ve otorite tanımayan yapısını anlatır.
tarih: "2027-01-04"
icerikTuru: Şiir
anaTema: Gönlün özgür ve ölçüsüz doğası
konu: Deli gönlün durgunluğu, sonbaharı, acıyı, mantığı, öğüdü ve padişah fermanını tanımadan kendi coşkusuyla hareket etmesi
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ceyhan suyu gibi çağlar
  Gölü bilmez deli gönül
  Baharda yeşerir bağlar
  Güzü bilmez deli gönül

  Çiçekler rengarenk açar
  Dört bir yana koku saçar
  Bülbül gibi kanat çırpar
  Duru bilmez deli gönül

  Diken batsa yanar canı
  Zevke sayar sızısını
  Bulsa bile belasını
  Hayra sayar deli gönül

  Akıl ermez işlerine
  Kelam uymaz dillerine
  Kar eylemez öğüt bile
  Mantık bilmez deli gönül

  Varsın ersin yaş kemale
  İstersen vur zincirlere
  Padişahta mühürlese
  Ferman bilmez deli gönül
degerlendirme:
  genelBakis: “Bilmez gönül”, gönlü Ceyhan suyu gibi coşkun, bahar gibi canlı ve hiçbir sınıra boyun eğmeyen bir varlık olarak kişileştirir. Gölün durgunluğunu, güzün sonunu, dikenin acısını, mantığı ve fermanı tanımayan gönül kendi anlamını kurar. Şiir bu ölçüsüzlüğü yalnız eleştirmez; acıyı zevk, belayı hayır sayabilen gönlün dönüştürücü ve bağımsız gücüne de hayranlık duyar.
  temaVeKonu: Ana tema gönlün özgür ve ölçüsüz doğasıdır. Şiirin konusu, coşkun gönlün durmayı, solmayı, acıdan kaçmayı ve aklın öğüdüne uymayı bilmemesidir. Yaş kemale erse, zincire vurulsa ve padişah fermanıyla mühürlense bile gönül üzerindeki denetim başarısız kalır. Böylece duygunun zaman, deneyim, mantık ve otoriteden daha dirençli olduğu düşüncesi işlenir.
  dilVeSoylevis: Dil canlı, benzetmeli ve gönülle konuşan halk şiiri söyleyişindedir. Ceyhan suyu hareketi, bağ ve çiçekler baharı, bülbül ise aşk coşkusunu taşır. “Bilmez” fiilinin her dörtlükte yinelenmesi bilgisizlikten çok kural tanımazlık anlamı kazanır. “Deli gönül” hitabı hem eleştiri hem sevgi içerir; dikenin sızısını zevk, belayı hayır saymak gönlün alışılmış değerleri tersine çevirdiğini gösterir.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. Dörtlüklerin ikinci ve dördüncü dizelerinde tekrarlanan “bilmez deli gönül” kalıbı güçlü bir nakarat oluşturur. “Çağlar/bağlar”, “açar/saçar” sesleri tabiat bölümlerini canlandırır. Yapı, sudan ve mevsimden acıya, mantığa ve devlet otoritesine doğru genişleyerek gönlün aşamadığı sınır bulunmadığını gösterir.
  gelenekVeSonuc: Gönlün kişileştirilmesi, bülbül ve bahar imgeleri, tekrarlar ve ölçülü söyleyiş eseri âşık edebiyatı geleneğine bağlar. Padişahın mührü ile gönlün özgürlüğünü karşılaştırmak, duyguyu dünyevi otoritenin üstüne çıkarır. Şiirin ulaştığı sonuç, gönlün akıl ve öğütle bütünüyle yönetilemeyeceğidir; onun deliliği aynı zamanda canlılığının ve aşka açık kalmasının kaynağıdır.
