baslik: Gönül öyle bir şeydir ki
aciklama: Mehmet Aykurt’un Gönül öyle bir şeydir ki adlı şiiri; gönlün akla sığmayan, yalnız sevmeye yönelen özgür tabiatını anlatır.
tarih: "2026-09-03"
icerikTuru: Şiir
anaTema: Gönlün akıl dışı ve özgür tabiatı
konu: Gönlün görme, duyma ve bilme şartlarına aldırmadan sevmesi ve kendi yolunda ilerlemesi
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gönül öyle bir şeydir ki
  Görse de hoş görmese de hoş
  O sesini nefesini
  Duysa da hoş duymasa da hoş

  Mantığını hiç zorlama
  Nasıl diye sorgulama
  Dönüp bakmaz sonrasına
  Bilse de hoş bilmese de hoş

  Onun işi yalnız sevmek
  Gerisini inkâr etmek
  Akıntıya kürek çekmek
  Gitse de hoş gitmese de hoş
degerlendirme:
  genelBakis: “Gönül öyle bir şeydir ki”, gönlün akıl, şart ve sonuç hesabına sığmayan tabiatını sade ve düşünceli bir söyleyişle anlatır. Görmek, duymak, bilmek ya da yolun nereye varacağını kestirmek gönül için belirleyici değildir. Onun tek işi sevmektir; bu nedenle akıntıya karşı kürek çekmeyi bile göze alır. Şiirin havasında kabullenişle karışık ince bir öğüt vardır.
  temaVeKonu: Ana tema gönlün akıl dışı ve özgür tabiatıdır. Şiirin konusu, gönlün duyuların ve mantığın verdiği sonuçlara bağlı kalmadan sevmesidir. İlk dörtlükte görmek ve duymak, ikinci dörtlükte bilmek ve sorgulamak karşı karşıya getirilir. Son bölümde gönlün gerçeği inkâr pahasına yalnız sevmeye yönelmesi, akıntıya kürek çekme deyimiyle somutlaştırılır.
  dilVeSoylevis: Dil günlük konuşmaya yakın, yalın ve özlüdür. “Hoş” sözcüğünün tekrarı, gönlün olumlu ile olumsuz arasında ayrım yapmadan her hâli kabullenişini duyurur. “Mantığını hiç zorlama”, “sorgulama” ve “akıntıya kürek çekmek” ifadeleri öğüt veren bir ses oluşturur. Karşıt fiillerin “görse/görmese, duysa/duymasa” biçiminde kullanılması düşünceyi belirginleştirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; nakarat niteliğindeki dizelerde hece farklılığı görülür. “Hoş” sözcüğü dörtlüklerin ikinci ve dördüncü dizelerinde tekrar edilerek güçlü bir ritim kurar. “Zorlama / sorgulama / sonrasına” ve “sevmek / etmek / çekmek” ses birlikleri ahengi destekler. Tekrar ve karşıtlıklar yapının temelini oluşturur.
  gelenekVeSonuc: Gönlü akıldan bağımsız, söz dinlemez ve yalnız sevmeye yönelen bir varlık gibi ele almak halk şiirinin köklü yaklaşımlarındandır. Şiir, bu geleneği ağır mecazlara başvurmadan günlük dil ve deyimlerle sürdürür. Gönlün gördüğüne, duyduğuna ve bildiğine rağmen kendi yoluna gitmesi, sevdanın mantıkla açıklanamayacağı düşüncesini açık ve akılda kalıcı bir sonuca ulaştırır.
