baslik: Baharda Sarardı Yeşil Yaprağım
aciklama: Mehmet Aykurt’un Baharda sarardı yeşil yaprağım adlı şiiri; erken tükenişi, umutsuzluğu ve kadere teslimiyeti anlatır.
tarih: "2026-09-30"
icerikTuru: Şiir
anaTema: Erken tükeniş, umutsuzluk ve teslimiyet
konu: Hayatının baharında solan insanın benliğini ve umudunu yitirmesi, yaklaşan sona kader karşısında razı olması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Baharda sarardı yeşil yaprağım
  Güz ayında kalmış dallar gibiyim
  Kurudu bedenim çekildi kanım
  Toprağa karışmış canlar gibiyim

  Soldu gülüşlerim sustu çığlığım
  Ne yokluğum belli ne de varlığım
  Savrulmuş düşlerim yitik bir çağım
  Zamanı geçmiş devran gibiyim

  Kalmadı yarınım bitti umudum
  Bilirim yaklaştı geliyor sonum
  Aradım taradım ben bende yokum
  Aklını kaybetmiş kullar gibiyim

  Ne olursa olsun boynumuz eğri
  Hakk’ın dediğine razıyız yani
  Olur ya duyarsan şaşırma emi
  Ağır ağır kendimden geçer gibiyim
degerlendirme:
  genelBakis: “Baharda sarardı yeşil yaprağım”, hayatın baharında başlayan erken tükenişi, benlik kaybını ve yaklaşan sona teslimiyeti anlatan içli bir şiirdir. Sararan yaprak ve kuruyan bedenle başlayan çözülme; solan gülüş, susan çığlık ve savrulan düşlerle derinleşir. Son dörtlükte anlatıcı, Hakk’ın hükmüne razı olarak kendinden ağır ağır geçişini sükûnetli bir kabullenişle karşılar.
  temaVeKonu: Ana tema erken tükeniş, umutsuzluk ve teslimiyettir. Şiirin konusu, mevsimi gelmeden solan insanın bedeniyle birlikte neşesini, düşlerini, yarınını ve benliğini kaybetmesidir. İlk üç dörtlükte yok oluş giderek ağırlaşır ve kişi kendisini kendi içinde bulamaz. Son bölüm, çaresizliği inançla karşılar; boyun eğmek, edilgenlikten çok kader hükmüne razı olma anlamı kazanır.
  dilVeSoylevis: Dil sade fakat ölüm ve tükeniş çağrışımı güçlü imgelerle örülüdür. Bahar-güz karşıtlığı erken yaşlanmayı; sararan yaprak, kuruyan beden ve toprağa karışan can ölüm düşüncesini somutlaştırır. “Ben bende yokum” sözü benlik kaybını özlü biçimde anlatır. “Şaşırma emi” ifadesi ağır konuya gündelik ve içten bir ses katarken anlatıcı ile muhatap arasındaki yakınlığı korur.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. Dörtlük sonlarında yinelenen “gibiyim” sözü redif niteliği taşır. “Yaprağım / kanım”, “çığlığım / varlığım / çağım” ve “umudum / sonum / yokum” ses birlikleri şiirin ağıt tonunu güçlendirir. Yapı bedensel çözülmeden ruhsal yokluğa, oradan inançlı kabullenişe doğru ilerler.
  gelenekVeSonuc: İnsanın ömrünü mevsimlere ve yaprağın sararmasına benzetmek, dünya hayatının geçiciliği ile Hakk’ın hükmüne razı olmayı birlikte düşünmek halk şiirinin köklü fanilik anlayışına dayanır. Şiir bu geleneği kişisel benlik kaybıyla birleştirir. Eserin öne çıkan yönü, ağır tükenişi yalnız karamsarlıkta bırakmayıp son dörtlükte teslimiyet ve sükûnet duygusuna ulaştırmasıdır.
sira: 32
