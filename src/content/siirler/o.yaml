baslik: O
aciklama: Mehmet Aykurt’un O adlı şiiri; Allah’ın gönülden geçen duayı bildiğini, rızkı veren ve alanın O olduğunu anlatır.
tarih: "2027-03-23"
icerikTuru: Şiir
anaTema: Allah’a güven ve teslimiyet
konu: Duanın söz ve el hareketi olmadan gönülden yapılabilmesi, insana muhtaç olmadan Mevla’ya yönelme ve rızkı Allah’tan bilme
siirTuru: Dinî ve tasavvufi şiir
gelenek: Tasavvuf şiiri ve halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Dua etmek için gerek yok dile
  Ne istersen iste gönülden iste
  Ellerini kaldırıp açmasan bile
  Duyan da o bilen de o

  İhtiyaç mı duyarsın insanoğluna
  Yönelmişken bir de ulu Mevla'ya
  Dön de bir bak şöyle etrafına
  Yitiren de o bitiren de o

  Öpülecek eller toprak altında
  Arayıp durma boşu boşuna
  Garibin halini bırak Allah'a
  Yediren de o içiren de o
degerlendirme:
  genelBakis: “O”, Allah’ın insanın gönlünden geçen isteği söz söylenmeden ve eller açılmadan da bildiğini anlatan teslimiyet şiiridir. Söyleyici insanoğluna muhtaç olma düşüncesini sorgular ve yönelişi ulu Mevla’ya çevirir. Öpülecek ellerin toprak altında oluşu dünyevi dayanakların geçiciliğini belirtir. Son bölümde yediren ve içiren olarak Allah’ın anılması, garibin hâlini bütünüyle O’na bırakır.
  temaVeKonu: Ana tema Allah’a güven ve teslimiyettir. Şiirin konusu, duanın yalnız dil ve beden hareketiyle sınırlı olmadığı, asıl isteğin gönülden doğduğu düşüncesidir. İnsanlardan yardım beklemek yerine her şeyi duyan ve bilen Mevla’ya yönelmek öğütlenir. Kaybetme, bitirme, yedirme ve içirme fiillerinin aynı kaynağa bağlanması, hayatın eksilme ve çoğalma hâllerinin ilahi irade içinde görüldüğünü gösterir.
  dilVeSoylevis: Dil sade, sakin ve kesin bir inanç tonundadır. Başlıktaki tek kelimelik “O”, her dörtlüğün sonunda yinelenerek Allah’ı doğrudan adlandırmadan işaret eder. “Duyan da O, bilen de O” gibi paralel yapılar ilahi nitelikleri ritmik biçimde sıralar. Dil, gönül, el ve çevre gibi somut unsurlar dua deneyimini gündelik hayata yaklaştırır. “Boşu boşuna” sözü insan arayışının sonuçsuzluğunu vurgular.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; kısa nakarat dizelerinde ölçü farklılıkları vardır. Her bölümün sonundaki ikili fiil ve “O” tekrarı güçlü bir redif kurar. İlk bölüm dua, ikinci bölüm ihtiyaç ve kudret, üçüncü bölüm fanilik ile rızık üzerinde durur. Yapı insanın içinden çevresine, oradan toprağa ve ilahi bakıma doğru genişler.
  gelenekVeSonuc: Gönülden dua, Mevla’ya yönelme, fanilik ve rızkı Allah’tan bilme düşünceleri tasavvufi halk şiiri geleneğine dayanır. Şiirin dili karmaşık açıklamalardan kaçınarak tevhid düşüncesini tekrarla duyurur. Eserin sonucu, insanın gerçek dayanağının geçici kişiler değil her şeyi duyan, bilen, veren ve alan Allah olduğudur; dua için en temel şart içten bir gönüldür.
