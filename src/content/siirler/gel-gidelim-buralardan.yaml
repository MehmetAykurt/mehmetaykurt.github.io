baslik: Gel Gidelim Buralardan
aciklama: Mehmet Aykurt’un Gel gidelim buralardan adlı şiiri; zulüm ve değersizlik karşısında sevilen kişiyi birlikte uzaklaşmaya çağırır.
tarih: "2026-12-17"
icerikTuru: Şiir
anaTema: Zulümden kaçış ve dayanışma
konu: Çektiği acılar karşısında boynu bükülen bir insana el uzatılması, zalimin elinden ve dilinden kurtulmak için gizlice yola çıkma çağrısı
siirTuru: Lirik şiir
gelenek: Halk şiiri ve türkü geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Uzat bana ellerini
  Gel gidelim buralardan
  Çektiklerin yetmedi mi
  Gel gidelim buralardan

  Boyun büküp durma öyle
  Hele bir bak şu haline
  Kurban olam bir şey söyle
  Gel gidelim buralardan

  Bir an önce düşsek yola
  Dönüp bakma hiç ardına
  Fırsat vermeden zamana
  Gel gidelim buralardan

  Neyin var ki düşünecek
  Kimin var ki iz sürecek
  Kalsan kıymet mi bilecek
  Gel gidelim buralardan

  Kurtul zalimin zulmünden
  Hem dilinden hem elinden
  Seher vakti kalk gizliden
  Gel gidelim buralardan
degerlendirme:
  genelBakis: “Gel gidelim buralardan”, acı çeken ve değeri bilinmeyen bir insana uzatılan dayanışma elini anlatan lirik bir kaçış şiiridir. Söyleyici muhatabını yalnız bırakmaz; birlikte yola çıkmayı, arkaya bakmamayı ve zaman daha fazla zarar vermeden uzaklaşmayı önerir. Son dörtlükte kaçışın nedeni açıkça zalimin eli ve dili olarak belirtilir, çağrı bir kurtuluş teklifine dönüşür.
  temaVeKonu: Ana tema zulümden kaçış ve dayanışmadır. Şiirin konusu, çektiği acılar yüzünden boynu bükülen kişinin bulunduğu yerde kıymet görmeyeceğinin anlaşılması ve seher vakti gizlice ayrılmaya çağrılmasıdır. “Uzat bana ellerini” sözü yalnız kaçışı değil, güven veren bir ortaklığı başlatır. Geçmişe dönmemek ve zamana fırsat vermemek, yeni başlangıcın şartları olarak sunulur.
  dilVeSoylevis: Dil yalın, şefkatli ve ısrarlı bir çağrı tonundadır. “Kurban olam” sözü muhataba duyulan yakınlığı ve onun konuşmasını bekleyen içtenliği gösterir. Soru cümleleri, kişinin kaldığı yerde neyi ve kimi kaybedeceğini düşünmesini sağlar. “Zalimin zulmü”, “eli” ve “dili” ifadeleri baskının hem davranışla hem sözle kurulduğunu belirtir. Nakarat, her öneriyi ortak bir karara bağlar.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. Her dörtlüğün ikinci ya da dördüncü dizesinde tekrarlanan “Gel gidelim buralardan” güçlü bir türkü nakaratı oluşturur. İlk bölüm el uzatır, ikinci bölüm teselli eder, üçüncü bölüm yolu, dördüncü bölüm geride kalanı, son bölüm ise kaçışın sebebini açıklar. Bu sıra çağrıyı giderek somutlaştırır.
  gelenekVeSonuc: Tekrarlanan bağlantı dizesi, yalın hitaplar ve seher vakti imgesi şiiri halk türküsü geleneğine yaklaştırır. Sevilen kişiyi zulümden çekip çıkarma arzusu, bireysel sevgiyi ahlaki bir dayanışma davranışına dönüştürür. Eserin en güçlü yönü, kaçışı korkaklık gibi değil, değersizlik ve baskı karşısında el ele verilerek alınan onurlu bir kurtuluş kararı olarak sunmasıdır.
