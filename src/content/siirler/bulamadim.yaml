baslik: Bulamadım
aciklama: Mehmet Aykurt’un Bulamadım adlı şiiri; dünyanın hâllerini yazacak söz, kâmil insan ve seheri karşılayan temiz bir yel arayışını anlatır.
tarih: "2027-02-15"
icerikTuru: Şiir
anaTema: Hakikat ve kâmil insan arayışı
konu: Dünyanın karmaşasını anlatacak sözün ve danışılacak olgun insanın bulunamaması, görünüşte serin ve hoş olan şeylerin faydasızlığının fark edilmesi
siirTuru: Düşünsel ve lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Düşündüm dünyanın bin bir halini
  Kâğıda yazacak söz bulamadım
  Sorayım dedim ya birine bari
  İnsanı kâmil kul bulamadım

  Söğüdün gölgesi serindir ama
  Dalının faydası olmaz insana
  Her esen rüzgârı meltemdir sanma
  Seheri karşılar yel bulamadım
degerlendirme:
  genelBakis: “Bulamadım”, dünyanın türlü hâllerini anlamlandırma ve bunu paylaşacak olgun bir insan bulma çabasını iki dörtlükte yoğunlaştırır. İlk bölümde söz ile insan, ikinci bölümde gölge, dal ve rüzgâr sınanır. Söğüdün serin gölgesi geçici rahatlık sağlasa da dalı faydasızdır; her esinti de meltem değildir. Şiir, görünüşte hoş olanla gerçekten yol gösteren arasındaki farkı arar.
  temaVeKonu: Ana tema hakikat ve kâmil insan arayışıdır. Şiirin konusu, dünyanın karmaşasını yazıya dökecek sözün ve soruya cevap verecek olgun kişinin bulunamamasıdır. İkinci bölüm bu manevi arayışı tabiat üzerinden sürdürür. Serinlik faydaya, esinti melteme eşit değildir. Seheri karşılayacak yelin bulunamaması, karanlıktan aydınlığa geçişte ihtiyaç duyulan temiz ve yön verici nefesin eksikliğini gösterir.
  dilVeSoylevis: Dil sade, düşünceli ve sembolik bir yapıdadır. “Bin bir hâl” dünyanın çeşitliliğini ve karmaşasını, “insanı kâmil” tasavvufi olgunluk idealini taşır. Söğüt, gölge, dal, rüzgâr, meltem, seher ve yel sözcükleri doğa gözlemini manevi arayışa dönüştürür. “Bulamadım” tekrarı yalnız yokluğu değil, süren bir aramanın yorgunluğunu da duyurur. “Sanma” buyruğu okuru görünüşe aldanmamaya çağırır.
  ahenkVeYapi: Şiir iki dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır. Her dörtlüğün ikinci ve dördüncü dizelerinde yinelenen “bulamadım” sözü redif görevi görür. İlk dörtlük soyut düşünce ve insan arayışını, ikinci dörtlük tabiat benzetmesini işler. “Ama/insana/sanma” ses yakınlıkları ikinci bölümde ahengi destekler; kısa yapı yokluk duygusunu yoğunlaştırır.
  gelenekVeSonuc: İnsanı kâmil kavramı tasavvufi düşünceyi, seher ve yel imgeleri halk şiirinin manevi tabiat dilini yansıtır. Özlü öğüt ve tekrar da geleneksel söyleyişe uygundur. Eserin vardığı sonuç, her serin gölgenin fayda, her esintinin meltem ve her insanın rehber sayılamayacağıdır. Hakikat arayışı seçicilik, derinlik ve görünüşün ardındaki değeri tanıma çabası gerektirir.
