baslik: Oldu
aciklama: Mehmet Aykurt’un Oldu adlı şiiri; geri dönülmez yolculuğu, saz ve sözle menzile yürümeyi, sevgi ile saygıyı inanç saymayı anlatır.
tarih: "2027-04-19"
icerikTuru: Şiir
anaTema: Ölüm yolculuğu, saz ve sevgi inancı
konu: Ölüm yolunun görünmesi, dünya haklarının helal edilmesi, saz ve sözle menzile yürünmesi ve sevgi-saygı merkezli inancın korunması
siirTuru: Tasavvufi ve lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Davran hele üstat kalk ayağa
  Gayri bize yollar görünür oldu
  Helaldir hakkımız cümle kullara
  Gidip de bir daha dönülmez oldu

  Sazım var elimde sözüm var dilimde
  Yük etmem başka bir şeyi kendime
  Bakarım da şöyle kendi kendime
  Gönül dediğim elde oyuncak oldu

  Uzun ince bir yol çıkayım hele
  Mutlaka varırım bir gün menzile
  Dönüp de bakmam bir gün geriye
  Anı diye deftere yazılır oldu

  Dinim sevgidir imanım saygı
  Boşuna vermedi Pir'im başını
  Çatınca öyle bana kaşını
  Ağzımızın tadı bozulur oldu
degerlendirme:
  genelBakis: “Oldu”, ölüm ya da geri dönülmez bir ayrılık yolunun göründüğünü söyleyen, saz ve sözü yol azığı yapan tasavvufi bir şiirdir. Söyleyici cümle kullara hakkını helal eder ve başka yük taşımamaya karar verir. “Uzun ince yol” menzile ulaşma iradesini güçlendirir. Son bölümde dinin sevgi, imanın saygı sayılması; yolculuğun ahlaki temelini ve Pir’e bağlılığın anlamını açıklar.
  temaVeKonu: Ana tema ölüm yolculuğu, saz ve sevgi inancıdır. Şiirin konusu, dönüşü olmayan yola hazırlanırken dünyevi hesapları helalle kapatmak ve yalnız saz ile sözü yanında tutmaktır. Gönlün elde oyuncak oluşu hayatın duygusal kırılganlığını gösterir. Menzile yürüyen kişi geriye bakmayacak, geçmişi anı olarak bırakacaktır. Sevgi ve saygı ise bütün bu yolculuğun değişmez inanç ölçüleridir.
  dilVeSoylevis: Dil konuşma üslubunda, kararlı ve yer yer sitemlidir. “Üstat” hitabı yol arkadaşına seslenir; “gayri” ve “hele” sözleri halk söyleyişinin doğallığını taşır. Saz, söz, gönül, yol, menzil ve Pir kavramları âşık ile tasavvuf dünyasını birleştirir. “Dinim sevgidir imanım saygı” dizesi şiirin özlü bildirisi olur. Son iki dize, kaş çatmanın bile ortak huzuru bozduğunu gündelik bir ifadeyle anlatır.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; uzun dizelerde ölçü farklılıkları görülür. Her dörtlüğün sonunda yinelenen “oldu” redifi değişimin ve tamamlanmanın sesidir. İlk bölüm yolun görünmesini, ikinci bölüm saz-söz ve gönlü, üçüncü bölüm menzili, son bölüm sevgi-saygı inancını işler. Bu yapı hazırlıktan yürüyüşe ve manevi ilkeye ilerler.
  gelenekVeSonuc: Uzun ince yol, menzil, saz, söz, gönül, Pir ve helallik kavramları âşık-tasavvuf şiiri geleneğinin belirgin unsurlarıdır. “Dinim sevgidir” düşüncesi insan merkezli bir inanç anlayışı kurar. Eserin sonucu, dönüşsüz yolculuk karşısında mal ve yük yerine söz, saz, helallik, sevgi ve saygının taşınmaya değer olduğudur; insan geride yalnız anısını bırakır.
sira: 99
