baslik: Gelsin
aciklama: Mehmet Aykurt’un Gelsin adlı şiiri; gönül ehli, Hak aşkıyla yanan ve Hacı Bektaş ocağından nasip alan kişileri meydana çağırır.
tarih: "2027-03-05"
icerikTuru: Şiir
anaTema: Hak aşkı ve erenler yoluna çağrı
konu: Kendisini bilen, Hak’tan bade içen, Hacı Bektaş ocağından kısmet alan ve Pir Sultan ile Yunus Emre’nin yolunu sürdürenlerin çağrılması
siirTuru: Tasavvufi şiir
gelenek: Alevi-Bektaşi şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Eğer varsa gönül ehli
  Olduğunu bilen gelsin
  Ne akıllı ne de deli
  Aşk uğruna yanan gelsin

  Bade içen varsa Hak'tan
  Sözü kuvvet bulan bundan
  Hacı Bektaş ocağından
  Kısmetini alan gelsin

  Pir Sultan'ın teli gibi
  Yunus Emre'm dili gibi
  Şu Mehmet'in kalemini
  Kıran varsa beri gelsin
degerlendirme:
  genelBakis: “Gelsin”, gönül ehli olan, kendi varlığını bilen ve Hak aşkıyla yanan kişileri meydana çağıran tasavvufi bir şiirdir. Hak’tan içilen bade söze kuvvet verir; Hacı Bektaş ocağı manevi kısmetin kaynağı olur. Son dörtlükte Pir Sultan’ın teli ile Yunus Emre’nin dili iki büyük gelenek simgesi olarak anılır. Şair kendi kalemini de bu miras karşısında sınamaya açık tutar.
  temaVeKonu: Ana tema Hak aşkı ve erenler yoluna çağrıdır. Şiirin konusu, akıl ve delilik gibi sıradan ölçülerin ötesine geçerek aşk uğruna yanan, manevi nasip alan insanların bir araya gelmesidir. “Olduğunu bilen” sözü özbilinci, bade ilahi aşkı, ocak ise yol ve topluluk bağını temsil eder. Son bölümde şair, kalemini kırabilecek kadar güçlü söz sahibini meydan okuyarak “beri” çağırır.
  dilVeSoylevis: Dil çağırıcı, coşkulu ve tasavvufi sembollerle yüklüdür. Her dörtlüğün sonunda tekrarlanan “gelsin” buyruğu şiiri bir meydana davet sesine dönüştürür. Gönül ehli, Hak, bade, ocak ve kısmet kelimeleri manevi yolculuğun aşamalarını kurar. Pir Sultan’ın “teli” sazı ve direnişi, Yunus Emre’nin “dili” sevgi ve hikmeti temsil eder. “Şu Mehmet” ifadesi tapşırma işlevi görür.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır. İkinci ve dördüncü dizelerde yinelenen “gelsin” redifi güçlü bir çağrı ritmi oluşturur. İlk bölüm gönül ehlini, ikinci bölüm nasip alanı, üçüncü bölüm ise söz ve saz geleneğinin temsilcilerini öne çıkarır. “Hak’tan/bundan/ocağından” sesleri orta bölümde, “gibi/dili” yakınlığı finalde ahengi destekler.
  gelenekVeSonuc: Hacı Bektaş, Pir Sultan ve Yunus Emre adları şiiri açıkça Alevi-Bektaşi ve âşık edebiyatı geleneğine yerleştirir. Bade, ocak, tel ve dil bu yolun temel sembolleridir. Eserin sonucu, gerçek söz kuvvetinin kişisel gösterişten değil Hak aşkı, manevi nasip ve köklü bir gelenekle bağ kurmaktan doğduğudur; şair bu ölçüye güvenenleri açıkça meydana davet eder.
