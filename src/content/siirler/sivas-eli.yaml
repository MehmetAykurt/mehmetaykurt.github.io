baslik: Sivas eli
aciklama: Mehmet Aykurt’un Sivas eli adlı şiiri; Sivas’ta otuz yedi canın yitirilmesini, unutulmayan toplumsal bir ağıt olarak işler.
tarih: "2026-12-05"
icerikTuru: Şiir
anaTema: Toplumsal acı ve unutmama
konu: Sivas’ta otuz yedi insanın yanarak hayatını kaybetmesi, yobaz kalabalığın saldırısı ve olayın yıllar geçse de unutulmaması
siirTuru: Ağıt ve toplumsal şiir
gelenek: Halk şiiri ve ağıt geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Bir duman ki göğü tutmuş
  Bak yanıyor Sivas eli
  Otuz yedi canı yutmuş
  Bak yanıyor Sivas eli

  Yobazlar indi meydana
  Toplanmışlar bir araya
  Hiç dur diyen yok mu buna
  Bak yanıyor Sivas eli

  Der Mehmet'im yandı canlar
  Nice gözden aktı yaşlar
  Geçse de aradan yıllar
  Unutulmaz Sivas eli
degerlendirme:
  genelBakis: “Sivas eli”, otuz yedi insanın yaşamını yitirdiği Sivas katliamını duman, ateş ve gözyaşı imgeleriyle anan toplumsal bir ağıttır. İlk iki dörtlükte “Bak yanıyor Sivas eli” nakaratı, seyirci kalınan felaketi göz önüne getirir. Son bölümde ateşin yerini anma sorumluluğu alır; yıllar geçse de olayın unutulmayacağının söylenmesi şiiri yas kadar hafıza çağrısına da dönüştürür.
  temaVeKonu: Ana tema toplumsal acı ve unutmamaktır. Şiirin konusu, göğü kaplayan dumanın altında otuz yedi canın yitirilmesi, saldırgan kalabalığın meydana toplanması ve buna engel olacak bir sesin aranmasıdır. “Hiç dur diyen yok mu buna” sorusu yalnız saldırganları değil, sessiz kalanları da sorgular. Son dörtlükte dökülen yaşlar ve geçen yıllar, acının zamana rağmen canlı kaldığını gösterir.
  dilVeSoylevis: Dil açık, yalın ve ağıt söyleyişine uygundur. “Bak” buyruğu dinleyeni olaya tanık olmaya çağırır; böylece uzak durma imkânını ortadan kaldırır. “Sivas eli” ifadesi şehri yalnız coğrafya değil, yaralanmış bir topluluk olarak sunar. “Yuttu”, “yandı” ve “aktı” fiilleri felaketin fiziksel ve duygusal sonuçlarını kurar. Tapşırma, kişisel sesi ortak hafızayla birleştirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı biçimde yaslanır. İlk iki dörtlük aynı nakaratla kapanır; son dörtlükte “yanıyor” yerine “unutulmaz” hükmü gelir. Bu değişim, olay anından tarihsel hafızaya geçişi sağlar. “Tutmuş / yutmuş” ve “canlar / yaşlar / yıllar” uyakları ses bütünlüğünü desteklerken kısa dizeler ağıdın vurucu ritmini korur.
  gelenekVeSonuc: Yer adıyla anılan felaketi nakarat ve yalın görüntülerle aktarması, şiiri halk ağıtları geleneğine bağlar. Bununla birlikte belirli bir toplumsal olaya ve saldırgan zihniyete doğrudan işaret etmesi çağdaş bir tanıklık niteliği taşır. Eserin temel sonucu, yasın yalnız geçmişe dönük olmadığını göstermesidir; anmak, sessizliği sorgulamak ve unutmayı reddetmek ahlaki bir görev olarak belirir.
