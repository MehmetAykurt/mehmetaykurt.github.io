baslik: İsyanı sükût
aciklama: Mehmet Aykurt’un İsyanı sükût adlı şiiri; suskunlukla öfke arasında kalan insanın iç isyanını ve ağır söz söyleme isteğini anlatır.
tarih: "2026-12-14"
icerikTuru: Şiir
anaTema: Bastırılmış öfke ve isyan
konu: İnsanlığa sığmayan davranışlar karşısında susmakta zorlanan söyleyicinin edep sınırını aşarak öfkesini boşaltma isteği
siirTuru: Lirik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  İsyan edesim geliyor bugün içimden
  Bilmem dilimden bilmem gönülden
  Uzaklaşıp biraz kendi kendimden
  Başka bir kimliğe bürünesim var

  Açsam ağzımı yumsam gözümü
  Bıraksam cümlenin mahrem özünü
  Çiğneyip geçsem edep sözünü
  Tepeden tırnağa sövesim var

  Yapılan insanlığa sığar mı gardaş
  Yarıda bırakıp gider mi yoldaş
  Nerede kaldı döktüğün yaş
  Damlasına suyuna diyesim var

  Der Mehmet'im susmaz dilim
  Köpürüp duruyor içim
  Sinirimi atıp rahat edeyim
  Gelmişine geçmişine diyesim var
degerlendirme:
  genelBakis: “İsyanı sükût”, insanlığa sığmayan bir davranış karşısında susmaya çalışan fakat içindeki öfkeyi bastıramayan söyleyicinin ruh hâlini anlatır. Edep sınırını koruyan kimlikten uzaklaşıp başka birine bürünme isteği, kırgınlığın büyüklüğünü gösterir. Şiir boyunca söylenmeyen ağır sözlerin çevresinde dolaşılır; böylece sükût ile isyan aynı anda varlığını sürdürür.
  temaVeKonu: Ana tema bastırılmış öfke ve isyandır. Şiirin konusu, yarı yolda bırakılmanın ardından söyleyicinin dilini serbest bırakma, mahrem sözü açığa çıkarma ve edep ölçüsünü çiğneme isteğidir. “Yapılan insanlığa sığar mı” sorusu öfkeye ahlaki bir gerekçe kazandırır. Son dörtlükte iç dünyanın köpürmesi, sözün henüz söylenmeden bile kişiyi kuşatan bir basınca dönüştüğünü gösterir.
  dilVeSoylevis: Dil konuşma üslubunda, öfkeli ve yer yer mizahi bir sertlik taşır. “Açsam ağzımı yumsam gözümü” kalıbı denetimsiz konuşma arzusunu, “tepeden tırnağa” ifadesi tepkinin bütünlüğünü belirtir. “Gardaş” hitabı öfkeyi bir dertleşme ortamına taşır. “Der Mehmet’im” tapşırmasından sonra kısa ve kesik dizeler kullanılması, söyleyicinin giderek hızlanan iç konuşmasını duyurur.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; kısa ve uzun dizeler arasında belirgin farklılıklar vardır. İlk iki bölüm “-esim var” isteğiyle kapanırken sonraki bölümlerde “diyesim var” tekrar edilir. Bu redif, düşünceden söze yönelen hareketi kurar. Son dörtlüğün kısalan dizeleri ve köpürme imgesi, ritmi hızlandırarak öfkenin doruğunu hazırlar.
  gelenekVeSonuc: Dertleşme hitabı, tapşırma ve tekrarlar şiiri âşık edebiyatı söyleyişine yaklaştırır; haksız davranışa yönelen sert eleştiri taşlama niteliği kazandırır. Buna rağmen ağır söz bütünüyle açıklanmaz, yalnız çevresi çizilir. Eserin dikkat çekici sonucu, başlıktaki sükût ile dizelerdeki isyanı karşı karşıya getirmesi ve suskunluğun boşluk değil, yoğun bir iç mücadele olduğunu göstermesidir.
