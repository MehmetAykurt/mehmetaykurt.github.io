baslik: Bordo Bere
aciklama: Mehmet Aykurt’un Bordo bere adlı şiiri; vatan uğruna göreve talip olan bir askerin cesaretini, öç ve fedakârlık duygularıyla anlatır.
tarih: "2026-11-26"
icerikTuru: Şiir
anaTema: Vatan sevgisi ve askerî cesaret
konu: Bir bordo berelinin komutanından göreve gitmek için izin istemesi, düşmanla mücadele ve vatana verilen söz uğruna canını ortaya koyması
siirTuru: Epik şiir
gelenek: Halk şiiri ve koçaklama geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  İzin ver de ben gideyim komutan
  Şu dağlardan alınacak öcüm var
  İstiyorsan işte beden işte can
  O da zaten vatanımın sözüm var

  Kefereyi geçirirsem elime
  Teslim alıp gelir diye bekleme
  Gerekirse tırnak ile diş ile
  Parçalarım milletime sözüm var

  Şu dağları adım adım hep gezdim
  Havada karada hep benim
  Sormayın adımı ben kimim neyim
  Dünyayı titretir bir namım var
  BORDO BERELİ
degerlendirme:
  genelBakis: “Bordo bere”, göreve çıkmak isteyen bir askerin komutanına seslenişi üzerinden vatan sevgisi, cesaret ve fedakârlığı anlatan epik bir şiirdir. Söyleyici bedenini ve canını ortaya koyar, dağlara hâkimiyetini ve düşman karşısındaki kararlılığını ilan eder. Son bölümde kişisel adın yerini “BORDO BERELİ” kimliğinin alması, bireyi aşan askerî bir unvan ve toplu kahramanlık imgesi oluşturur.
  temaVeKonu: Ana tema vatan uğruna mücadele ve askerî cesarettir. Şiirin konusu, alınacak öcü bulunduğunu söyleyen askerin göreve talip olması, gerektiğinde canını vermeyi ve düşmanla sonuna kadar savaşmayı milletine verilmiş söz saymasıdır. Dağ, hava ve kara alanlarının anılması, hareket sahasını genişletir. Son sözde kimliğin açıklanması, önceki meydan okumaların kaynağını belirginleştirir.
  dilVeSoylevis: Dil doğrudan, kararlı ve savaşçı bir söyleyiş taşır. “İzin ver”, “işte beden işte can” ve “bekleme” ifadeleri tereddütsüz bir görev isteğini gösterir. Tırnak ve diş imgeleri mücadeleyi en yalın bedensel güce kadar indirir. “Sormayın adımı ben kimim neyim” sözü kişisel tanınmayı önemsizleştirirken büyük harflerle yazılan son ifade, sesin kimliğini bir ünlem etkisiyle açığa çıkarır.
  ahenkVeYapi: Şiir iki dörtlük ve beş dizelik bir son bölümden oluşur; 11’li hece ölçüsüne ağırlıklı biçimde yaslanır, kısa dizelerde belirgin farklılıklar vardır. İlk iki bölümde “sözüm var” tekrarı vatana ve millete bağlılığı nakaratlaştırır. Son bölümde uyak düzeni gevşer, dizeler kısalır ve final tek başına öne çıkar. Bu yapısal kırılma, “BORDO BERELİ” açıklamasının etkisini artırır.
  gelenekVeSonuc: Yiğitlik, savaş, can verme ve düşmana meydan okuma unsurları şiiri halk edebiyatındaki koçaklama geleneğine yaklaştırır. Komutana sesleniş, askerî hiyerarşiyi korurken göreve gönüllü olma iradesini öne çıkarır. Eserin en belirgin yönü, kişisel adı geri çekip bordo bereli kimliğini merkeze alması ve fedakârlığı vatana verilmiş değişmez bir söz olarak sunmasıdır.
