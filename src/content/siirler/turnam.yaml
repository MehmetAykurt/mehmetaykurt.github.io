baslik: Turnam
aciklama: Mehmet Aykurt’un Turnam adlı şiiri; sevgiliden haber bekleyen âşığın hasretini geleneksel turna motifi üzerinden dile getirir.
tarih: "2026-08-22"
icerikTuru: Şiir
anaTema: Hasret ve haber bekleyişi
konu: Sevgiliye ulaşamayan âşığın turnadan haber istemesi ve kavuşmanın mahşere kalmasından korkması
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Turnam bana yardan bir haber getir
  Yâri göremedim bilmem nicedir
  Ölü mü sağ mıdır ahvali nedir
  Yanar oldum turnam yardan bir haber

  Gündüz hayalimde gece düşümde
  Unutmak mümkün mü ismi dilimde
  Yâri görmeyeli döndüm deliye
  Yanar oldum turnam yardan bir haber

  Der Mehmet'im arşa çıktı ahımız
  Sabreyle sevdiğim böyle yazımız
  Mahşere mi kaldı de kavuşmamız
  Yok mu söyle turnam yardan bir haber
degerlendirme:
  genelBakis: “Turnam”, sevdiğinden haber alamayan âşığın kaygı, hasret ve kavuşma özlemini geleneksel turna motifi çevresinde işleyen lirik bir şiirdir. Sevgilinin yaşayıp yaşamadığını bilememenin korkusu, gündüz hayale ve gece düşe dönüşür. Son dörtlükte yükselen ahlar ve kavuşmanın mahşere kalabileceği düşüncesi, bekleyişi dünyevi sınırların ötesine taşır.
  temaVeKonu: Ana tema hasret ve haber bekleyişidir. Âşık, yârin durumunu öğrenebilmek için turnayı aracı seçer; belirsizlik yüzünden yanar ve sevgilinin adını dilinden düşüremez. Ayrılık onu delilik hâline sürüklerken kader karşısında sabretmekten başka yol kalmaz. Kavuşmanın bu dünyada gerçekleşmeyebileceği korkusu, şiirin son bölümündeki duygusal gerilimi belirginleştirir.
  dilVeSoylevis: Şiirin dili sade, yalvaran ve doğrudan bir seslenişe dayanır. Turnaya yöneltilen “haber getir” ve “söyle” istekleri, kuşu âşık ile sevgili arasında canlı bir haberciye dönüştürür. “Gündüz hayalimde gece düşümde” sözü hasretin kesintisizliğini anlatır. Ahval, arş, mahşer ve yazı gibi kelimeler şiirin duygu alanına kader ve maneviyat boyutu katar.
  ahenkVeYapi: Üç dörtlükten oluşan şiir 11’li hece ölçüsüyle kurulmuştur. İlk iki dörtlüğün sonunda yinelenen “Yanar oldum turnam yardan bir haber” dizesi nakarat işlevi görür; son dörtlükte benzer söyleyiş soru biçimine dönüşür. “Getir / nicedir / nedir” ve “ahımız / yazımız / kavuşmamız” uyakları ahengi güçlendirir. Düzenli yapı, ağıt ve türkü havasını destekler.
  gelenekVeSonuc: Turna, Türk halk şiirinde uzak diyarlardan haber taşıyan ve ayrılmış gönülleri birbirine bağlayan köklü bir motiftir. Yâr, ah, sabır, kader ve mahşerde kavuşma düşünceleri de âşık edebiyatının hasret dünyasıyla uyumludur. Şiir, turnayı yalnız bir haberci değil, âşığın derdini anlayacak sırdaş olarak konumlandırır ve geleneksel motifi içten bir bekleyişle yeniden işler.
