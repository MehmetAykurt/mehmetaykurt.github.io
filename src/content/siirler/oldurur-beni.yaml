baslik: Öldürür Beni
aciklama: Mehmet Aykurt’un Öldürür Beni adlı şiiri; aşk ve sitem temasını, sevgilinin nazı karşısında incinen âşığın iç sesiyle anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Aşk ve sitem
konu: Sevgilinin nazı, ilgisizliği ve uzak duruşu karşısında âşığın incinmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü
siirMetni: |-
  Bakıp kaşlarını çatar
  Gözlerinden ateş saçar
  Köşe bucak benden kaçar
  Nazıyla öldürür beni

  Uzatırım elin vermez
  Sanırsınız kelam bilmez
  Bir kerecik yüzü gülmez
  Duruşu öldürür beni

  Anlamadım derdin nedir
  Bu hallerin elem verir
  Söyle kusur benden midir
  Diliyle öldürür beni

  Sevsem seni deli gibi
  İzin versen bana he mi
  Günah mıdır nedir yani
  Korkusu öldürür beni
degerlendirme:
  genelBakis: “Öldürür Beni” adlı şiir, sevgilinin nazlı ve mesafeli tavırları karşısında âşığın yaşadığı iç sıkıntısını anlatır. Şiirin genel havasında sitem, kırgınlık, çaresizlik ve sevda acısı öne çıkar. Âşık, sevgilinin bakışından, suskunluğundan, duruşundan ve korkusundan etkilenmekte; bu hâlleri kendisi için dayanılmaz bir acı olarak görmektedir.
  temaVeKonu: Şiirin ana teması aşk ve sitemdir. Konu, sevdiği kişiden karşılık bekleyen âşığın, sevgilinin soğuk ve çekingen davranışları karşısında incinmesidir. Sevgili bazen kaşlarını çatmakta, bazen kaçmakta, bazen de hiç konuşmamaktadır. Âşık ise bu tavırların nedenini anlamaya çalışır ve kusurun kendisinde olup olmadığını sorgular.
  dilVeSoylevis: Şiirin dili sade, içten ve halk söyleyişine yakındır. “Anlamadım derdin nedir”, “Söyle kusur benden midir”, “İzin versen bana he mi” gibi ifadeler şiire doğal bir konuşma havası kazandırır. Söyleyişte hem sevgi hem de sitem vardır. Âşık, sevgiliye doğrudan seslenerek duygusunu açık ve samimi biçimde dile getirir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 8’li hece ölçüsüyle yazılmıştır. Her dörtlüğün sonunda yer alan “öldürür beni” ifadesi, şiirin ana duygusunu güçlendiren belirgin bir redif niteliğindedir. “Çatar / saçar / kaçar”, “vermez / bilmez / gülmez”, “nedir / verir / midir” gibi uyaklar şiirin ahengini destekler. Kısa mısralar ve tekrarlar, şiire türküye yakın bir ritim kazandırır.
  gelenekVeSonuc: Şiir, halk şiiri ve âşık edebiyatı geleneğiyle uyumludur. Sevgilinin nazı, âşığın sitemi, karşılık bekleyen gönlün çaresizliği ve doğrudan hitap biçimi bu geleneğin temel özellikleri arasındadır. Şiirin öne çıkan yönü, sevgilinin küçük tavırlarını büyük bir gönül yarasına dönüştüren içten ve akıcı söyleyişidir.
sira: 10
