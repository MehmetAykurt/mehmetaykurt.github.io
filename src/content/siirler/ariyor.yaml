baslik: Arıyor
aciklama: Mehmet Aykurt’un Arıyor adlı şiiri; aşk ve arayış temasını, gönlün sevgiliye yönelmesi ve yakınlık isteğiyle halk şiiri dilinde işler.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Aşk ve arayış
konu: Gönlün sevgiliye yönelmesi, sevgiye karşılık ve yakınlık araması
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü
siirMetni: |-
  Kanatlandı deli gönlüm
  Konacak bir dal arıyor
  Seni izler oldu gözüm
  Simasında gül arıyor

  Mis gibi kokuyor teni
  Bilmem ki nasıldır rengi
  Dokunsam yakar mı beni
  Kavrulacak köz arıyor

  Dokunmasam hiç hayatta
  Hayalin de yeter bana
  Ne olur gel kollarıma
  Saracak bir yar arıyor

  Deli gibi sevsem seni
  İzin versen bana he mi
  Ara sıra umut belki
  Konuşacak dil arıyor
degerlendirme:
  genelBakis: “Arıyor” adlı şiir, âşık gönlün sevgi, umut ve kavuşma isteği etrafında yaşadığı iç dalgalanmayı anlatır. Şiirin genel havasında içten bir arzu, çekingen bir bekleyiş ve duygusal bir arayış öne çıkar. Gönül, konacak dal; göz, sevgilinin yüzünde gül; beden ise sarılacak bir yar aramaktadır.
  temaVeKonu: Şiirin ana teması aşk ve arayıştır. Konu, sevdaya düşen kişinin sevgiliye yaklaşma isteğiyle yanma korkusu arasında kalmasıdır. Şair bir yandan sevgilinin hayaliyle yetinebileceğini söylerken diğer yandan onun kollarına gelmesini ister. Bu durum, aşkın hem çekingen hem de tutkulu yönünü ortaya koyar.
  dilVeSoylevis: Şiirin dili sade, akıcı ve konuşma havasına yakındır. “Deli gönlüm”, “ne olur gel kollarıma”, “he mi” gibi söyleyişler şiire samimi ve halk diline yakın bir özellik kazandırır. Anlatımda içten bir sesleniş vardır. Şair, duygularını süslü ve ağır sözlerle değil; yalın, doğal ve gönülden gelen ifadelerle dile getirir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 8’li hece ölçüsüyle yazılmıştır. “Arıyor” sözcüğünün dörtlüklerde tekrarlanması, şiirin ana duygusunu güçlendiren bir redif görevi görür. “Gönlüm / gözüm”, “teni / rengi / beni”, “seni / he mi / belki” gibi ses yakınlıkları ahengi destekler. Mısralar kısa ve akıcıdır; bu da şiire türkü tadında bir ritim kazandırır.
  gelenekVeSonuc: Şiir, halk şiiri ve âşık edebiyatı geleneğiyle bağlantılıdır. Gönül, gül, köz, yar ve dil gibi imgeler bu geleneğin sevda dilini hatırlatır. Âşığın sevgiliye duyduğu özlem, umutla bekleyişi ve kavuşma arzusu lirik bir söyleyişle işlenmiştir. Şiirin öne çıkan yönü, “arıyor” tekrarı etrafında kurduğu duygusal bütünlük ve sade halk söyleyişidir.
sira: 3
oneCikan: false
