baslik: Şeytan
aciklama: Mehmet Aykurt’un Şeytan adlı şiiri; şeytanın kibir, kandırma ve insanın zaafına sızma yollarını anarak Allah’a sığınır.
tarih: "2027-03-20"
icerikTuru: Şiir
anaTema: Şeytanın şerrinden korunma
konu: Haklılık iddiasıyla huzurdan kovulan şeytanın Âdem ile Havva’yı kandırması, insanın zayıflığını kullanması ve besmeleyle uzaklaştırılması
siirTuru: Dinî ve didaktik şiir
gelenek: Halk şiiri ve dinî şiir geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Ben haklıyım diye savunmadı mı
  Huzurdan ağlayarak kovulmadı mı
  Âdem'i Havva'yı kandırmadı mı
  Şeytanın şerrinden Allah korusun
  İnsanın içinden geçeni sezer
  Gücünün yettiğine anında çöker
  Girer de koluna yoldaşlık eder
  Şeytanın şerrinden Allah korusun
  Bir besmele çek varsın erisin
  Duyunca kelamı haddini bilsin
  Eğip de başını defolup gitsin
  Bizleri şerrinden Allah korusun
degerlendirme:
  genelBakis: “Şeytan”, şeytanın kibirle başlayan düşüşünü, Âdem ile Havva’yı kandırmasını ve insanın zayıf anlarına sızmasını anlatan dinî-didaktik bir şiirdir. İlk bölüm tarihsel-dinî örnekleri sorularla hatırlatır, ikinci bölüm şeytanın insana yaklaşma biçimini gösterir, son bölüm ise besmele ve kelamla korunmayı önerir. Tekrarlanan dua, anlatıyı bilgi vermekten çıkarıp toplu bir sığınma sesine dönüştürür.
  temaVeKonu: Ana tema şeytanın şerrinden korunmadır. Şiirin konusu, “ben haklıyım” iddiasıyla kibirlenen şeytanın huzurdan kovulması ve insanın içinden geçeni sezerek güç yetirebildiğine yoldaş olmasıdır. Tehlike dışarıdan açık bir saldırı gibi değil, koluna giren yakınlık görüntüsüyle gelir. Besmele çekmek ve ilahi kelamı söylemek, bu sinsi bağa karşı manevi savunma olarak sunulur.
  dilVeSoylevis: Dil açık, uyarıcı ve dua tonundadır. İlk üç dizedeki “-madı mı” soruları bilinen kıssayı dinleyenin hafızasında canlandırır. “Koluna girmek” deyimi şeytanın dost gibi yaklaşmasını, “erisin” ve “defolup gitsin” sözleri onun kelam karşısında güçsüzleşmesini anlatır. “Allah korusun” tekrarları hem redif hem de korunma duasıdır; son bölümde “bizleri” denerek kişisel endişe topluluğa genişler.
  ahenkVeYapi: Şiir kaynak metinde boşlukla ayrılmayan on iki dizeden oluşur; anlam bakımından üç dörtlük hâlinde ilerler ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır. Her dört dizenin sonunda yer alan “Allah korusun” nakaratı yapıyı belirginleştirir. İlk kesit geçmişi, ikinci kesit bugünkü sızmayı, üçüncü kesit korunma yolunu anlatır. Soru, gözlem ve dua sırası şiire düzenli bir gelişim kazandırır.
  gelenekVeSonuc: Âdem-Havva kıssası, besmele, kelam ve Allah’a sığınma ifadeleri şiiri halkın dinî öğüt geleneğine bağlar. Şeytanın kibri ile insanın haklılık iddiası arasında dolaylı bir benzerlik kurulur. Eserin sonucu, kötülüğün çoğu zaman dostluk görüntüsüyle yaklaşabileceği ve insanın yalnız iradesine güvenmek yerine besmele, ilahi söz ve dua aracılığıyla manevi uyanıklığını koruması gerektiğidir.
sira: 89
