baslik: Hâli Ahvalim
aciklama: Mehmet Aykurt’un Hâli ahvalim adlı şiiri; tükenişi, yalnızlığı ve erken yaşlanmayı sabır ile teslimiyet düşüncesiyle işler.
tarih: "2026-09-21"
icerikTuru: Şiir
anaTema: Tükeniş, yalnızlık ve sabır
konu: Hayat yükü altında erkenden yaşlanan, kendini kalabalık içinde yalnız hisseden insanın sabırla ayakta kalması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sormayın erenler bugün halimi
  Dokunsalar sanki ağlar gibiyim
  Kurudu yaprağım kırıldı dalım
  Terk edilmiş viran bağlar gibiyim

  Kalmadı dünyada tutar bir dalım
  Çıkmadık bedende kuru bir canım
  Gün görmeden geldi geçti baharım
  Otuzunda yetmişi bulmuş gibiyim

  Çöktü omuzlar büküldü belim
  Söylesen söylemez lal oldu dilim
  Perişan dedikçe perişan halim
  Farz et ki yaşayan ölü gibiyim

  Kalmadı dermanım kalksam ayağa
  Kimse yok ki tutsam elin uzatsa
  Bakarsan dolu etrafım ama
  Varlıkta yokluğu yaşar gibiyim

  Der Mehmet'im dünya hali neylersin
  Bazen ağlar bazen güler geçersin
  Sabret ki muradına eresin
  Eyüp'ün sırrına ermiş gibiyim
degerlendirme:
  genelBakis: “Hâli ahvalim”, hayat yükü altında tükenen, erkenden yaşlanan ve kalabalık içinde yalnız kalan insanın iç dünyasını anlatır. Kuruyan yaprak, kırılan dal ve viran bağ imgeleriyle başlayan çöküş; bükülen bel, susan dil ve yaşayan ölü benzetmesiyle derinleşir. Son dörtlükte dünya hâlinin değişkenliği hatırlatılır ve acının içinden sabır ile teslimiyete yönelinir.
  temaVeKonu: Ana tema tükeniş, yalnızlık ve sabırdır. Şiirin konusu, gün görmeden baharı geçen insanın bedenen ve ruhen çökmesi, çevresi dolu görünse de yardım edecek kimseyi bulamamasıdır. İlk dört dörtlükte dert, erken yaşlanma, dilsizlik ve yokluk duygusu işlenir. Son bölümde ağlamak ile gülmenin dünyanın geçici hâlleri olduğu söylenerek sabrın murada ulaştıracağı umudu korunur.
  dilVeSoylevis: Dil içli, doğrudan ve geleneksel seslenişlerle örülüdür. “Erenler” hitabı, anlatıcının derdini anlayacak gönül ehline yöneldiğini gösterir. Kuruyan yaprak, kırılan dal, viran bağ, lal dil ve yaşayan ölü imgeleri tükenişi görünür kılar. “Gibiyim” tekrarı her dörtlükte yeni bir ruh hâli kurarken “Der Mehmet’im” sözü kişisel tecrübeyi âşık söyleyişine bağlar.
  ahenkVeYapi: Şiir beş dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde hece farklılıkları görülür. Dörtlük sonlarındaki “gibiyim” redifi şiirin bütünlüğünü sağlar. “Halimi / dalım”, “canım / baharım”, “belim / dilim / halim” ve “neylersin / geçersin / eresin” ses birlikleri ahengi destekler. Duygu çöküşten sabra doğru aşamalı biçimde ilerler.
  gelenekVeSonuc: Viran bağ, tutunacak dal, dünya hâli, sabır ve murada erme düşünceleri halk şiiri ile âşık edebiyatının ortak unsurlarıdır. Eyüp’ün sabrına yapılan gönderme, kişisel acıyı inanç ve teslimiyet çerçevesine taşır. Şiir yalnızlığı ve tükenişi yoğun benzetmelerle anlatırken son bölümde bütünüyle karanlığa kapanmaz; sabır sayesinde acıya anlam kazandırmaya yönelir.
sira: 29
