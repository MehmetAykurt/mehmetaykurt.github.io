baslik: Değişir
aciklama: Mehmet Aykurt’un Değişir adlı şiiri; sonbahardan kışa geçerken Anadolu köyündeki tabiatı, üretimi ve hayat mücadelesini anlatır.
tarih: "2026-10-09"
icerikTuru: Şiir
anaTema: Mevsim değişimi ve Anadolu’da hayat mücadelesi
konu: Sonbahardan kışa geçişin tabiat, tarım, ev hazırlıkları, hayvanlar ve köy insanının günlük yaşamındaki etkileri
siirTuru: Pastoral ve didaktik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Güneş çekilince biraz geriye
  Değişir mevsimler dayanır güze
  Gazel olur yaprak dökülür yere
  Toprağın kokusu rengi değişir

  Yeşilken sarıya boyanır her yer
  Kaçışır yuvaya girer böcekler
  Boynunu büküp de kurur çiçekler
  Bülbülün feryadı sesi değişir

  Çiftçi öküzünü koşar sabana
  Dolaşır tarlayı bir baştan başa
  Sığınır Mevla'ya alır avcuna
  Saçtığı tohumun zarı değişir

  Üzümler asmadan tek tek toplanır
  Teknenin içinde iyce çığnanır
  Kurulur kazanlar ateş harlanır
  Kaynadıkça şire tadı değişir

  Kadınlar toplanmış erişte keser
  Hasırın üstüne tarhana serer
  İpliğe patlıcan biberi dizer
  Durdukça asılı şekli değişir

  Sabah erkenden kalkar ayağa
  Bir torba unun geçer başına
  Saçmayı tezeği döker tandıra
  Tüttükçe dumanı hava değişir

  Dağlardan kurumuş odun toplanır
  Baltanın kütükte gücü sınanır
  Hayvanlar ahıra gayri toplanır
  Durdukça içerde tüyü değişir

  Bir gece ansızın yağar sessizce
  Dört bir yan bürünür beyaz örtüye
  Mevsimin çilesi başlar böylece
  Titrerken bedeni teni değişir

  Bir tipi bir boran zorlar kapıyı
  İstese çıkamaz artık dışarı
  Erkenden serilir yere yatağı
  Kapatır gözünü vakit değişir

  Sıkıntı biter mi Anadolu'da
  Ne dertler yaşanır bilsen burada
  Yaz bitip de mevsim dönünce kışa
  Başlar mücadele hayat değişir
degerlendirme:
  genelBakis: “Değişir”, sonbahardan kışa geçişi yalnız tabiatın dönüşümü olarak değil, Anadolu köyündeki üretimin, hazırlığın ve hayat mücadelesinin bütünü olarak anlatan geniş soluklu bir şiirdir. Yaprağın sararmasından tohum ekimine, şire kaynatmaktan tarhana sermeye, odun toplamaktan karla kapanmaya kadar mevsimin köy yaşamındaki bütün karşılıkları canlı bir gözlemle sıralanır.
  temaVeKonu: Ana tema mevsim değişimi ve Anadolu’da hayat mücadelesidir. Şiirin konusu, güneşin çekilmesiyle başlayan sonbaharın toprağı, bitkiyi, hayvanı ve insan emeğini değiştirmesidir. Tarla sürülür, ürünler işlenir, kışlık yiyecek ve yakacak hazırlanır. Kar, tipi ve boran geldiğinde günlük hareket daralır. Son dörtlük bütün bu ayrıntıları Anadolu insanının bitmeyen mücadelesine bağlar.
  dilVeSoylevis: Dil sade, gözlemci ve ayrıntı bakımından zengindir. Gazel, saban, şire, erişte, tarhana, hasır, tandır, tezek ve ahır gibi kelimeler Anadolu köy hayatının maddi kültürünü şiire taşır. “Değişir” sözcüğü her dörtlükte başka bir varlığa yönelerek kokudan sese, tattan şekle, havadan hayata uzanır. Anlatım, gündelik işlerin içindeki şiirselliği görünür kılar.
  ahenkVeYapi: Şiir on dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. Her dörtlüğün sonunda yinelenen “değişir” sözü redif görevi görerek uzun metnin bütünlüğünü sağlar. “Geriye / güze / yere”, “toplanır / çığnanır / harlanır” ve “sessizce / örtüye / böylece” ses yakınlıkları ahengi destekler. Dörtlüklerin sırası mevsim döngüsünü adım adım izler.
  gelenekVeSonuc: Tabiatı, tarımı, kış hazırlığını ve köy insanının emeğini dörtlüklerle anlatmak halk şiirinin pastoral ve toplumsal damarına uygundur. Şiir yalnız güzellik betimlemesi yapmaz; çetin iklim karşısındaki ortak emeği ve geçim mücadelesini kayda geçirir. Eserin öne çıkan yönü, Anadolu’nun somut yaşam ayrıntılarını mevsim değişimi çevresinde birleştirerek kültürel hafıza niteliği kazanmasıdır.
