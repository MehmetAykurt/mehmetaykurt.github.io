baslik: İnsanın Gönlüne Sevda Düşerse
aciklama: Mehmet Aykurt’un İnsanın Gönlüne Sevda Düşerse adlı şiiri; kara sevdanın bedeni ve gönlü yıpratan etkisini halk şiiri çizgisinde anlatır.
tarih: "2026-05-01"
icerikTuru: Şiir
anaTema: Kara sevda
konu: Sevdanın insanı bedenen ve ruhen yıpratması, ancak kavuşmayla gönlün huzur bulması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
siirMetni: |-
  İnsanın Gönlüne Sevda Düşerse
  Dilinden dökülen ahu zar olur
  Hasret kalırsa hele bir de yârine
  Akar gözlerinden yaşı sel olur

  Temmuzunda kar yağdırır başına
  Otuzunda ak düşürür saçına
  Ne lafa gelir ne de bir yola
  Kaybeder aklını sanki del olur

  Geceleri uyku girmez gözüne
  Gündüzleri duramaz ki yerinde
  Düşünürse öyle kendi kendine
  Hastalığı içinde ince dert olur

  Der Mehmet'im düşme kara sevdaya
  Lokman Hekim gelse etmez bir fayda
  Belki bir gün sevdiğini sararsa
  İşte o gün anca gönlü şad olur
degerlendirme:
  genelBakis: “İnsanın Gönlüne Sevda Düşerse” adlı şiir, sevdanın insan üzerindeki sarsıcı etkisini anlatan içli bir şiirdir. Şiirin genel havasında hüzün, çaresizlik, hasret ve öğüt duygusu öne çıkar. Sevda, burada insanı olgunlaştıran bir duygudan çok; aklı karıştıran, bedeni yoran ve gönlü derde düşüren bir hâl olarak ele alınmıştır.
  temaVeKonu: Şiirin ana teması kara sevdadır. Konu, gönlüne sevda düşen insanın yaşadığı ruhsal ve bedensel değişimlerdir. Âşık, sevdiğinden ayrı kaldığında ahu zar eder, gözlerinden yaş döker, uykusunu kaybeder ve içten içe hastalanır. Son dörtlükte ise kara sevdaya düşmeme öğüdü verilir; bu derdin Lokman Hekim’in bile çare bulamayacağı kadar güçlü olduğu belirtilir. Tek çare, sevdiğine kavuşmaktır.
  dilVeSoylevis: Şiirin dili sade, anlaşılır ve halk söyleyişine yakındır. “Ahu zar”, “kara sevda”, “gönlü şad olur” gibi ifadeler şiire geleneksel bir duygu dünyası kazandırır. Söyleyiş, hem içli hem de öğüt vericidir. Şair, sevdanın acısını abartılı ama halk şiirine uygun bir samimiyetle dile getirir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur. Genel olarak 11’li hece ölçüsüne yaslanır; ancak bazı mısralarda küçük hece farklılıkları görülür. “Olur” sözcüğünün dörtlük sonlarında yinelenmesi şiire güçlü bir ahenk kazandırır. “Başına / saçına”, “gözüne / yerinde / kendine”, “sevdaya / fayda” gibi ses benzerlikleri ritmi destekler. Dörtlük yapısı ve tekrarlar şiire türküye yakın bir söyleyiş verir.
  gelenekVeSonuc: Şiir, halk şiiri ve âşık edebiyatı geleneğiyle güçlü bir bağ taşır. Kara sevda, hasret, gözyaşı, uykusuzluk, delilik hâli ve Lokman Hekim göndermesi bu geleneğin bilinen unsurlarıdır. Son dörtlükte “Der Mehmet’im” ifadesinin kullanılması, âşık şiirindeki mahlas geleneğini hatırlatır. Şiirin öne çıkan yönü, sevdayı hem bir gönül derdi hem de çaresi kavuşmada olan derin bir hastalık gibi anlatmasıdır.
sira: 9
