baslik: Gönül Mahpushanesi
aciklama: Mehmet Aykurt’un Gönül mahpushanesi adlı şiiri; aşkı sorgusuz bir mahkûmiyet ve gönüllü tutsaklık benzetmesiyle anlatır.
tarih: "2026-09-12"
icerikTuru: Şiir
anaTema: Aşkın tutsaklığı ve kabulleniş
konu: Âşığın gönül mahpushanesinde yargısız biçimde tutsak oluşu ve zamanla bu müebbet mahkûmiyeti benimsemesi
siirTuru: Lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Sorgusuz sualsiz girdik içeri
  Gönül mahpushanesinde küçük bir hücre
  Ne avukat ne savcı ne de hâkimi
  Mahkemesiz karar yazılmış öyle

  Kolumda kelepçe boynumda zincir
  Nerem var kaçacak her yanım demir
  Mahkûm değilim de sanasın esir
  Karara tedbirli yazılmış öyle

  Ben mahpushanedeyim mahpushane bende
  Alıştık zamanla geçtik iç içe
  Tahliye etse de dönmem geriye
  Karara müebbet yazılmış öyle
degerlendirme:
  genelBakis: “Gönül mahpushanesi”, aşkı yargısız bir tutukluluk, gönlü ise insanın hem içinde taşıdığı hem de içine kapandığı bir hapishane olarak anlatan lirik bir şiirdir. İlk dörtlükte sorgusuz verilen hüküm, ikinci dörtlükte kelepçe ve zincirle ağırlaşır. Son bölümde tutsaklıkla kurulan bağ öylesine güçlenir ki tahliye ihtimali bile geri dönme arzusunu ortadan kaldırmaz.
  temaVeKonu: Ana tema aşkın tutsaklığı ve bu tutsaklığı kabulleniştir. Şiirin konusu, âşığın avukat, savcı ve hâkim olmadan verilen bir kararla gönül hücresine kapatılmasıdır. Kaçış imkânı bulunmayan bu mahkûmiyet zamanla dıştan dayatılan bir ceza olmaktan çıkar; âşığın benliğine karışır. Müebbet kararı, sevdanın ömür boyu sürecek gönüllü bir bağlılığa dönüşmesini simgeler.
  dilVeSoylevis: Şiirin dili sade olmakla birlikte hukuk ve cezaevi söz varlığı çevresinde kurulmuş güçlü bir benzetmeye dayanır. Sorgu, hücre, avukat, savcı, hâkim, karar, kelepçe, zincir, tahliye ve müebbet kelimeleri aynı anlam alanını besler. “Ben mahpushanedeyim mahpushane bende” dizesi, dışarıdaki mekân ile iç dünyayı birleştirerek şiirin merkez düşüncesini özlü biçimde ifade eder.
  ahenkVeYapi: Üç dörtlükten oluşan şiir 11’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde hece farklılıkları görülür. Dörtlük sonlarında yinelenen “yazılmış öyle” sözü, hükmün önceden verilmiş ve değişmez olduğu duygusunu güçlendirir. “Zincir / demir / esir” uyağı ikinci dörtlüğe belirgin bir ses bütünlüğü kazandırır. Tek benzetme çevresinde ilerleyen yapı tutarlıdır.
  gelenekVeSonuc: Gönlün insanı tutsak etmesi ve sevdanın kaçışı olmayan bir yazgı sayılması halk şiirindeki söz dinlemez gönül anlayışıyla bağlantılıdır. Şiir bu geleneksel düşünceyi mahpushane ve hukuk imgeleriyle yeniler. Âşık önce mağdur görünse de sonunda tahliyeyi reddederek sevdayı bilinçli biçimde benimser. Eserin gücü, aşk ile tutsaklık arasındaki benzetmeyi baştan sona bozmadan sürdürmesidir.
