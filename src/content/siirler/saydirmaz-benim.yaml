baslik: Saydırmaz Benim
aciklama: Mehmet Aykurt’un Saydırmaz benim adlı şiiri; karşılıksız sevdayı ve sevgilinin ilgisizliği karşısındaki değersizlik duygusunu işler.
tarih: "2026-08-16"
icerikTuru: Şiir
anaTema: Karşılıksız sevda ve değersizlik
konu: Vefasız sevgilinin ilgisizliği karşısında âşığın kendini değersiz ve çaresiz hissetmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Gül oldum vefasız yârin bağında
  Veripte suyumu açtırmaz benim
  Bülbül oldum dolaşırım bağında
  Uzamış dalına kondurmaz benim

  Elim kolum bağlı kaldım köşede
  Bir kerecik dönüp bakmaz halime
  Vazgeçip uğruna feda etsem de
  Bir pula saydırmaz canımı benim
degerlendirme:
  genelBakis: “Saydırmaz benim”, karşılık bulmayan sevdanın âşıkta oluşturduğu değersizlik ve çaresizlik duygusunu kısa, yoğun bir söyleyişle anlatır. Gül ve bülbül kimliğine bürünen âşık, sevgilinin bağında bulunmasına rağmen suya, dala ve bakışa erişemez. Şiirin genel havasına sevgiyle birlikte kırgınlık, dışlanmışlık ve kendini feda etmenin bile karşılık görmemesi hâkimdir.
  temaVeKonu: Ana tema karşılıksız sevda ve değersizliktir. İlk dörtlükte âşık, gül ve bülbül imgeleriyle sevgilinin dünyasına ait olmaya çalışır; ancak sevgili onun açmasına ve dalına konmasına izin vermez. İkinci dörtlükte bu engellenmişlik doğrudan çaresizliğe dönüşür. Âşık canını feda etmeye hazır olsa da sevgilinin gözünde bir pul kadar değer taşımadığını düşünür.
  dilVeSoylevis: Şiirin dili sade, doğrudan ve sitem yüklüdür. “Elim kolum bağlı” sözü çaresizliği gündelik dilin açıklığıyla verirken “bir pula saydırmaz” ifadesi değersizlik duygusunu somutlaştırır. Gül ve bülbül imgeleri geleneksel sevda söz varlığını taşır. Her iki dörtlüğün sonunda kullanılan “benim” sözü, yaşanan kırgınlığı kişisel bir ağıt tonuna yaklaştırır.
  ahenkVeYapi: İki dörtlükten oluşan şiir 11’li hece ölçüsüyle kurulmuştur. “Bağında” sözcüğünün tekrarı ilk ve üçüncü dizeler arasında ses birliği sağlarken “açtırmaz / kondurmaz / saydırmaz” fiilleri olumsuzluğu ritmik biçimde büyütür. Dörtlük sonlarında yinelenen “benim” sözü redif niteliği taşır. Kısa yapı ve düzenli ölçü, sitemin doğrudan ve etkili duyulmasını sağlar.
  gelenekVeSonuc: Gül, bülbül, yar bağı ve canı sevgili uğruna feda etme düşüncesi şiiri halk şiiri ile âşık edebiyatının sevda geleneğine bağlar. Gelenekte sevgili çoğu zaman erişilmez, âşık ise onun çevresinde dönen ve eziyete katlanan kişidir. Şiirin öne çıkan yönü, bu bilinen ilişkiyi bir pula sayılmama sözüyle keskinleştirerek aşk acısını değersizlik duygusuyla birleştirmesidir.
sira: 17
