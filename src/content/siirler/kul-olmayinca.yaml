baslik: Kül olmayınca
aciklama: Mehmet Aykurt’un Kül olmayınca adlı şiiri; sevda acısını, ayrılığı ve kader karşısındaki çaresizliği halk şiiri diliyle anlatır.
tarih: "2026-08-31"
icerikTuru: Şiir
anaTema: Sevda acısı, ayrılık ve kader
konu: Aşkın ve dünya kahrının ancak sevdanın tükenmesi ya da ilahi yardım ile aşılabileceği düşüncesi
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü
youtubeAdresi: ""
siirMetni: |-
  Şu yüce dağların karı erimez
  Vurup da güneşi har olmayınca
  Yiğidin acısı ölse de dinmez
  Gönlünde sevdası kül olmayınca

  Bülbül figan eder güllere karşı
  Küçücük bedeni titretir arşı
  Âşığın gözünden eksilmez yaşı
  Sevdiği yanında var olmayınca

  Şu yalan dünyanın kahrı çekilmez
  Dikenli yolları kolay yürünmez
  Yazılmış kaderi gayri değişmez
  İlahi kudreti el olmayınca
degerlendirme:
  genelBakis: “Kül olmayınca”, sevdanın kolay dinmeyen acısını, ayrılığın gözyaşını ve insanın kader karşısındaki sınırlılığını birlikte ele alan lirik ve didaktik bir şiirdir. Dağ karının güneşle erimesinden bülbülün figanına, oradan dünyanın kahrına uzanan anlatım giderek genişler. Son dörtlükte kişisel acı, yazılmış kader ve ilahi kudret düşüncesiyle hikmetli bir sonuca bağlanır.
  temaVeKonu: Ana tema sevda acısı, ayrılık ve kaderdir. İlk dörtlükte dağ karının erimesiyle gönüldeki sevdanın küle dönüşmesi arasında benzerlik kurulur; her ikisi de güçlü bir etki olmadan sona ermez. İkinci dörtlük, sevgili yanında olmadıkça âşığın gözyaşının dinmeyeceğini söyler. Son bölümde dünyanın çetin yolları ve değişmeyen kader karşısında ilahi yardımın gerekliliği vurgulanır.
  dilVeSoylevis: Dil sade, özlü ve atasözüne yaklaşan hüküm cümleleriyle kuruludur. “Erimez”, “dinmez”, “çekilmez”, “yürünmez” ve “değişmez” fiilleri aşılması güç durumları art arda sıralar. Dağ, kar, güneş, kül, bülbül, gül ve dikenli yol imgeleri düşünceyi somutlaştırır. “Olmayınca” tekrarı, her dörtlükte sonucun bağlı olduğu şartı belirleyerek öğüt verici tonu güçlendirir.
  ahenkVeYapi: Şiir üç dörtlükten oluşur ve 11’li hece ölçüsüyle düzenli biçimde kurulmuştur. Dörtlüklerin ikinci ve dördüncü dizelerinde yinelenen “olmayınca” sözü redif görevi görür. “Erimez / dinmez”, “karşı / arşı / yaşı” ve “çekilmez / yürünmez / değişmez” ses birlikleri ahengi kuvvetlendirir. Paralel cümle yapıları şiire kararlı, ağır ve hikmetli bir ritim kazandırır.
  gelenekVeSonuc: Yüce dağ, bülbül, gül, âşığın gözyaşı, yalan dünya, dikenli yol ve yazılmış kader, halk şiiri ile âşık edebiyatının ortak duygu ve düşünce unsurlarıdır. Şiir sevdayı yalnız bireysel bir acı olarak işlemez; dünya kahrı ve ilahi irade bağlamına taşır. Eserin öne çıkan yönü, tabiat ile gönül arasında kurduğu benzerliği kader ve inanç düşüncesiyle tamamlamasıdır.
sira: 22
