baslik: Arkadaş
aciklama: Mehmet Aykurt’un Arkadaş adlı şiiri; gitmeye karar verenin ardından yalvarmamayı, kinli ve vefasız kişiden uzak durmayı öğütler.
tarih: "2027-01-25"
icerikTuru: Şiir
anaTema: Ayrılık karşısında özsaygı
konu: Gitmek isteyen kişiye boyun bükmemek, hâlden anlamayan ve uzatılan eli tutmayan insandan vazgeçmek, kinli kişinin sunduğuna aldanmamak
siirTuru: Didaktik ve lirik şiir
gelenek: Halk şiiri geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gidenin ardından hiç ağlama
  Yola düşen geri dönmez arkadaş
  Önünde durup da asla yalvarma
  Minnet edip boyun bükme arkadaş

  Kafaya koymuşsa yola çıkmayı
  Ne güzü bekler ne de baharı
  Bir gün olsun sıkma canını
  Üzüntüye meyletme arkadaş

  Sen susunca anlamazsa hâlinden
  Uzatınca tutmaz ise elinden
  Hissedersen çıktığını kalbinden
  Kılın bile kıpramasın arkadaş

  Kin varsa bir insanın kalbinde
  Zehir eksik olmaz onun sözünde
  Dünyayı serse bile önüne
  Dönüp bakma lokmasına arkadaş
degerlendirme:
  genelBakis: “Arkadaş”, gitmeye karar veren birinin ardından kendini tüketmemeyi ve özsaygıyı korumayı öğütleyen şiirdir. Söyleyici yalvarmayı, boyun bükmeyi ve üzüntüye kapılmayı reddeder. Suskun hâli anlamayan, uzatılan eli tutmayan kişinin kalpten çıktığı kabul edilmelidir. Son bölümde kinli insanın sözü zehre benzetilir; sunduğu dünya bile güvenilmeyecek bir lokma olarak görülür.
  temaVeKonu: Ana tema ayrılık karşısında özsaygıdır. Şiirin konusu, gitmeyi kafasına koyan insanı durdurmaya çalışmamak ve mevsim beklemeden çıkacağı yola razı olmaktır. İlişkinin ölçüsü hâlden anlamak ve uzatılan eli tutmaktır. Bunlar yoksa kişinin ardından üzülmemek istenir. Kin taşıyan kalbin sözünün de zehirli olacağı belirtilerek uzaklaşmanın yalnız duygusal değil, ahlaki bir korunma olduğu anlatılır.
  dilVeSoylevis: Dil doğrudan, teselli edici ve kararlı bir öğüt tonundadır. “Arkadaş” hitabı her dörtlüğün sonunda tekrarlanarak samimi bir sohbet kurar. Yol, güz, bahar, el, kalp, zehir ve lokma imgeleri ayrılığı gündelik ve somut unsurlarla anlatır. “Kılın bile kıpramasın” sözü kesin kopuşu halk söyleyişiyle vurgular; “dünyayı serse” abartısı görünüşte büyük tekliflerin bile değersizliğini gösterir.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır; bazı dizelerde ölçü farklılıkları görülür. Dörtlük sonlarındaki “arkadaş” redifi öğütlerin ortak muhatabını korur. İlk bölüm ayrılışı kabullenir, ikinci bölüm üzüntüyü engeller, üçüncü bölüm ilişkinin bittiğini belirler, son bölüm ise kinli kişiden gelecek tehlikeyi açıklar. Yapı giderek daha kesin bir uzaklaşmaya yönelir.
  gelenekVeSonuc: Yol ve mevsim imgeleri, doğrudan hitap ve tekrarlanan öğütler şiiri halk şiiri geleneğine yaklaştırır. Ayrılık acısını büyütmek yerine insanın onurunu koruması öne çıkarılır. Eserin sonucu, sevginin yalvarma ve minnetle sürdürülemeyeceğidir; hâlden anlamayan, eli tutmayan ve kin taşıyan kişiye karşı en sağlıklı tutum dönüp bakmadan uzaklaşmaktır.
