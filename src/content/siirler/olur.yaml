baslik: Olur
aciklama: Mehmet Aykurt’un Olur adlı şiiri; sevda, umut ve fedakârlığı halk şiiri söyleyişiyle geleceğe uzanan bir bağlılık içinde işler.
tarih: "2026-08-01"
icerikTuru: Şiir
anaTema: Sevda, umut ve fedakârlık
konu: Sevginin umutla büyütülmesi, fedakârlıkla korunması ve kalıcı bir hatıraya dönüşmesi
siirTuru: Lirik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gel seninle umut ekelim toprağa
  Baharında filizlenir dal olur
  Büyütelim lazım olur yarına
  Meyveleri ümit olur bal olur

  Ne gelirse gelsin benim başıma
  İsterlerse kast eylesin canıma
  Senin için kanım aksa toprağa
  Dört bir yanım kıpkırmızı bağ olur

  Çınar gibi gökyüzüne yükselir
  Görenlerin yüreğini titretir
  Türkü olup dilden dile söylenir
  Aşığın sazında sırma tel olur

  Der Mehmet'im Yandım ahu zarına
  Bir gecede aklar düştü saçıma
  Dönüp gitme öyle Allah aşkına
  Yanar gönlüm sevdan ile kül olur
degerlendirme:
  genelBakis: “Olur”, sevdayı umutla başlayan, fedakârlıkla derinleşen ve türküye dönüşerek kalıcılık kazanan bir gönül hâli olarak işler. Şiirde toprağa ekilen umut, filiz, dal, meyve ve çınar imgeleriyle büyür; âşığın uğruna yanmayı göze aldığı güçlü bir bağlılığa ulaşır. Genel havaya sevgi, kararlılık ve içli bir yakarış hâkimdir.
  temaVeKonu: Şiirin ana teması sevda, umut ve fedakârlıktır. İlk dörtlükte iki kişinin geleceğe birlikte umut ekmesi ve bu umudun meyve vermesi anlatılır. Sonraki dörtlüklerde sevgi uğruna canı göze alma, sevdanın çevreye yayılması ve dilden dile söylenecek bir türküye dönüşmesi öne çıkar. Son bölüm, ayrılık korkusuyla yakarışa yönelir.
  dilVeSoylevis: Dil sade, doğrudan ve halk söyleyişine yakındır. “Umut ekelim”, “dal olur”, “bağ olur”, “sırma tel olur” sözleri soyut duyguları tabiat ve saz imgeleriyle somutlaştırır. Sevgiliye yönelen sesleniş, şiire konuşma sıcaklığı verir. “Der Mehmet’im” biçimindeki söyleyiş ise şairin kendi adını anarak sözünü kişisel bir mühürle tamamlamasını sağlar.
  ahenkVeYapi: Şiir dört dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı olarak yaslanır. Dörtlük sonlarında tekrarlanan “olur” sözcüğü belirgin bir redif görevi görerek anlam ile sesi bir arada tutar. “Toprağa / yarına”, “başıma / canıma”, “zarına / saçıma / aşkına” ses yakınlıkları ahengi destekler; düzenli dörtlük yapısı türkü söyleyişini güçlendirir.
  gelenekVeSonuc: Toprak, bahar, çınar, türkü, saz, sırma tel, ahu zar ve yanmak gibi unsurlar şiiri halk şiiri ile âşık edebiyatının duygu dünyasına bağlar. Sevginin hem yeşerten hem yakan bir güç olarak sunulması geleneksel sevda anlayışıyla uyumludur. Şiirin öne çıkan yönü, umuttan fedakârlığa uzanan duygusal gelişimi tabiat ve saz çevresinde bütünleştirmesidir.
sira: 12
