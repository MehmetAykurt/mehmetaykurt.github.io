baslik: Korkmalı
aciklama: Mehmet Aykurt’un Korkmalı adlı şiiri; açık bilgisizlikten çok olgun görünen ikiyüzlü ve yalandan utanmayan kişiden sakınmayı öğütler.
tarih: "2027-02-21"
icerikTuru: Şiir
anaTema: İkiyüzlülük ve sahte olgunluk
konu: Cahilden çok olgunluk görüntüsü veren, dilinde dinî söz ve elinde Kur’an olduğu hâlde yalan söyleyen yüzsüz kişiden korkulması
siirTuru: Didaktik şiir ve taşlama
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 11’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Cahilin sözüne itibar etme
  Kemali olandan korkmalı asıl
  İmansız olanın vurur diline
  Münafık olandan korkmalı asıl

  Dilinde kelam elinde Kuran
  İki konuşursa birisi yalan
  İster halktan utan isterse Hak'tan
  Yüzü kızarmayandan korkmalı asıl
degerlendirme:
  genelBakis: “Korkmalı”, açıkça cahil ya da inançsız görünen kişiden çok olgunluk ve dindarlık görüntüsü altında ikiyüzlülük yapan insanı tehlikeli bulan kısa bir taşlamadır. Dilinde kelam, elinde Kur’an bulunan kişinin sözlerinin yarısı yalan olunca dış görünüş güvenilirliğini kaybeder. Şiir, gerçek tehdidi gizli niyet, sahte kemal ve halktan da Hak’tan da utanmayan yüzsüzlükte görür.
  temaVeKonu: Ana tema ikiyüzlülük ve sahte olgunluktur. Şiirin konusu, cahilin sözünün kolayca tanınabileceği fakat “kemal” sahibi görünen münafığın insanı yanıltabileceğidir. Dinî semboller ve güzel sözler davranışla doğrulanmadığında birer örtüye dönüşür. Yalan söylerken yüzü kızarmayan kişinin utanma ve vicdan sınırlarını yitirmesi, ondan korkulmasının asıl sebebi olarak sunulur.
  dilVeSoylevis: Dil özlü, kesin ve uyarıcıdır. “Cahil, kemal, imansız, münafık” karşıtlıkları görünür kusurla gizli kötülüğü ayırır. “Dilinde kelam elinde Kuran” paralelliği dışarıdaki dindarlık görüntüsünü güçlü biçimde kurar. Ardından gelen “iki konuşursa birisi yalan” sözü bu görüntüyü aniden bozar. “Korkmalı asıl” tekrarı, şairin tehlike sıralamasındaki önceliği sürekli vurgular.
  ahenkVeYapi: Şiir iki dörtlükten oluşur ve 11’li hece ölçüsüne ağırlıklı biçimde yaslanır. Dörtlüklerin ikinci ve dördüncü dizelerinde yinelenen “korkmalı asıl” redifi kısa metne güçlü bir hüküm ritmi verir. İlk bölüm insan tiplerini karşılaştırır; ikinci bölüm sahte dindarlığın somut görüntüsünü ve yalanını gösterir. “Kuran/yalan/Hak’tan” ses yakınlıkları finaldeki ahlaki uyarıyı pekiştirir.
  gelenekVeSonuc: Dinî ve ahlaki kavramlarla insan tipini yermesi, tekrar ve doğrudan öğüt kullanması eseri halk şiirinin taşlama geleneğine bağlar. Şiir bilgisizliği onaylamaz; ancak açık kusurun gizli ikiyüzlülükten daha kolay tanınabileceğini söyler. Sonuçta insanı güvenilir yapan elindeki kutsal kitap ya da dilindeki kelam değil, doğruluğu ve utanma duygusudur.
