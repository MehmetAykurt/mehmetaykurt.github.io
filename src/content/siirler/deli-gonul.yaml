baslik: Deli gönül
aciklama: Mehmet Aykurt’un Deli gönül adlı şiiri; aşkın yaralarını ve eski sevda anlatılarını anarken gönlü hem sakındırır hem sevmeye çağırır.
tarih: "2027-01-01"
icerikTuru: Şiir
anaTema: Aşk karşısında gönlün çelişkisi
konu: Ferhat, Mecnun, Kerem ve Aslı’nın aşkları hatırlatılarak gönlün kara sevdadan sakındırılması, sonunda sevginin kutsallığıyla yeniden sevdalanmaya çağrılması
siirTuru: Lirik ve didaktik şiir
gelenek: Halk şiiri ve âşık edebiyatı geleneği
olcu: 8’li hece ölçüsü ağırlıklı
youtubeAdresi: ""
siirMetni: |-
  Gel aranma orda burda
  Bulamazsın deli gönül
  Eren var mı muradına
  Yaralanma boşa gönül

  Her çiçeğin rengi ayrı
  Kimi beyaz kimi allı
  Ferhat olup şu dağları
  Delemezsin deli gönül

  Bak Mecnun'um düştü çöle
  Kerem yandı Aslı diye
  Şimdi canın versen bile
  Bilinmezsin deli gönül

  Kara sevda yakar imiş
  Hem yakar yıkar imiş
  Anlamadım bilmem neymiş
  Biz görmedik deli gönül

  Aklar düşer saçlarına
  Muhtaç eder değmez kula
  Heves etme şu zamanda
  Tövbe eyle deli gönül

  Der Mehmet'im sev ki sevil
  Sözlerimi terse çevir
  En kutsal değer sevgidir
  Var sevdalan deli gönül
degerlendirme:
  genelBakis: “Deli gönül”, gönlü kara sevdanın yaralarından sakındıran fakat sonunda sevgiden vazgeçemeyen çelişkili bir iç konuşmadır. Ferhat, Mecnun, Kerem ve Aslı gibi aşk kahramanlarının acıları uyarı amacıyla hatırlatılır. İlk beş dörtlükte arama, yaralanma ve heves etme denirken son bölüm bütün öğütleri tersine çevirir; sevginin kutsallığı gönlü yeniden sevdalanmaya çağırır.
  temaVeKonu: Ana tema aşk karşısında gönlün akıl ile istek arasında kalmasıdır. Şiirin konusu, her sevdanın murada erdirmediğini bilen söyleyicinin gönlü geçmiş aşk hikâyeleri üzerinden uyarmasıdır. Kara sevdanın yakıp yıktığı, insanı yaşlandırdığı ve değmeyen kişiye muhtaç ettiği söylenir. Buna rağmen “sev ki sevil” hükmüyle sevginin kendisi suçlanmaz; yanlış zamana ve kişiye bağlanan aşk sorgulanır.
  dilVeSoylevis: Dil samimi, öğütleyici ve gönülle konuşan halk şiiri üslubundadır. “Deli gönül” hitabı iç benliği hem azarlar hem şefkatle sahiplenir. Çiçek renkleri sevginin çeşitliliğini, Ferhat’ın dağı, Mecnun’un çölü ve Kerem’in yanışı aşkın bedelini simgeler. “Sözlerimi terse çevir” ifadesi söyleyicinin kendi öğütlerine karşı ironik bir dönüş yapmasını ve gönlün bağımsızlığını kabul etmesini sağlar.
  ahenkVeYapi: Şiir altı dörtlükten oluşur ve 8’li hece ölçüsüne ağırlıklı olarak yaslanır; bazı dizelerde hece farklılıkları görülür. Dörtlük sonlarındaki “gönül” redifi sürekli muhatabı belirler. “Yakar/yıkar” ses tekrarları kara sevdanın yıkıcılığını pekiştirir. İlk beş bölüm olumsuz emirlerle gönlü durdurmaya çalışırken altıncı bölüm olumlu emirlere geçer; yapının asıl kırılma noktası bu finaldir.
  gelenekVeSonuc: Gönülle söyleşme, tapşırma ve halk aşk hikâyelerine gönderme, şiiri âşık edebiyatının güçlü damarlarından birine bağlar. Akılcı öğüt ile sevdalanma arzusu arasındaki çatışma, gelenekteki “söz dinlemez gönül” düşüncesini sürdürür. Eserin sonucu sevdayı bütünüyle reddetmek değildir; acı ihtimaline rağmen sevginin en kutsal değer olduğunu kabul ederek gönlün yaşama yönelişini savunmaktır.
